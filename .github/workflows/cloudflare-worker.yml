# Deploys the contact/lead API Worker (cloudflare/api-worker) when its files change on main.
#
# INACTIVE until the repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, D1: Edit,
# Workers KV Storage: Edit) and CLOUDFLARE_ACCOUNT_ID exist; the gate step skips otherwise.
# Worker secrets (TURNSTILE_SECRET, IP_SALT) are already stored on the Worker and are not touched here.
name: Cloudflare Worker (mitchjmiller-api)

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/api-worker/**'
      - '.github/workflows/cloudflare-worker.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-worker-api
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check for Cloudflare secrets
        id: gate
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping the Worker deploy."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'

      - name: Deploy Worker
        if: steps.gate.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config cloudflare/api-worker/wrangler.toml
