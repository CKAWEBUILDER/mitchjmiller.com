<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Do AI guardrails stop GEO-planted misinformation? — living infographic</title>
<meta name="description" content="Counter-GEO-Bench (arXiv 2609.02316): attack success, accuracy and answer quality for four defenses across three open-weight models. Every number sourced.">
<meta name="robots" content="noindex">
<!--
  LIVING INFOGRAPHIC — TEMPLATE
  Self-contained. No external requests. Works from file://.

  Replace only the two JSON blocks below (#viz-data, and optionally #viz-palettes).
  Everything else is the kit. See README.md and SPEC.md in this folder.

  URL parameters (all optional):
    ?static=1            freeze at the settled state (poster capture)
    ?poster=1            poster layout, fills the viewport exactly (implies static)
    ?gif=1               GIF layout: seamless backdrop loop + honesty strip
    ?frame=N&frames=M    deterministic frame N of M over the reveal timeline
    ?t=1.8               deterministic absolute time in seconds
    ?palette=aurora|ember|verdant
    ?seed=20260914
    ?vertical=b2b|b2c|marketplace
    ?intent=informational|commercial|transactional
    ?motion=reduce       force the reduced-motion path

  Export API (window.VIZ):
    await VIZ.ready            resolves once first paint is done
    VIZ.duration               reveal timeline length, seconds
    await VIZ.seek(seconds)    render deterministically at that time
    await VIZ.frame(n, total)  render deterministically at frame n of total
    VIZ.setState({palette, seed, vertical, intent})
    VIZ.snapshot()             current state + settled values (JSON-safe)
-->
<style>
/* ---------------------------------------------------------------- tokens */
:root{
  color-scheme:dark;
  --ground:#0A1A30; --panel:#12294A; --panel-2:#0E2240; --line:#2B4670;
  --text:#EAF2FA; --muted:#A8C0D8;
  --a1:#5BF0F5; --a2:#C6FF4F; --a3:#FF7AB6; --a4:#FFC53D; --a5:#B9A2FF;
  --pos:var(--a2); --neg:var(--a3);
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,"Apple Color Emoji",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --r:10px; --wrap:1160px;
  --gut:clamp(16px,3.2vw,40px);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --dur:.28s;
}
@media (prefers-reduced-motion:reduce){:root{--dur:0s}}
html[data-motion="reduced"]{--dur:0s}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--text); font-family:var(--font);
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,p,figure,ul,ol{margin:0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:is(button,select,summary,a,[tabindex]):focus-visible{outline:3px solid var(--a1);outline-offset:3px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------------------------------------------------------------- frame */
.viz{position:relative;isolation:isolate;min-height:100svh;overflow:hidden}
#bg{position:absolute;inset:0;width:100%;height:100%;z-index:-2;display:block}
.viz::after{ /* vignette keeps text contrast constant over the generative field */
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(115% 82% at 50% 36%,
    transparent 0%,
    color-mix(in srgb,var(--ground) 22%,transparent) 46%,
    color-mix(in srgb,var(--ground) 62%,transparent) 78%,
    color-mix(in srgb,var(--ground) 88%,transparent) 100%);
}
.shell{width:min(var(--wrap),100%);margin-inline:auto;padding:clamp(22px,4vw,54px) var(--gut) clamp(28px,5vw,64px);position:relative}

/* ---------------------------------------------------------------- header */
/* The generative field is loud on purpose; type gets its own scrim so the
   measured contrast ratios hold wherever the mandala happens to land. */
.shell>header{position:relative;isolation:isolate}
.shell>header::before{content:"";position:absolute;inset:-30px -44px -26px -44px;z-index:-1;border-radius:20px;
  background:radial-gradient(95% 125% at 16% 46%,
    color-mix(in srgb,var(--ground) 94%,transparent) 0%,
    color-mix(in srgb,var(--ground) 88%,transparent) 44%,
    color-mix(in srgb,var(--ground) 46%,transparent) 76%,
    transparent 100%)}
.kick{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.eyebrow{font-size:.68rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--a1)}
.badge{font-size:.63rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  border:1px solid var(--a4);color:var(--a4);border-radius:999px;padding:3px 9px;line-height:1.4}
h1{font-size:clamp(1.85rem,4.4vw,3.15rem);line-height:1.05;letter-spacing:-.03em;font-weight:800;text-wrap:balance;max-width:20ch}
h1 .lit{color:var(--a2)}
.deck{margin-top:14px;max-width:62ch;color:var(--muted);font-size:clamp(.95rem,1.2vw,1.06rem)}

/* ------------------------------------------------------------- the ask */
.ask{margin-top:clamp(22px,3.4vw,38px);border:1px solid var(--line);border-radius:var(--r);
  background:color-mix(in srgb,var(--panel) 95%,transparent);backdrop-filter:blur(8px);padding:clamp(14px,2.2vw,22px);
  box-shadow:0 24px 60px color-mix(in srgb,var(--ground) 70%,transparent)}
.ask-line{font-size:clamp(1.05rem,2.1vw,1.5rem);line-height:1.45;font-weight:600;letter-spacing:-.015em;text-wrap:pretty}
.tok{
  display:inline-flex;align-items:center;gap:.4em;position:relative;
  background:var(--panel-2);border:1px solid var(--a1);color:var(--a1);
  border-radius:999px;padding:.12em .75em .18em;margin-inline:.12em;
  font:inherit;font-weight:700;appearance:none;-webkit-appearance:none;
  min-height:38px;line-height:1.25;cursor:pointer;
  transition:background var(--dur) var(--ease-out),color var(--dur) var(--ease-out);
}
.tok:hover{background:var(--a1);color:var(--ground)}
.tok option{background:var(--panel);color:var(--text)}
.ask-hint{margin-top:10px;font-size:.8rem;color:var(--muted)}
.prompts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.prompt{
  border:1px solid var(--line);background:transparent;color:var(--text);
  border-radius:999px;padding:9px 15px;font-size:.86rem;font-weight:600;min-height:40px;
  text-align:left;transition:border-color var(--dur) var(--ease-out),background var(--dur) var(--ease-out),transform var(--dur) var(--ease-out);
}
.prompt:hover{border-color:var(--a2);background:color-mix(in srgb,var(--a2) 12%,transparent)}
.prompt[aria-pressed="true"]{border-color:var(--a2);background:color-mix(in srgb,var(--a2) 18%,transparent);color:var(--a2)}
.prompt .go{color:var(--a2);font-weight:800}
.replay{border:1px solid var(--a2);background:var(--a2);color:var(--ground);border-radius:999px;
  padding:9px 17px;font-size:.86rem;font-weight:800;min-height:40px}
.replay:hover{filter:brightness(1.08)}

/* progress of the reveal — Zeigarnik cue, not a fake loader */
.rail{position:relative;height:3px;margin-top:16px;background:color-mix(in srgb,var(--line) 70%,transparent);border-radius:2px;overflow:hidden}
.rail i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--a1),var(--a2));border-radius:2px}

/* ---------------------------------------------------------------- stage */
.stage{display:grid;grid-template-columns:1fr auto 1fr;gap:clamp(10px,1.6vw,20px);align-items:stretch;margin-top:clamp(20px,3vw,34px)}
.col{border:1px solid var(--line);border-radius:var(--r);padding:clamp(14px,2vw,22px);
  background:linear-gradient(180deg,color-mix(in srgb,var(--panel) 96%,transparent),color-mix(in srgb,var(--panel-2) 97%,transparent));
  box-shadow:0 24px 60px color-mix(in srgb,var(--ground) 70%,transparent);
  display:flex;flex-direction:column;gap:10px;min-width:0}
.col[data-side="cited"]{border-color:color-mix(in srgb,var(--a2) 55%,var(--line))}
.col[data-side="absent"]{border-color:color-mix(in srgb,var(--a3) 45%,var(--line))}
.col-head{display:grid;gap:2px;align-content:start}
.col-name{font-size:.78rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.col[data-side="cited"] .col-name{color:var(--a2)}
.col[data-side="absent"] .col-name{color:var(--a3)}
.col-sub{font-size:.76rem;color:var(--muted)}
.hero{display:flex;align-items:flex-end;gap:.18em;font-variant-numeric:tabular-nums;
  font-size:clamp(2.7rem,7.6vw,4.9rem);font-weight:800;letter-spacing:-.045em;line-height:.92}
.hero .u{font-size:.36em;font-weight:700;letter-spacing:-.01em;padding-bottom:.42em;color:var(--muted)}
.col[data-side="cited"] .hero{color:var(--a2)}
.col[data-side="absent"] .hero{color:var(--a3)}
.hero-label{font-size:.88rem;color:var(--text);font-weight:600}
.gauge{margin-top:2px}
.gauge svg{display:block;width:100%;height:auto;max-height:88px}
.delta{align-self:center;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:0 clamp(2px,1vw,10px);min-width:86px;text-align:center;position:relative;isolation:isolate}
.delta::before{content:"";position:absolute;inset:-18px -10px;z-index:-1;border-radius:16px;
  background:radial-gradient(72% 62% at 50% 50%,
    color-mix(in srgb,var(--ground) 90%,transparent) 0%,
    color-mix(in srgb,var(--ground) 62%,transparent) 62%,
    transparent 100%)}
.delta-x{font-variant-numeric:tabular-nums;font-size:clamp(1.15rem,2.8vw,1.85rem);font-weight:800;letter-spacing:-.03em;color:var(--a4);white-space:nowrap}
.delta-l{font-size:.64rem;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:700}
.delta-arrow{font-size:1.1rem;color:var(--a4);line-height:1}

/* ---------------------------------------------------------------- ledger */
.ledger{margin-top:clamp(16px,2.4vw,26px);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  background:color-mix(in srgb,var(--panel-2) 96%,transparent);
  box-shadow:0 24px 60px color-mix(in srgb,var(--ground) 70%,transparent)}
.row{display:grid;grid-template-columns:minmax(0,1.35fr) 84px minmax(0,1.5fr) 84px 74px;gap:clamp(6px,1vw,14px);
  align-items:center;padding:clamp(10px,1.5vw,15px) clamp(12px,1.8vw,18px);border-top:1px solid color-mix(in srgb,var(--line) 62%,transparent)}
.row:first-child{border-top:0}
.row-label{font-size:.87rem;font-weight:600;min-width:0}
.row-note{display:block;font-size:.72rem;color:var(--muted);font-weight:400;margin-top:2px}
.val{font-variant-numeric:tabular-nums;font-size:clamp(1rem,1.9vw,1.28rem);font-weight:800;letter-spacing:-.025em;white-space:nowrap}
.val.absent{color:var(--a3);text-align:right}
.val.cited{color:var(--a2);text-align:left}
.bars{display:grid;gap:4px;min-width:0}
.bar{height:9px;border-radius:5px;background:color-mix(in srgb,var(--line) 55%,transparent);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;width:0;border-radius:5px;display:block}
.bar.absent i{background:linear-gradient(90deg,color-mix(in srgb,var(--a3) 55%,transparent),var(--a3))}
.bar.cited i{background:linear-gradient(90deg,color-mix(in srgb,var(--a2) 55%,transparent),var(--a2))}
.row-delta{font-variant-numeric:tabular-nums;font-size:.86rem;font-weight:800;text-align:right;white-space:nowrap}
.row-delta[data-dir="good"]{color:var(--a2)}
.row-delta[data-dir="bad"]{color:var(--a3)}
.delta-x[data-dir="bad"]{color:var(--a3)}

/* source markers */
.src{display:inline-block;vertical-align:super;margin-left:.28em;font-size:.58em;font-weight:800;letter-spacing:.04em;
  border:1px solid color-mix(in srgb,var(--muted) 60%,transparent);color:var(--muted);background:transparent;
  border-radius:4px;padding:0 3px;line-height:1.5;min-height:0}
.src:hover{color:var(--a4);border-color:var(--a4)}
#pop{position:absolute;z-index:40;max-width:min(320px,80vw);background:var(--panel);border:1px solid var(--a4);
  border-radius:8px;padding:10px 12px;font-size:.78rem;line-height:1.5;color:var(--text);
  box-shadow:0 18px 40px rgba(0,0,0,.45)}
#pop[hidden]{display:none}
#pop b{display:block;color:var(--a4);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
#pop .as{display:block;color:var(--muted);margin-top:5px;font-family:var(--mono);font-size:.72rem}

/* ---------------------------------------------------------------- serp */
.serp{margin-top:clamp(16px,2.4vw,26px);border:1px solid var(--line);border-radius:var(--r);padding:clamp(14px,2vw,20px);
  background:color-mix(in srgb,var(--panel) 95%,transparent);
  box-shadow:0 24px 60px color-mix(in srgb,var(--ground) 70%,transparent)}
.serp-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.serp-title{font-size:.78rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--a5)}
.serp-q{font-family:var(--mono);font-size:.85rem;color:var(--text);background:var(--panel-2);border:1px solid var(--line);
  border-radius:6px;padding:5px 9px;display:inline-block;max-width:100%;overflow-wrap:anywhere}
.serp-body{display:grid;gap:clamp(12px,2vw,26px)}
@media (min-width:900px){.serp-body{grid-template-columns:minmax(0,1fr) minmax(200px,28ch)}}
.serp-rows{display:grid;gap:7px;align-content:start}
.serp-note{font-size:.86rem;line-height:1.65;color:var(--text);border-left:3px solid var(--a5);padding-left:12px;align-self:center}

.sr-row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px;align-items:center;
  border-left:3px solid var(--line);padding:7px 0 7px 10px;font-size:.84rem}
.sr-row[data-kind="answer"]{border-left-color:var(--a5)}
.sr-row[data-kind="citation"]{border-left-color:var(--a2)}
.sr-row[data-kind="organic"]{border-left-color:var(--a1)}
.sr-row[data-kind="pack"]{border-left-color:var(--a4)}
.sr-row[data-kind="ad"]{border-left-color:var(--a3)}
.sr-kind{font-size:.63rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.sr-text{min-width:0;overflow-wrap:anywhere}
.sr-text em{font-style:normal;color:var(--a2);font-weight:700}

/* ---------------------------------------------------------------- footer */
.foot{margin-top:clamp(18px,2.6vw,30px);display:grid;gap:14px;position:relative;isolation:isolate}
.foot::before{content:"";position:absolute;inset:-16px -26px -22px -26px;z-index:-1;border-radius:16px;
  background:linear-gradient(0deg,
    color-mix(in srgb,var(--ground) 94%,transparent) 0%,
    color-mix(in srgb,var(--ground) 90%,transparent) 55%,
    color-mix(in srgb,var(--ground) 34%,transparent) 100%)}
.sources{border:1px solid var(--line);border-radius:var(--r);background:color-mix(in srgb,var(--panel-2) 95%,transparent)}
.sources>summary{cursor:pointer;list-style:none;padding:12px 16px;font-size:.82rem;font-weight:700;display:flex;gap:10px;align-items:center}
.sources>summary::-webkit-details-marker{display:none}
.sources>summary::before{content:"▸";color:var(--a4);font-size:.9rem;transition:transform var(--dur) var(--ease-out)}
.sources[open]>summary::before{transform:rotate(90deg)}
.sources-body{padding:0 16px 14px;display:grid;gap:9px}
.s-item{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;font-size:.8rem;line-height:1.5;
  padding:9px 10px;border-radius:8px;border:1px solid transparent}
.s-item.hl{border-color:var(--a4);background:color-mix(in srgb,var(--a4) 10%,transparent)}
.s-id{font-family:var(--mono);font-size:.72rem;font-weight:800;color:var(--a4)}
.s-meta{display:block;color:var(--muted);font-family:var(--mono);font-size:.72rem;margin-top:3px;overflow-wrap:anywhere}
.s-item a{color:var(--a1)}
.src-line{display:none;font-size:.78rem;line-height:1.5;color:var(--muted);font-family:var(--mono)}
html[data-mode~="gif"] .src-line{display:block}
.honesty{font-size:.76rem;line-height:1.6;color:var(--muted);border-left:3px solid var(--a4);padding-left:12px}
.honesty b{color:var(--a4)}
.by{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between;font-size:.74rem;color:var(--muted);
  border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent);padding-top:12px}

/* ---------------------------------------------------------------- narrow */
/* Narrow-viewport layout. Scoped away from poster/gif, whose export viewports
   are narrow by definition but must keep the side-by-side composition. */
@media (max-width:860px){
  :where(html:not([data-mode~="poster"]):not([data-mode~="gif"])) .stage{grid-template-columns:1fr;gap:12px}
  :where(html:not([data-mode~="poster"]):not([data-mode~="gif"])) .delta{flex-direction:row;gap:10px;min-width:0;padding:2px 0}
  :where(html:not([data-mode~="poster"]):not([data-mode~="gif"])) .delta-arrow{transform:rotate(90deg)}
  :where(html:not([data-mode~="poster"]):not([data-mode~="gif"])) .row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"label label" "cited absent" "bars bars" "d d";gap:6px 10px}
  :where(html:not([data-mode~="poster"]):not([data-mode~="gif"])) .row-label{grid-area:label}
  :where(html:not([data-mode~="poster"]):not([data-mode~="gif"])) .val.cited{grid-area:cited;text-align:left}
  :where(html:not([data-mode~="poster"]):not([data-mode~="gif"])) .val.absent{grid-area:absent;text-align:right}
  :where(html:not([data-mode~="poster"]):not([data-mode~="gif"])) .bars{grid-area:bars}
  :where(html:not([data-mode~="poster"]):not([data-mode~="gif"])) .row-delta{grid-area:d;text-align:left}
  :where(html:not([data-mode~="poster"]):not([data-mode~="gif"])) .sr-row{grid-template-columns:1fr;gap:3px}
}

/* ---------------------------------------------------------------- poster */
html[data-mode~="poster"] body{overflow:hidden}
html[data-mode~="poster"] .viz{height:100svh;min-height:0}
html[data-mode~="poster"] .shell{height:100%;display:flex;flex-direction:column;gap:clamp(10px,1.4vh,20px);
  padding:clamp(28px,4vh,56px) clamp(28px,4vw,56px);width:100%;max-width:none}
html[data-mode~="poster"] .ask,
html[data-mode~="poster"] .prompts,
html[data-mode~="poster"] .rail,
html[data-mode~="poster"] .replay{display:none}
html[data-mode~="poster"] .sources{border:0;background:transparent}
html[data-mode~="poster"] .sources>summary{display:none}
html[data-mode~="poster"] .sources-body,html[data-mode~="gif"] .sources-body{display:grid}
html[data-mode~="poster"] .sources-body{padding:0;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px}
html[data-mode~="poster"] .s-item{padding:0;border:0;font-size:.7rem}
html[data-mode~="poster"] h1{font-size:clamp(2.2rem,4.4vh,3.6rem);max-width:26ch}
html[data-mode~="poster"] .hero{font-size:clamp(3rem,9vh,6rem)}
html[data-mode~="poster"] .stage{margin-top:0}
html[data-mode~="poster"] .foot{margin-top:auto}
/* --fit is driven by fitStill(): the layout shrinks until it fits the frame,
   so swapping in a longer dataset can never clip a row off the poster. */
html[data-mode~="poster"] .shell,html[data-mode~="gif"] .shell{gap:calc(clamp(8px,1.4vh,20px)*var(--fit,1))}
/* Sections must keep their natural height so overflow is real and fitStill()
   can see it — flex-shrink would silently clip a ledger row instead. */
html[data-mode~="poster"] .shell>*,html[data-mode~="gif"] .shell>*{flex:0 0 auto}
html[data-mode~="poster"] .col,html[data-mode~="gif"] .col{padding:calc(clamp(12px,2vh,22px)*var(--fit,1))}
html[data-mode~="poster"] .row,html[data-mode~="gif"] .row{padding-block:calc(clamp(8px,1.5vh,15px)*var(--fit,1))}
html[data-mode~="poster"] .hero,html[data-mode~="gif"] .hero{font-size:calc(clamp(2.4rem,8.6vh,5.6rem)*var(--fit,1))}
html[data-mode~="poster"] h1,html[data-mode~="gif"] h1{font-size:calc(clamp(1.5rem,4.3vh,3.4rem)*var(--fit,1))}
html[data-mode~="poster"] .val{font-size:calc(1.22rem*var(--fit,1))}
html[data-mode~="poster"] .row-label{font-size:calc(.88rem*var(--fit,1))}
html[data-mode~="gif"] .val{font-size:calc(1.5rem*var(--fit,1))}
html[data-mode~="gif"] .row-label{font-size:calc(1rem*var(--fit,1))}
html[data-mode~="gif"] .row{padding-block:calc(13px*var(--fit,1))}
html[data-mode~="gif"] .bar{height:11px}
html[data-mode~="gif"] .col-name{font-size:.9rem}
html[data-mode~="poster"] .delta-x,html[data-mode~="gif"] .delta-x{font-size:calc(1.9rem*var(--fit,1))}
html[data-mode~="poster"] .delta-arrow,html[data-mode~="gif"] .delta-arrow{font-size:calc(1.5rem*var(--fit,1))}
html[data-mode~="gif"] .col-sub,html[data-mode~="gif"] .hero-label{font-size:.85rem}
html[data-mode~="poster"] .poster-q{font-size:calc(clamp(.95rem,2.1vh,1.35rem)*var(--fit,1))}
html[data-mode~="poster"] .poster-q{display:block}

<script>
'use strict';
(function () {
/* ============================================================== plumbing */
const $ = id => document.getElementById(id);
const q = new URLSearchParams(location.search);
const DATA = JSON.parse($('viz-data').textContent);
const PALETTES = JSON.parse($('viz-palettes').textContent);
const root = document.documentElement;

const MODE = {
  poster: q.get('poster') === '1',
  gif: q.get('gif') === '1',
  static: q.get('static') === '1' || q.get('poster') === '1' || q.has('frame') || q.has('t'),
};
root.dataset.mode = [MODE.poster && 'poster', MODE.gif && 'gif', MODE.static && 'static'].filter(Boolean).join(' ');

const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
let reduced = q.get('motion') === 'reduce' || mq.matches;
const setMotionFlag = () => { root.dataset.motion = reduced ? 'reduced' : 'full'; };
setMotionFlag();

/* Deterministic PRNG — the same seed always yields the same mandala. */
const mulberry32 = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0;
  let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; };

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const easeOutExpo = t => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t));
const easeOutBack = t => { const c = 1.70158, s = c + 1; return 1 + s * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const easeInOut = t => (t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);

/* ============================================================ the clock
   One master clock drives every moving thing, so `seek(t)` is reproducible.
   Timeline (seconds):
     0.00–0.34  anticipation  — labels settle, columns compress slightly
     0.34–2.15  counters roll — staggered, easeOutExpo
     2.15–2.60  payoff        — delta badge overshoots in
     2.60–4.60  hold / drift  — backdrop only
*/
const T = { anticipate: 0.34, rollStart: 0.34, rollEnd: 2.15, payoff: 2.15, payoffEnd: 2.60, total: 4.60 };
const clock = { t: 0, playing: false, raf: 0, origin: 0 };
// Length of one seamless backdrop revolution in GIF mode. The exporter passes
// ?loop=<clip seconds> so the mandala turns exactly 1/K of a revolution.
const LOOP = Number(q.get('loop')) > 0 ? Number(q.get('loop')) : T.total;

/* ============================================================== state */
const firstOf = d => DATA.dimensions[d].options[0].id;
const state = {
  vertical: q.get('vertical') || firstOf('vertical'),
  intent: q.get('intent') || firstOf('intent'),
  palette: q.get('palette') || DATA.meta.palette || PALETTES[0].id,
  seed: Number(q.get('seed') || DATA.meta.seed || 1),
};
if (!DATA.values[state.vertical]) state.vertical = firstOf('vertical');
if (!DATA.values[state.vertical][state.intent]) state.intent = firstOf('intent');

const metricById = Object.fromEntries(DATA.metrics.map(m => [m.id, m]));
const sourceById = Object.fromEntries(DATA.sources.map(s => [s.id, s]));
const heroId = DATA.meta.hero || DATA.metrics[0].id;
const pair = id => DATA.values[state.vertical][state.intent][id] || [0, 0];   // [cited, absent]
const labelOf = (dim, id) => (DATA.dimensions[dim].options.find(o => o.id === id) || {}).label || id;

const fmt = (m, v) => {
  const n = Number(v).toFixed(m.decimals);
  const withCommas = m.decimals === 0 ? Number(n).toLocaleString('en-US') : n;
  return m.prefix ? `${m.unit}${withCommas}` : withCommas;
};
const unitSuffix = m => (m.prefix ? '' : m.unit);

/* ============================================================ palette */
function applyPalette(id) {
  const p = PALETTES.find(x => x.id === id) || PALETTES[0];
  state.palette = p.id;
  const s = root.style;
  s.setProperty('--ground', p.ground); s.setProperty('--panel', p.panel);
  s.setProperty('--panel-2', p.panel2); s.setProperty('--line', p.line);
  s.setProperty('--text', p.text); s.setProperty('--muted', p.muted);
  p.accents.forEach((a, i) => s.setProperty(`--a${i + 1}`, a));
  return p;
}
let PAL = applyPalette(state.palette);

/* ==================================================== generative backdrop
   Deterministic mandala: k-fold radial symmetry, recursively spawned petals
   (the fractal part), a golden-angle dot lattice, and concentric tick rings.
   Everything is a pure function of (seed, t) — no randomness at draw time.
*/
const K = 12;                       // fold symmetry; also the GIF loop divisor
const cv = $('bg'), cx = cv.getContext('2d', { alpha: false });
let specCache = null, specSeed = null, viewW = 0, viewH = 0, dpr = 1;

function buildSpec(seed) {
  const r = mulberry32(seed >>> 0);
  const rings = [];
  const n = 6 + Math.floor(r() * 2);                       // 6–7 concentric petal rings
  for (let i = 0; i < n; i++) {
    rings.push({
      radius: 0.11 + i * (0.098 + r() * 0.028),
      petals: i < 2 ? K : K * 2,                           // denser outer rings, always K-fold
      len: 0.052 + r() * 0.072,
      wide: 0.28 + r() * 0.46,
      depth: i < 3 ? 3 : 2,                                // recursion: the fractal part
      accent: Math.floor(r() * 5),
      dir: i % 2 ? 1 : -1,
      speed: 0.09 + r() * 0.15,
      phase: r() * Math.PI * 2,
      alpha: 0.26 + r() * 0.22,
      fill: 0.035 + r() * 0.045,
      width: 0.9 + r() * 1.4,
    });
  }
  const dots = [];
  const GA = Math.PI * (3 - Math.sqrt(5));
  const count = 460;
  for (let i = 0; i < count; i++) {
    dots.push({ a: i * GA, r: Math.sqrt(i / count), s: 0.6 + r() * 1.9, accent: Math.floor(r() * 5), al: 0.18 + r() * 0.34 });
  }
  const spokes = { count: K * 2, accent: Math.floor(r() * 5), alpha: 0.11 + r() * 0.07 };
  const core = { accent: Math.floor(r() * 5), petals: K, len: 0.085 + r() * 0.03, alpha: 0.42 + r() * 0.2 };
  return { rings, dots, spokes, core, tick: 0.30 + r() * 0.3 };
}
const spec = seed => {
  if (specSeed !== seed) { specCache = buildSpec(seed); specSeed = seed; }
  return specCache;
};

function petal(g, len, wide, depth, w, fillAlpha) {
  g.beginPath();
  g.moveTo(0, 0);
  g.bezierCurveTo(wide * len, -len * 0.42, wide * len, -len * 0.82, 0, -len);
  g.bezierCurveTo(-wide * len, -len * 0.82, -wide * len, -len * 0.42, 0, 0);
  if (fillAlpha) {
    const a = g.globalAlpha;
    g.globalAlpha = fillAlpha;
    g.fillStyle = g.strokeStyle;
    g.fill();
    g.globalAlpha = a;
  }
  g.lineWidth = w;
  g.stroke();
  if (depth > 0) {
    const child = len * 0.47;
    for (const sign of [-1, 1]) {
      g.save();
      g.translate(0, -len * 0.92);
      g.rotate(sign * 0.62);
      petal(g, child, wide * 0.92, depth - 1, Math.max(0.4, w * 0.72), fillAlpha && fillAlpha * 0.7);
      g.restore();
    }
  }
}

function drawBackdrop(t) {
  const w = cv.width, h = cv.height;
  if (!w || !h) return;
  const g = cx;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = PAL.ground;
  g.fillRect(0, 0, w, h);

  // The mandala is a disc, not a wash: its radius follows the short side so it
  // stays a coherent object on a tall blog page and on a square poster alike.
  const fixedAspect = MODE.gif || MODE.poster;
  const cxx = w * 0.5;
  const cyy = fixedAspect ? h * 0.46 : Math.min(h * 0.30, w * 0.42);
  const R = fixedAspect ? Math.min(w, h * 0.92) * 0.82 : w * 0.62;

  // soft ground bloom
  const grd = g.createRadialGradient(cxx, cyy, 0, cxx, cyy, R * 1.25);
  grd.addColorStop(0, PAL.panel);
  grd.addColorStop(0.62, PAL.ground);
  grd.addColorStop(1, PAL.ground);
  g.globalAlpha = 0.95; g.fillStyle = grd; g.fillRect(0, 0, w, h); g.globalAlpha = 1;

  const S = spec(state.seed);
  // Posters and GIFs are mostly opaque panel, so the field is pushed harder there.
  const FIELD = (MODE.poster || MODE.gif) ? 1.3 : 1;
  // In GIF mode the mandala turns exactly one K-th of a revolution over the
  // clip length, so the loop is seamless against the K-fold symmetry.
  const turn = MODE.gif ? (t / LOOP) * (Math.PI * 2 / K) : t;
  const breathe = 1 + Math.sin(t * 0.55 + 0.6) * 0.012;

  g.globalCompositeOperation = 'lighter';
  g.translate(cxx, cyy);

  // radial spokes — the mandala's skeleton
  g.globalAlpha = Math.min(0.5, S.spokes.alpha * FIELD); g.strokeStyle = PAL.accents[S.spokes.accent]; g.lineWidth = 1 * dpr;
  for (let i = 0; i < S.spokes.count; i++) {
    const a = turn * 0.08 + (i / S.spokes.count) * Math.PI * 2;
    g.beginPath();
    g.moveTo(Math.cos(a) * R * 0.10, Math.sin(a) * R * 0.10);
    g.lineTo(Math.cos(a) * R * 0.98 * breathe, Math.sin(a) * R * 0.98 * breathe);
    g.stroke();
  }

  // phyllotaxis dot lattice
  for (const d of S.dots) {
    const rr = d.r * R * 0.96 * breathe;
    const a = d.a + turn * 0.35;
    g.globalAlpha = Math.min(0.95, d.al * 0.7 * FIELD);
    g.fillStyle = PAL.accents[d.accent];
    g.beginPath();
    g.arc(Math.cos(a) * rr, Math.sin(a) * rr, d.s * dpr, 0, Math.PI * 2);
    g.fill();
  }

  // recursive petal rings, K-fold symmetric
  for (const ring of S.rings) {
    const rr = ring.radius * R * breathe;
    const rot = ring.phase + turn * ring.speed * ring.dir * (MODE.gif ? K : 1);
    g.strokeStyle = PAL.accents[ring.accent];
    g.globalAlpha = Math.min(0.9, ring.alpha * FIELD);
    for (let i = 0; i < ring.petals; i++) {
      const a = rot + (i / ring.petals) * Math.PI * 2;
      g.save();
      g.rotate(a);
      g.translate(0, -rr);
      petal(g, ring.len * R * breathe, ring.wide, ring.depth, ring.width * dpr, ring.fill);
      g.restore();
    }
  }

  // centre rosette — the anchor the eye lands on
  g.strokeStyle = PAL.accents[S.core.accent]; g.globalAlpha = Math.min(0.9, S.core.alpha * FIELD);
  for (let i = 0; i < S.core.petals; i++) {
    const a = -turn * 0.45 + (i / S.core.petals) * Math.PI * 2;
    g.save(); g.rotate(a); g.translate(0, -R * 0.055);
    petal(g, S.core.len * R * breathe, 0.5, 1, 1.4 * dpr, 0.07);
    g.restore();
  }

  // concentric tick rings
  g.globalAlpha = Math.min(0.5, 0.28 * FIELD); g.strokeStyle = PAL.accents[0]; g.lineWidth = 1.2 * dpr;
  for (let ri = 1; ri <= 3; ri++) {
    const rr = R * (0.24 + ri * 0.21) * breathe;
    const ticks = K * (ri + 2);
    for (let i = 0; i < ticks; i++) {
      const a = turn * 0.2 * (ri % 2 ? 1 : -1) + (i / ticks) * Math.PI * 2;
      const len = S.tick * 16 * dpr;
      g.beginPath();
      g.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
      g.lineTo(Math.cos(a) * (rr + len), Math.sin(a) * (rr + len));
      g.stroke();
    }
  }

  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'source-over';
  g.globalAlpha = 1;
}

/* Shrink a still until it fits its frame exactly — no clipped rows, whatever
   the author's data length. Pure layout, runs once per render, no animation. */
function fitStill() {
  if (!MODE.poster && !MODE.gif) return;
  const shell = document.querySelector('.shell');
  let k = 1;
  root.style.setProperty('--fit', '1');
  for (let i = 0; i < 26 && shell.scrollHeight > shell.clientHeight + 2; i++) {
    k = Math.max(0.6, k - 0.025);
    root.style.setProperty('--fit', k.toFixed(3));
  }
  return k;
}

function sizeCanvas() {
  const rect = document.getElementById('viz').getBoundingClientRect();
  viewW = Math.max(1, Math.round(rect.width));
  viewH = Math.max(1, Math.round(rect.height));
  // Cap the backdrop's pixel budget: it is a soft glow, so upscaling is free.
  const longest = Math.max(viewW, viewH);
  dpr = clamp(Math.min(window.devicePixelRatio || 1, 2) * Math.min(1, 1600 / longest), 0.5, 2);
  cv.width = Math.round(viewW * dpr);
  cv.height = Math.round(viewH * dpr);
}

/* ==================================================== static UI wiring */
function text(id, v) { const el = $(id); if (el) el.textContent = v; }

function buildChrome() {
  const m = DATA.meta;
  text('eyebrow', m.eyebrow || '');
  $('sample-badge').hidden = !m.sample;
  const t = String(m.title || '');
  $('title').innerHTML = t.replace(/\{lit\}([\s\S]*?)\{\/lit\}/g, (_, s) => `<span class="lit">${esc(s)}</span>`).replace(/\{lit\}|\{\/lit\}/g, '');
  text('deck', m.deck || '');
  text('ask-a', m.askPrefix || 'What happens in'); text('ask-b', m.askMiddle || 'when'); text('ask-c', m.askSuffix || '?');
  text('cited-name', m.columns.cited.name); text('cited-sub', m.columns.cited.sub);
  text('absent-name', m.columns.absent.name); text('absent-sub', m.columns.absent.sub);
  const hero = metricById[heroId];
  text('hero-label-cited', hero.label); text('hero-label-absent', hero.label);
  text('hero-cited-u', unitSuffix(hero)); text('hero-absent-u', unitSuffix(hero));
  text('by-left', m.byline || ''); text('by-right', m.liveUrl || '');
  $('honesty').innerHTML = m.sample
    ? '<b>Honesty note.</b> Every figure on this artifact is <b>SAMPLE</b> data shipped with the template to demonstrate the mechanics. Nothing here is a measurement. Replace the <code>#viz-data</code> block with your own numbers and sources before publishing.'
    : '<b>Honesty note.</b> Every figure carries a source and a date. Hover or tap the marker beside a number, or open the sources drawer above.';
  const asOf = DATA.sources.map(x => x.asOf).sort().slice(-1)[0] || '';
  $('src-line').textContent = `Sources: ${DATA.sources.map(x => x.id.replace(/^s-/, '').toUpperCase()).join(' · ')}`
    + (asOf ? ` · as of ${asOf}` : '') + (m.sample ? ' · SAMPLE data' : '');
  $('strip').innerHTML = `<b>${esc(m.gifNote || 'Rudimentary GIF of a living artifact.')}</b><span>${esc(m.gifNoteSub || '')}</span>`;

  for (const [dim, sel] of [['vertical', $('sel-vertical')], ['intent', $('sel-intent')]]) {
    sel.innerHTML = DATA.dimensions[dim].options.map(o => `<option value="${esc(o.id)}">${esc(o.label)}</option>`).join('');
    sel.value = state[dim];
    sel.addEventListener('change', () => { state[dim] = sel.value; onStateChange(); });
  }

  $('prompts').innerHTML = DATA.prompts
    .map((p, i) => `<button class="prompt" type="button" data-i="${i}" aria-pressed="false">${esc(p.label)} <span class="go" aria-hidden="true">→</span></button>`)
    .join('') + '<button class="replay" type="button" id="replay">Replay ↻</button>';
  $('prompts').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.id === 'replay') { play(); return; }
    const p = DATA.prompts[Number(b.dataset.i)];
    Object.assign(state, p.set);
    $('sel-vertical').value = state.vertical; $('sel-intent').value = state.intent;
    onStateChange();
  });

  $('ledger').insertAdjacentHTML('beforeend', DATA.metrics.filter(m2 => m2.id !== heroId).map(m2 => `
    <div class="row" data-metric="${esc(m2.id)}">
      <div class="row-label">${esc(m2.label)}<span class="row-note">${esc(m2.note || '')}</span></div>
      <div class="val cited" data-v="cited">—</div>
      <div class="bars">
        <div class="bar cited"><i data-bar="cited"></i></div>
        <div class="bar absent"><i data-bar="absent"></i></div>
      </div>
      <div class="val absent" data-v="absent">—</div>
      <div class="row-delta" data-delta>—</div>
    </div>`).join(''));

  $('sources-body').innerHTML = DATA.sources.map(s => `
    <div class="s-item" id="src-${esc(s.id)}">
      <span class="s-id">${esc(s.id.replace(/^s-/, '').toUpperCase())}</span>
      <span>${esc(s.label)}${s.url ? ` — <a href="${esc(s.url)}" rel="nofollow noreferrer">source</a>` : ''}
        <span class="s-meta">${esc(s.detail || '')} · as of ${esc(s.asOf)}</span></span>
    </div>`).join('');
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

/* ----------------------------------------------- source markers + popover */
function marker(sourceId) {
  const s = sourceById[sourceId];
  if (!s) return '';
  const short = sourceId.replace(/^s-/, '').toUpperCase();
  return `<button class="src" type="button" data-src="${esc(sourceId)}" aria-label="Source for this number: ${esc(s.label)}, as of ${esc(s.asOf)}">${esc(short)}</button>`;
}
const pop = $('pop');
function showPop(btn) {
  const s = sourceById[btn.dataset.src]; if (!s) return;
  pop.innerHTML = `<b>Source · as of ${esc(s.asOf)}</b>${esc(s.label)}<span class="as">${esc(s.detail || '')}</span>`;
  pop.hidden = false;
  const r = btn.getBoundingClientRect(), host = $('viz').getBoundingClientRect();
  const w = pop.offsetWidth;
  pop.style.left = `${clamp(r.left - host.left + r.width / 2 - w / 2, 8, host.width - w - 8)}px`;
  pop.style.top = `${r.bottom - host.top + 8}px`;
}
const hidePop = () => { pop.hidden = true; };
document.addEventListener('pointerover', e => { const b = e.target.closest?.('.src'); if (b) showPop(b); else if (!e.target.closest?.('#pop')) hidePop(); });
document.addEventListener('focusin', e => { const b = e.target.closest?.('.src'); if (b) showPop(b); else hidePop(); });
document.addEventListener('click', e => {
  const b = e.target.closest?.('.src'); if (!b) return;
  const d = $('sources'); d.open = true;
  document.querySelectorAll('.s-item.hl').forEach(n => n.classList.remove('hl'));
  const row = $(`src-${b.dataset.src}`); if (row) { row.classList.add('hl'); row.scrollIntoView({ block: 'nearest' }); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') hidePop(); });

/* ------------------------------------------------------------- gauges */
function gauge(el, frac, color) {
  const w = 240, h = 74, pad = 6, r = 60;
  const a0 = Math.PI, a1 = Math.PI * 2;
  const a = a0 + (a1 - a0) * clamp(frac, 0, 1);
  const cxp = w / 2, cyp = h - pad;
  const pt = ang => `${(cxp + Math.cos(ang) * r).toFixed(2)},${(cyp + Math.sin(ang) * r).toFixed(2)}`;
  el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-hidden="true" focusable="false">
    <path d="M ${pt(a0)} A ${r} ${r} 0 0 1 ${pt(a1)}" fill="none" stroke="${PAL.line}" stroke-width="9" stroke-linecap="round"/>
    <path d="M ${pt(a0)} A ${r} ${r} 0 ${frac > 0.5 ? 1 : 0} 1 ${pt(a)}" fill="none" stroke="${color}" stroke-width="9" stroke-linecap="round" opacity="${frac <= 0.001 ? 0 : 1}"/>
  </svg>`;
}

/* ------------------------------------------------------------ rendering */
let settled = null;

function renderStatic() {
  // Everything that does not animate: labels, SERP strip, source markers.
  const hero = metricById[heroId];
  $('poster-q').textContent = (DATA.meta.askPrefix || '') + ' ' + labelOf('vertical', state.vertical)
    + ' ' + (DATA.meta.askMiddle || '') + ' ' + labelOf('intent', state.intent) + (DATA.meta.askSuffix || '?');

  $('hero-label-cited').innerHTML = esc(hero.label) + marker(hero.source);
  $('hero-label-absent').innerHTML = esc(hero.label) + marker(hero.source);

  for (const row of $('ledger').querySelectorAll('.row')) {
    const m = metricById[row.dataset.metric];
    row.querySelector('.row-label').innerHTML = `${esc(m.label)}${marker(m.source)}<span class="row-note">${esc(m.note || '')}</span>`;
  }

  const s = (DATA.serp[state.vertical] || {})[state.intent];
  if (s) {
    $('serp-q').textContent = s.query;
    $('serp-note').textContent = s.note || '';
    $('serp-rows').innerHTML = s.rows.map(r => `
      <div class="sr-row" data-kind="${esc(r.kind)}">
        <span class="sr-kind">${esc(r.label || r.kind)}</span>
        <span class="sr-text">${r.text}</span>
      </div>`).join('');
  }

  const dims = `${labelOf('vertical', state.vertical)} · ${labelOf('intent', state.intent)}`;
  $('delta-l').textContent = 'difference';
  document.title = `${String(DATA.meta.title || '').replace(/\{\/?lit\}/g, '')} — ${dims}`;
}

function renderFrame(t) {
  drawBackdrop(t);

  const hero = metricById[heroId];
  const [hc, ha] = pair(heroId);
  const others = DATA.metrics.filter(m => m.id !== heroId);

  // Progress rail — an honest progress cue, not a fake loader.
  $('rail-fill').style.width = `${clamp(t / T.payoffEnd, 0, 1) * 100}%`;

  // Anticipation: a short compression before the numbers move at all.
  const antic = clamp(t / T.anticipate, 0, 1);
  const lift = (1 - easeInOut(antic)) * 10;
  for (const col of document.querySelectorAll('.col')) col.style.transform = `translateY(${lift.toFixed(2)}px)`;

  // Counter roll-ups, staggered.
  const rollOf = (i, n) => {
    const span = T.rollEnd - T.rollStart;
    const stagger = Math.min(0.16, span / (n + 3));
    const s0 = T.rollStart + i * stagger;
    const s1 = T.rollEnd;
    return easeOutExpo(clamp((t - s0) / Math.max(0.001, s1 - s0), 0, 1));
  };

  const hp = rollOf(0, others.length + 1);
  $('hero-cited').textContent = fmt(hero, hc * hp);
  $('hero-absent').textContent = fmt(hero, ha * hp);
  const gmax = Math.max(hc, ha) || 1;
  gauge($('gauge-cited'), (hc * hp) / gmax, PAL.accents[1]);
  gauge($('gauge-absent'), (ha * hp) / gmax, PAL.accents[2]);

  others.forEach((m, i) => {
    const p = rollOf(i + 1, others.length + 1);
    const [c, a] = pair(m.id);
    const row = $('ledger').querySelector(`.row[data-metric="${m.id}"]`);
    if (!row) return;
    row.querySelector('[data-v="cited"]').textContent = fmt(m, c * p) + unitSuffix(m);
    row.querySelector('[data-v="absent"]').textContent = fmt(m, a * p) + unitSuffix(m);
    const mx = Math.max(c, a) || 1;
    row.querySelector('[data-bar="cited"]').style.width = `${(c * p / mx) * 100}%`;
    row.querySelector('[data-bar="absent"]').style.width = `${(a * p / mx) * 100}%`;
    const dEl = row.querySelector('[data-delta]');
    if (p > 0.995) {
      const { txt, dir } = deltaOf(m, c, a);
      dEl.textContent = txt; dEl.dataset.dir = dir;
    } else { dEl.textContent = '—'; dEl.dataset.dir = ''; }
  });

  // Payoff: the headline difference overshoots in after the counters land.
  const pay = clamp((t - T.payoff) / (T.payoffEnd - T.payoff), 0, 1);
  const dx = $('delta-x');
  if (pay <= 0) { dx.textContent = '—'; dx.style.transform = 'scale(1)'; dx.style.opacity = '.35'; }
  else {
    const { txt, dir } = deltaOf(hero, hc, ha);
    dx.textContent = txt; dx.dataset.dir = dir;
    const k = reduced ? 1 : easeOutBack(pay);
    dx.style.transform = `scale(${(0.72 + 0.28 * k).toFixed(3)})`;
    dx.style.opacity = String(clamp(pay * 2, 0, 1));
  }
}

function deltaOf(m, cited, absent) {
  const better = m.better === 'lower' ? -1 : 1;
  if (absent === 0) return { txt: '—', dir: '' };
  const x = cited / absent;
  const good = (better === 1 && x > 1) || (better === -1 && x < 1);
  const dp = v => (v >= 10 ? 0 : v < 1.1 ? 2 : 1);
  const txt = x >= 1 ? `${x.toFixed(dp(x))}×${m.better === 'lower' && x > 1 ? ' higher' : ''}` : `${(1 / x).toFixed(dp(1 / x))}× ${m.better === 'lower' ? 'lower' : 'less'}`;
  return { txt, dir: good ? 'good' : 'bad' };
}

function announce() {
  const hero = metricById[heroId];
  const [c, a] = pair(heroId);
  const { txt } = deltaOf(hero, c, a);
  settled = { vertical: state.vertical, intent: state.intent, hero: hero.id, cited: c, absent: a, ratio: txt };
  $('live').textContent =
    `${labelOf('vertical', state.vertical)}, ${labelOf('intent', state.intent)}. `
    + `${hero.label}: ${fmt(hero, c)}${unitSuffix(hero)} with this defense versus ${fmt(hero, a)}${unitSuffix(hero)} with no defense — ${txt}.`;
}

/* --------------------------------------------------------------- driving */
function stop() { if (clock.raf) cancelAnimationFrame(clock.raf); clock.raf = 0; clock.playing = false; }

function play() {
  stop();
  if (MODE.static) { clock.t = T.total; renderFrame(clock.t); announce(); return; }
  if (reduced) { clock.t = T.payoffEnd; renderFrame(clock.t); announce(); return; }
  clock.playing = true;
  clock.origin = performance.now();
  let announced = false;
  const tick = now => {
    clock.t = (now - clock.origin) / 1000;
    renderFrame(clock.t);
    if (!announced && clock.t >= T.payoffEnd) { announced = true; announce(); }
    if (clock.t < T.total) clock.raf = requestAnimationFrame(tick);
    else { clock.playing = false; clock.raf = 0; idle(); }
  };
  clock.raf = requestAnimationFrame(tick);
}

/* After the reveal lands, only the backdrop keeps drifting. */
function idle() {
  if (reduced || MODE.static) return;
  const t0 = performance.now(), base = clock.t;
  const tick = now => {
    clock.t = base + (now - t0) / 1000;
    drawBackdrop(clock.t);
    clock.raf = requestAnimationFrame(tick);
  };
  clock.raf = requestAnimationFrame(tick);
}

function onStateChange() {
  renderStatic();
  const url = new URL(location.href);
  url.searchParams.set('vertical', state.vertical);
  url.searchParams.set('intent', state.intent);
  if (location.protocol !== 'file:') history.replaceState(null, '', url);
  document.querySelectorAll('.prompt').forEach(b => {
    const set = DATA.prompts[Number(b.dataset.i)].set;
    b.setAttribute('aria-pressed', String(Object.entries(set).every(([k, v]) => state[k] === v)));
  });
  play();
}

/* ------------------------------------------------------------ resizing */
let rt = 0;
const onResize = () => {
  clearTimeout(rt);
  rt = setTimeout(() => { fitStill(); sizeCanvas(); drawBackdrop(clock.t); }, 60);
};
window.addEventListener('resize', onResize);
mq.addEventListener?.('change', e => {
  if (q.get('motion') === 'reduce') return;
  reduced = e.matches; setMotionFlag();
  stop(); renderFrame(reduced || MODE.static ? T.total : clock.t); if (reduced) announce();
});

/* ========================================================== export API */
const nextPaint = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

const VIZ = {
  duration: T.total,
  timeline: { ...T },
  fold: K,
  get state() { return { ...state }; },
  palettes: PALETTES.map(p => p.id),
  async seek(seconds) {
    stop();
    clock.t = Number(seconds) || 0;
    renderFrame(clock.t);
    if (clock.t >= T.payoffEnd) announce();
    await nextPaint();
    return clock.t;
  },
  async frame(n, total) {
    const t = (Number(n) / Math.max(1, Number(total))) * T.total;
    return VIZ.seek(t);
  },
  async setState(next = {}) {
    if (next.palette) PAL = applyPalette(next.palette);
    if (next.seed != null) state.seed = Number(next.seed);
    if (next.vertical && DATA.values[next.vertical]) state.vertical = next.vertical;
    if (next.intent && DATA.values[state.vertical][next.intent]) state.intent = next.intent;
    const sv = $('sel-vertical'), si = $('sel-intent');
    if (sv) sv.value = state.vertical; if (si) si.value = state.intent;
    renderStatic();
    fitStill(); sizeCanvas();
    stop(); renderFrame(clock.t = T.total); announce();
    await nextPaint();
    return VIZ.snapshot();
  },
  snapshot() { return { state: { ...state }, mode: root.dataset.mode, motion: root.dataset.motion, settled, t: clock.t }; },
  stop,
  play,
};
window.VIZ = VIZ;

/* ================================================================ boot */
buildChrome();
if (MODE.poster || MODE.gif) $('sources').open = true;   // stills must carry their sources visibly
renderStatic();
fitStill();
sizeCanvas();

VIZ.ready = (async () => {
  if (q.has('frame')) await VIZ.frame(Number(q.get('frame')), Number(q.get('frames') || 1));
  else if (q.has('t')) await VIZ.seek(Number(q.get('t')));
  else if (MODE.static) { clock.t = T.total; renderFrame(clock.t); announce(); await nextPaint(); }
  else { play(); await nextPaint(); }
  if (MODE.static) announce();
  // Fit once more after the first real render: counters and source markers only
  // reach their final width here, and a still must never clip a row.
  if (fitStill() !== 1) { sizeCanvas(); renderFrame(clock.t); await nextPaint(); }
  root.dataset.ready = '1';
  return VIZ.snapshot();
})();
})();
</script>
</body>
</html>
