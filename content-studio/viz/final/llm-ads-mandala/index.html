const easeInOut = t => (t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);

/* angle: degrees clockwise from 12 o'clock */
const pt = (cx, cy, r, deg) => {
  const rad = (deg - 90) * Math.PI / 180;
  return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
};
const f = n => Math.round(n * 100) / 100;

function sectorPath(cx, cy, r0, r1, a0, a1) {
  if (a1 - a0 <= 0.0001) return 'M0 0';
  const big = (a1 - a0) > 180 ? 1 : 0;
  const [x0, y0] = pt(cx, cy, r1, a0), [x1, y1] = pt(cx, cy, r1, a1);
  const [x2, y2] = pt(cx, cy, r0, a1), [x3, y3] = pt(cx, cy, r0, a0);
  return `M${f(x0)} ${f(y0)}A${f(r1)} ${f(r1)} 0 ${big} 1 ${f(x1)} ${f(y1)}` +
         `L${f(x2)} ${f(y2)}A${f(r0)} ${f(r0)} 0 ${big} 0 ${f(x3)} ${f(y3)}Z`;
}
function arcPath(cx, cy, r, a0, a1, reversed) {
  const A = reversed ? a1 : a0, B = reversed ? a0 : a1;
  const [x0, y0] = pt(cx, cy, r, A), [x1, y1] = pt(cx, cy, r, B);
  const big = Math.abs(B - A) > 180 ? 1 : 0;
  return `M${f(x0)} ${f(y0)}A${f(r)} ${f(r)} 0 ${big} ${reversed ? 0 : 1} ${f(x1)} ${f(y1)}`;
}

svg.setAttribute('width', W); svg.setAttribute('height', H);
if (POSTER) { stage.style.width = W + 'px'; stage.style.height = H + 'px'; }
svg.setAttribute('role', 'img');
svg.setAttribute('aria-label',
  'Data mandala: ChatGPT, Google AI Mode, Microsoft Copilot, Perplexity and Meta AI as five sectors, with three rings - who sees the ads, how often ads appear and in what format, and what still gets cited. Hub: 5.6% of ChatGPT weekly users pay.');

/* ---------------------------------------------------------------- layout */
const CARD  = W / H >= 1.6;          // 1200x630 share card: text panel left, wheel right
const TALL  = H / W >= 1.15;         // 4:5 poster vs square
const RAIL  = TALL;                  // the reading rail only fits the 4:5 crops
const M      = Math.round(px(30));
const PANEL_W = CARD ? Math.round(px(500)) : 0;
const BAR_H  = CARD ? 0 : Math.round(px(TALL ? 178 : 118));
const KEY_H  = TALL ? Math.round(px(52)) : 0;     // the square carries its ring key in the top corners
const RAIL_ROW = Math.round(px(28));
const RAIL_H = RAIL ? Math.round(px(16)) + 5 * RAIL_ROW + Math.round(px(4)) : 0;
const FOOT_H = CARD ? 0 : Math.round(px(RAIL ? 70 : 50));

const CX = CARD ? PANEL_W + (W - PANEL_W) / 2 : W / 2;
const areaTop = CARD ? px(14) : BAR_H + KEY_H + (TALL ? 0 : px(6));
const areaBot = CARD ? H - px(14) : H - FOOT_H - RAIL_H - (TALL ? 0 : px(4));
const R  = Math.floor(Math.min((areaBot - areaTop) / 2, CARD ? (W - PANEL_W) / 2 - px(16) : (W - 2 * M) / 2) - px(3));
const CY = Math.round(areaTop + (areaBot - areaTop) / 2);

const rr = k => R * k;
const HUB = rr(0.24), PADH = rr(0.012), GAP = rr(0.018), CROWN_T = rr(0.082);
const BD = (R - HUB - PADH - 3 * GAP - CROWN_T) / 3;
const BANDS = [];
let cursor = HUB + PADH;
for (let i = 0; i < 3; i++) { BANDS.push({ i: cursor, o: cursor + BD }); cursor += BD + GAP; }
const CROWN = { i: cursor, o: R };
const GUT  = 1.15;                         // degrees of gutter each side of a sector
const MEDR   = BD / 2 - px(2);             // number medallions sit inside their band
const MEDR_W = (BD + GAP) / 2 - px(2.5);   // word medallions may cover the band rules, never each other

/* ---------------------------------------------------------------- scaffold */
const defs = el('defs', {}, svg);
const grad = el('radialGradient', { id: 'bloom', cx: '50%', cy: '50%', r: '50%' }, defs);
el('stop', { offset: '0%',  'stop-color': PAPER_DEEP }, grad);
el('stop', { offset: '58%', 'stop-color': PAPER }, grad);
el('stop', { offset: '100%','stop-color': PAPER }, grad);

el('rect', { x: 0, y: 0, width: W, height: H, fill: PAPER }, svg);
el('circle', { cx: CX, cy: CY, r: R * 1.16, fill: 'url(#bloom)' }, svg);

const gStatic = el('g', {}, svg);   // phyllotaxis grain + tick rings (armature)
const gBands  = el('g', {}, svg);
const gBars   = el('g', {}, svg);
const gRings  = el('g', {}, svg);
const gSpokes = el('g', {}, svg);
const gMeds   = el('g', {}, svg);
const gCrown  = el('g', {}, svg);
const gHub    = el('g', {}, svg);
const gHilite = el('g', {}, svg);   // live-mode selection veil + outline
const gChrome = el('g', {}, svg);
const gHit    = el('g', {}, svg);   // live-mode sector buttons (transparent, on top)

/* ---------------------------------------------------------------- text utils */
const ruler = el('text', { visibility: 'hidden', x: -9999, y: -9999 }, svg);
function measure(s, size, weight, cls, spacing) {
  ruler.setAttribute('font-size', f(size));
  ruler.setAttribute('font-weight', weight || 400);
  ruler.setAttribute('class', cls || '');
  ruler.setAttribute('letter-spacing', spacing ? f(spacing) : 0);
  ruler.textContent = s;
  return ruler.getComputedTextLength();
}
/* every text node registers the box it must stay inside; audit() checks it */
const HOLD = new Map();
function txt(parent, s, a, hold) { const t = el('text', a, parent); t.textContent = s; if (hold) HOLD.set(t, hold); return t; }
const inRect = (x0, y0, x1, y1) => ({ type: 'rect', x0, y0, x1, y1 });
const inDisc = (cx, cy, r) => ({ type: 'disc', cx, cy, r });

/* shrink-to-fit that refuses to go below the artboard floor */
function fit(t, maxW, floor) {
  const lo = Math.max(floor === undefined ? MIN_PX : floor, 1);
  let size = parseFloat(t.getAttribute('font-size')), guard = 80;
  while (guard-- > 0 && t.getComputedTextLength() > maxW && size > lo) {
    size = Math.max(lo, size * 0.96); t.setAttribute('font-size', f(size));
  }
  return size;
}
/* curved inscription, used only on the crown plate, where the radius is largest */
const CROWN_LABELS = [];
function arcLabel(parent, s, { r, a0, a1, size, fill, weight = 800, spacing = 0, id, plateT }) {
  const mid = ((a0 + a1) / 2 + 360) % 360;
  const rev = mid > 90 && mid < 270;                  // bottom half: reverse so text stays upright
  const rad = s2 => (rev ? r + s2 * 0.36 : r - s2 * 0.36);
  const p = el('path', { id, d: arcPath(CX, CY, rad(size), a0, a1, rev), fill: 'none' }, defs);
  const t = el('text', {
    'font-size': f(size), 'font-weight': weight, fill, 'letter-spacing': f(spacing), 'text-anchor': 'middle',
  }, parent);
  const tp = el('textPath', { href: '#' + id, startOffset: '50%' }, t);
  tp.textContent = s;
  let s2 = size, guard = 60;
  while (guard-- > 0 && t.getComputedTextLength() > p.getTotalLength() * 0.94 && s2 > MIN_PX) {
    s2 = Math.max(MIN_PX, s2 * 0.96);
    t.setAttribute('font-size', f(s2));
    p.setAttribute('d', arcPath(CX, CY, rad(s2), a0, a1, rev));
  }
  CROWN_LABELS.push({ t, p, plateT });
  return t;
}
function icon(parent, name, x, y, size, color, sw) {
  const g = el('g', { transform: `translate(${f(x - size / 2)} ${f(y - size / 2)}) scale(${f(size / 24)})` }, parent);
  for (const d of ICON[name]) {
    el('path', {
      d, fill: ICON_FILLED[name] ? color : 'none', stroke: color,
      'stroke-width': (sw || 2.15), 'stroke-linecap': 'round', 'stroke-linejoin': 'round',
    }, g);
  }
  return g;
}

/* ============================================================== ORNAMENT (static armature) */
const K = 10;
function tickRing(parent, r, count, len, w, color, op) {
  const g = el('g', { opacity: op }, parent);
  for (let i = 0; i < count; i++) {
    const a = (360 / count) * i;
    const [x0, y0] = pt(CX, CY, r - len / 2, a), [x1, y1] = pt(CX, CY, r + len / 2, a);
    el('line', { x1: f(x0), y1: f(y0), x2: f(x1), y2: f(y1), stroke: color, 'stroke-width': f(w), 'stroke-linecap': 'round' }, g);
  }
}
/* ticks live in the band gaps only, never where type sits */
BANDS.forEach((B, i) => { if (i < 2) tickRing(gStatic, B.o + GAP / 2, K * (5 + i), GAP * 0.62, px(1.4), INK, 0.30); });
tickRing(gStatic, BANDS[2].o + GAP / 2, K * 8, GAP * 0.62, px(1.3), INK, 0.28);

(function grain() {
  const n = 620, golden = Math.PI * (3 - Math.sqrt(5));
  const g = el('g', { opacity: 0.32 }, gStatic);
  for (let i = 0; i < n; i++) {
    const rad = Math.sqrt(i / n) * CROWN.i;
    if (rad < HUB * 1.1) continue;
    const a = (i * golden * 180 / Math.PI) % 360;
    const [x, y] = pt(CX, CY, rad, a);
    const idx = Math.floor((((a + 36) % 360) / 72)) % 5;
    el('circle', { cx: f(x), cy: f(y), r: f(px(1.0) + (i % 3) * px(0.3)), fill: shade(ASSISTANTS[idx].hue, 0.16) }, g);
  }
})();

/* ============================================================== CELLS */
const art = [];

/* word lines: centred block, each line fitted to the disc chord at its own height */
function wordFace(g, lines, MR, y0, color, blank) {
  const start = Math.max(MIN_PX, Math.min(px(blank ? 15 : 16), MR * 0.40));
  let fs = start, guard = 30;
  const tr = blank ? -px(0.2) : 0;
  const layout = size => {
    const lh = size * 1.13, cap = size * 0.72, block = cap + lh * (lines.length - 1);
    /* blanks: the long second word ("DISCLOSED", "MEASURED") sits on the disc's widest chord */
    const top = (blank && lines.length === 2 ? -lh / 2 : y0) - block / 2;
    return lines.map((ln, i) => {
      const base = top + cap + i * lh;
      const yw = Math.max(Math.abs(base), Math.abs(base - cap));
      const chord = 2 * Math.sqrt(Math.max(1, MR * MR - yw * yw)) * 0.965;
      return { ln, base, chord, w: measure(ln, size, 800, '', tr) };
    });
  };
  let L = layout(fs);
  while (guard-- > 0 && L.some(l => l.w > l.chord) && fs > MIN_PX) { fs = Math.max(MIN_PX, fs * 0.97); L = layout(fs); }
  L.forEach(l => txt(g, l.ln, {
    x: 0, y: f(l.base), 'text-anchor': 'middle', 'font-size': f(fs), 'font-weight': 800,
    fill: color, 'letter-spacing': f(tr),
  }, { type: 'disc-local', r: MR }));
}

ASSISTANTS.forEach((it, ii) => {
  const A = ii * 72, a0 = A - 36 + GUT, a1 = A + 36 - GUT;

  RINGS.forEach((ring, ri) => {
    const B = BANDS[ri], cell = CELLS[ri][ii];
    const blank = cell.kind === 'nd' || cell.kind === 'nm';

    const band = el('path', {
      d: sectorPath(CX, CY, B.i, B.o, a0, a1),
      fill: blank ? tint(NM, ring.tint * 0.48) : tint(shade(it.hue, 0.10), ring.tint),
      stroke: shade(it.hue, 0.30), 'stroke-width': f(px(0.9)), 'stroke-opacity': 0.32,
    }, gBands);

    /* petal ornament: 3 lobes per sector, 15-fold around the wheel */
    const pg = el('g', { opacity: 0.55 }, gBands);
    for (let k = 0; k < 3; k++) {
      const c = a0 + (a1 - a0) * (k + 0.5) / 3, w = (a1 - a0) / 3 * 0.46;
      const [tx, ty] = pt(CX, CY, B.o - BD * 0.07, c);
      const [bx, by] = pt(CX, CY, B.i + BD * 0.09, c);
      const [lx, ly] = pt(CX, CY, (B.i + B.o) / 2, c - w);
      const [rx, ry] = pt(CX, CY, (B.i + B.o) / 2, c + w);
      el('path', {
        d: `M${f(bx)} ${f(by)}Q${f(lx)} ${f(ly)} ${f(tx)} ${f(ty)}Q${f(rx)} ${f(ry)} ${f(bx)} ${f(by)}Z`,
        fill: 'none', stroke: shade(blank ? NM : it.hue, 0.36), 'stroke-width': f(px(1.15)), 'stroke-opacity': 0.58,
      }, pg);
    }

    /* ring 2 is the encoded ring: blade length = share of commercial prompts with an ad, linear, 0-30% */
    let bar = null, cap = null;
    if (ring.bar && cell.kind === 'n') {
      bar = el('path', { d: 'M0 0', fill: it.hue, stroke: shade(it.hue, 0.34), 'stroke-width': f(px(1.1)) }, gBars);
      cap = el('path', { d: 'M0 0', fill: 'none', stroke: INK, 'stroke-width': f(px(2.6)), 'stroke-opacity': 0.9 }, gBars);
      bar.dataset.frac = clamp((cell.v || 0) / ring.max, 0, 1);
    }

    /* medallion: a paper disc, so its type is always horizontal and never crossed */
    const [mx, my] = pt(CX, CY, (B.i + B.o) / 2, A);
    const g = el('g', { transform: `translate(${f(mx)} ${f(my)})` }, gMeds);
    const gs = el('g', {}, g);
    const MR = cell.kind === 'n' ? MEDR : MEDR_W;
    el('circle', { r: f(MR + px(cell.kind === 'n' ? 3.4 : 1.2)), fill: shade(blank ? NM : it.hue, 0.05), opacity: 0.26 }, gs);
    el('circle', {
      r: f(MR), fill: PAPER, stroke: blank ? NM : shade(it.hue, 0.14), 'stroke-width': f(px(3.2)),
      'stroke-dasharray': blank ? `${f(px(5))} ${f(px(4))}` : null,
    }, gs);
    const inner = MR - px(1.8);                         // inside the stroke

    if (CARD) {
      /* share card: discs and ring badges only; the 1200x630 thumbnail can't carry 15 faces at 14px */
      if (!blank) {
        const bg = el('g', {}, gs);
        el('circle', { r: f(MR * 0.46), fill: it.hue, stroke: shade(it.hue, 0.2), 'stroke-width': f(px(1.1)) }, bg);
        icon(bg, ri === 0 ? it.icon : ring.glyph, 0, 0, MR * 0.62, INK, 2.5);
      }
    } else if (blank) {
      /* spelled out in full, never an abbreviation */
      wordFace(gs, ['NOT', cell.kind === 'nd' ? 'DISCLOSED' : 'MEASURED'], inner, 0, '#6E6457', true);
    } else {
      const badR = MR * (cell.kind === 'n' ? 0.23 : 0.20);
      const badY = cell.kind === 'n' ? -MR * 0.47 : -MR * 0.60;
      const bg = el('g', { transform: `translate(0 ${f(badY)})` }, gs);
      el('circle', { r: f(badR), fill: it.hue, stroke: shade(it.hue, 0.2), 'stroke-width': f(px(1.1)) }, bg);
      icon(bg, ri === 0 ? it.icon : ring.glyph, 0, 0, badR * 1.34, INK, 2.5);
      if (cell.kind === 'n') {
        const base = MR * 0.37;
        const chord = 2 * Math.sqrt(MR * MR - base * base) * 0.92;
        const vt = txt(gs, cell.val, {
          x: 0, y: f(base), 'text-anchor': 'middle', class: 'num',
          'font-size': f(Math.min(MR * 0.66, px(30))), 'font-weight': 800, 'letter-spacing': f(-px(0.8)), fill: INK,
        }, { type: 'disc-local', r: inner });
        fit(vt, chord);
      } else {
        wordFace(gs, cell.lines, inner, MR * 0.16, INK, false);
      }
    }
    /* local-disc holders need the medallion centre, filled in once the group exists */
    for (const t of gs.querySelectorAll('text')) {
      const h = HOLD.get(t);
      if (h && h.type === 'disc-local') HOLD.set(t, inDisc(mx, my, h.r));
    }

    art.push({ ri, ii, band, pg, bar, cap, med: g, scale: gs, a0, a1, B });
  });

  /* crown: saturated rim + an inset inscription plate that nothing crosses */
  const crownWedge = el('path', {
    d: sectorPath(CX, CY, CROWN.i, CROWN.o, a0, a1),
    fill: it.hue, stroke: shade(it.hue, 0.34), 'stroke-width': f(px(1.2)),
  }, gCrown);
  const pin = CROWN.i + px(3.5), pout = CROWN.o - px(4.5);
  const plate = el('path', {
    d: sectorPath(CX, CY, pin, pout, a0 + 2.0, a1 - 2.0),
    fill: tint(it.hue, 0.20), stroke: shade(it.hue, 0.40), 'stroke-width': f(px(1.3)), 'stroke-opacity': 0.75,
  }, gCrown);
  const cname = arcLabel(gCrown, CARD ? it.rail : it.crown, {
    r: (pin + pout) / 2, a0: a0 + 3.6, a1: a1 - 3.6,
    size: px(TALL ? 18.5 : CARD ? 15 : 17), fill: INK, weight: 800, spacing: px(0.7), id: `crown-${ii}`, plateT: pout - pin,
  });
  art.push({ crownOnly: true, ii, band: crownWedge, plate, lab: cname, a0, a1 });

  /* spoke divider + boss */
  const sa = A + 36;
  const [sx0, sy0] = pt(CX, CY, HUB + px(2), sa), [sx1, sy1] = pt(CX, CY, CROWN.o, sa);
  el('line', { x1: f(sx0), y1: f(sy0), x2: f(sx1), y2: f(sy1), stroke: INK, 'stroke-width': f(px(2.2)), 'stroke-opacity': 0.85 }, gSpokes);
  const [dx, dy] = pt(CX, CY, CROWN.i, sa);
  el('circle', { cx: f(dx), cy: f(dy), r: f(px(5.4)), fill: PAPER, stroke: INK, 'stroke-width': f(px(2)) }, gSpokes);
});

/* boundary circles: they bound the bands, they never run through type */
const bounds = [HUB, ...BANDS.flatMap(B => [B.i, B.o]), CROWN.i, CROWN.o];
bounds.forEach((r, i) => el('circle', {
  cx: CX, cy: CY, r: f(r), fill: 'none', stroke: INK,
  'stroke-width': f(px(i === bounds.length - 1 ? 3.2 : 1.4)),
  'stroke-opacity': i === bounds.length - 1 ? 0.95 : 0.45,
}, gRings));

/* ============================================================== HUB */
const hub = (() => {
  el('circle', { cx: CX, cy: CY, r: f(HUB), fill: PAPER }, gHub);
  const ros = el('g', { opacity: 0.5 }, gHub);
  for (let k = 0; k < K; k++) {
    const a = (360 / K) * k;
    const [tx, ty] = pt(CX, CY, HUB * 0.95, a);
    const [lx, ly] = pt(CX, CY, HUB * 0.54, a - 17);
    const [rx, ry] = pt(CX, CY, HUB * 0.54, a + 17);
    el('path', {
      d: `M${f(CX)} ${f(CY)}Q${f(lx)} ${f(ly)} ${f(tx)} ${f(ty)}Q${f(rx)} ${f(ry)} ${f(CX)} ${f(CY)}Z`,
      fill: 'none', stroke: '#DBCFBA', 'stroke-width': f(px(1.1)),
    }, ros);
  }
  /* gauge: the yellow arc is 5.6% of the circle, the share of weekly users who pay */
  const gw = px(12), gr = HUB - gw / 2 - px(2.5);
  el('circle', { cx: CX, cy: CY, r: f(gr), fill: 'none', stroke: '#EFE2C8', 'stroke-width': f(gw) }, gHub);
  const sweep  = el('path', { d: 'M0 0', fill: 'none', stroke: HOT, 'stroke-width': f(gw) }, gHub);
  const sweep2 = el('path', { d: 'M0 0', fill: 'none', stroke: INK, 'stroke-width': f(px(1.6)), opacity: 0.55 }, gHub);
  const core = gr - gw / 2 - px(2);
  el('circle', { cx: CX, cy: CY, r: f(core), fill: PAPER, stroke: INK, 'stroke-width': f(px(1.4)), 'stroke-opacity': 0.45 }, gHub);

  /* every hub line is fitted to the chord of the core disc at its own height */
  const chord = y => 2 * Math.sqrt(Math.max(1, core * core - y * y)) * 0.92;
  const coreHold = inDisc(CX, CY, core - px(1));
  const bigBase = -core * 0.10;
  const big = txt(gHub, HUB_NUM.toFixed(1) + '%', {
    x: CX, y: f(CY + bigBase), 'text-anchor': 'middle', class: 'num',
    'font-size': f(core * 0.56), 'font-weight': 800, 'letter-spacing': f(-px(2.2)), fill: INK,
  }, coreHold);
  if (CARD) {
    big.setAttribute('y', f(CY + core * 0.22));
    big.setAttribute('font-size', f(core * 0.64));
    fit(big, chord(core * 0.26));
    return { sweep, sweep2, big, gr };
  }
  fit(big, chord(Math.abs(bigBase) + core * 0.42));
  const l1y = core * 0.17, l2y = l1y + px(17.5), sy = l2y + px(19.5);
  [[HUB_L1, l1y], [HUB_L2, l2y]].forEach(([s, y]) => {
    fit(txt(gHub, s, {
      x: CX, y: f(CY + y), 'text-anchor': 'middle', 'font-size': f(px(14.6)), 'font-weight': 700, fill: INK,
    }, coreHold), chord(y + px(3)));
  });
  fit(txt(gHub, HUB_SRC, {
    x: CX, y: f(CY + sy), 'text-anchor': 'middle',
    'font-size': f(px(14)), 'font-weight': 650, fill: INK_SOFT, 'letter-spacing': f(px(0.2)),
  }, coreHold), chord(sy + px(3)));
  return { sweep, sweep2, big, gr };
})();

/* ============================================================== TITLE BAR */
let headNum = null;
if (!CARD) {
el('rect', { x: 0, y: 0, width: W, height: BAR_H, fill: INK }, gChrome);
el('rect', { x: 0, y: BAR_H - px(7), width: W, height: px(7), fill: HOT }, gChrome);
const barHold = inRect(0, 0, W, BAR_H - px(7));

fit(txt(gChrome, KICKER, {
  x: M, y: f(px(TALL ? 36 : 30)), 'font-size': f(px(14)), 'font-weight': 800, fill: HOT, 'letter-spacing': f(px(2.0)),
}, barHold), W - 2 * M);

const HEAD_FS = px(TALL ? 46 : 34);
const headA = el('text', {
  x: M, y: f(px(TALL ? 86 : 72)), 'font-size': f(HEAD_FS), 'font-weight': 800, fill: PAPER,
  'letter-spacing': f(-px(1.8)), class: 'num',
}, gChrome);
HOLD.set(headA, barHold);
headNum = el('tspan', { fill: HOT }, headA); headNum.textContent = HEAD_NUM.toFixed(2) + '%';
const headRest = el('tspan', {}, headA); headRest.textContent = TALL ? HEAD_A : HEAD_A + ' ' + HEAD_B;
fit(headA, W - 2 * M);
if (TALL) txt(gChrome, HEAD_B, {
  x: M, y: f(px(138)), 'font-size': f(parseFloat(headA.getAttribute('font-size'))), 'font-weight': 800, fill: PAPER, 'letter-spacing': f(-px(1.8)),
}, barHold);
const subW = W * (TALL ? 0.64 : 0.62);
fit(txt(gChrome, SUBLINE, {
  x: M, y: f(BAR_H - px(TALL ? 18 : 19)), 'font-size': f(px(15.5)), 'font-weight': 600, fill: '#C9BFAF',
}, inRect(0, 0, M + subW + px(4), BAR_H - px(7))), subW);
fit(txt(gChrome, HEAD_SRC, {
  x: W - M, y: f(BAR_H - px(TALL ? 18 : 19)), 'text-anchor': 'end', 'font-size': f(px(14)), 'font-weight': 600, fill: '#A2988A',
}, inRect(M + subW + px(10), 0, W, BAR_H - px(7))), W - 2 * M - subW - px(16));
} else (function cardPanel() {
  /* 1200x630 share card: the title bar turned sideways, plus the ring key and hub caption */
  el('rect', { x: 0, y: 0, width: PANEL_W, height: H, fill: INK }, gChrome);
  el('rect', { x: PANEL_W - px(7), y: 0, width: px(7), height: H, fill: HOT }, gChrome);
  const hold = inRect(0, 0, PANEL_W - px(7), H);
  const x = M, w = PANEL_W - px(7) - 2 * M;
  const line = (s, y, size, weight, fill, extra) => fit(txt(gChrome, s, Object.assign({
    x: f(x), y: f(px(y)), 'font-size': f(px(size)), 'font-weight': weight, fill }, extra || {}), hold), w);
  line('ADS INSIDE FREE AI ANSWERS · SEPTEMBER 2026', 40, 14, 800, HOT, { 'letter-spacing': f(px(1.8)) });
  const num = el('text', { x: f(x), y: f(px(112)), 'font-size': f(px(64)), 'font-weight': 800, fill: HOT,

    body += note(pad, top + 258, 'Exact ad URL: 1.95%. (SE Ranking, 50,032 keywords)');
  } else if (a.slug === 'copilot') {
    body += rect(pad, top + 76, w - 2 * pad, 84, tint(hue, 0.12), shade(hue, 0.4), 8);
    body += tag(pad + 14, top + 100, 'SPONSORED', shade(hue, 0.6));
    body += note(w - pad - 14, top + 100, 'a recommendation inside the answer', 'end');
    body += rect(pad + 14, top + 112, 64, 36, '#FFFFFF', '#C9BCA6', 6);
    body += bar(pad + 92, top + 118, 240, 0.45) + bar(pad + 92, top + 134, 330, 0.22);
    body += bar(pad, top + 178, 480) + bar(pad, top + 194, 420) + bar(pad, top + 210, 260);
    body += note(pad, top + 246, 'Drawn from existing Microsoft Advertising campaigns.');
  } else if (a.slug === 'perplexity') {
    body += note(pad, top + 92, 'sources, 19.2 per answer on average');
    let c = ''; for (let i = 0; i < 12; i++) c += rect(pad + (i % 6) * 100, top + 100 + Math.floor(i / 6) * 24, 92, 18, '#FFFFFF', shade(hue, 0.45), 9);
    body += c;
    body += tag(pad, top + 176, 'RELATED');
    body += bar(pad, top + 188, 330, 0.3) + bar(pad, top + 208, 290, 0.3);
    body += rect(pad, top + 222, 420, 26, '#FFFFFF', NM, 6, '5 4');
    body += `<line x1="${pad + 8}" y1="${top + 235}" x2="${pad + 412}" y2="${top + 235}" stroke="#6E6457" stroke-width="1.6"/>`;
    body += note(pad + 432, top + 240, 'sponsored follow-ups');
    body += note(pad + 432, top + 258, 'ended Feb 2026');
  } else {
    body += tag(pad, top + 92, 'SHOPPING CAROUSEL · TEST', shade(hue, 0.6));
    body += note(w - pad, top + 92, 'US, web only', 'end');
    for (let i = 0; i < 3; i++) {
      body += rect(pad + i * 136, top + 102, 124, 92, '#FFFFFF', shade(hue, 0.4), 8);
      body += rect(pad + 10 + i * 136, top + 112, 104, 40, tint(hue, 0.22), null, 5);
      body += bar(pad + 10 + i * 136, top + 162, 80, 0.4) + bar(pad + 10 + i * 136, top + 176, 56, 0.22);
    }
    body += `<path d="M${pad + 420} ${top + 148} h56" stroke="#14100B" stroke-width="2" fill="none"/><path d="M${pad + 470} ${top + 142} l8 6 -8 6" stroke="#14100B" stroke-width="2" fill="none"/>`;
    body += rect(pad + 486, top + 102, 118, 92, tint(hue, 0.12), shade(hue, 0.4), 8);
    body += tag(pad + 545, top + 124, 'FEED AD', shade(hue, 0.6), 'middle');
    body += note(pad + 545, top + 146, 'elsewhere', 'middle');
    body += note(pad + 545, top + 164, 'on Meta', 'middle');
    body += note(pad, top + 226, 'The chat shapes ads on Meta’s apps; no confirmed sponsored label in chat.');
  }

  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Representative drawing of how ads appear in ${esc(a.label)}, drawn from the ledger, not a screenshot.">
    <rect width="${w}" height="${h}" fill="#FFFDF7"/>
    ${body}
    <rect x="0" y="${h - 28}" width="${w}" height="28" fill="#14100B"/>
    <text x="${pad}" y="${h - 9}" font-size="13.5" font-weight="800" fill="#FFE600" letter-spacing="0.8" ${FONT}>REPRESENTATIVE DRAWING — FROM THE LEDGER, NOT A SCREENSHOT</text>
  </svg>`;
}

function buildPanel() {
  panel = document.createElement('div');
  panel.id = 'panel';
  panel.hidden = true;
  panel.setAttribute('role', 'region');
  panel.setAttribute('aria-live', 'polite');
  panel.setAttribute('aria-label', 'Who sees ads in this assistant, and what still earns a citation');
  document.getElementById('app').appendChild(panel);
}

const list = items => items.length
  ? `<ul>${items.map(i => `<li${i.empty ? ' class="empty"' : ''}>${esc(i.t)}${i.s ? `<span class="src">${esc(i.s)}</span>` : ''}</li>`).join('')}</ul>`
  : '<ul><li class="empty">No independent measurement found for this piece.</li></ul>';

function renderPanel(it) {
  const slug = it.slug;
  const href = jumpHref(slug);
  panel.innerHTML = `
    <div class="phead">
      <span class="swatch" style="background:${it.hue}"></span>
      <h3>${esc(it.label.toUpperCase())}</h3>
      <button class="close" type="button" aria-label="Close this panel">Close ×</button>
    </div>
    <p class="lede">${esc(it.lede)}</p>
    <div class="pbody">
      <div>
        <section><h4>Ad status</h4>${list(it.status)}</section>
        <section><h4>Who sees them</h4>${list(it.who)}</section>
        <section><h4>Measured</h4>${list(it.measured)}</section>
      </div>
      <div>
        <section><h4>What you can buy today</h4>${list(it.buy)}</section>
        <section><h4>What still earns a citation</h4>${list(it.organic)}</section>
        <figure>${mockFormat(it)}<figcaption>Representative drawing of the ad format, drawn from the ledger. Not a screenshot.</figcaption></figure>
        <a class="jump" href="${esc(href)}" target="_top" data-intent="${slug}">Read the ${esc(it.label)} section ↓</a>
      </div>
    </div>`;
  panel.querySelector('.close').addEventListener('click', () => selectAssistant(null));
  panel.querySelector('.jump').addEventListener('click', ev => {
    ev.currentTarget.setAttribute('href', jumpHref(slug));           // the host URL may have changed since render
    try { if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'viz-intent', intent: slug }, '*'); } catch (e) {}
  });
}

function paintSelection() {
  HILITE.forEach((hl, i) => {
    const on = selected !== null;
    hl.veil.setAttribute('opacity', on && i !== selected ? 0.62 : 0);
    hl.ring.setAttribute('opacity', on && i === selected ? 1 : 0);
  });
  HITS.forEach((p, i) => p.setAttribute('aria-pressed', selected === i ? 'true' : 'false'));
}

function selectAssistant(id) {
  let idx = null;
  if (id !== null && id !== undefined && id !== false) {
    idx = typeof id === 'number' ? id : ASSISTANTS.findIndex(x => x.slug === String(id).toLowerCase());
    if (idx < 0 || idx >= ASSISTANTS.length) return false;
  }
  selected = idx;
  paintSelection();
  if (!panel) return true;
  if (idx === null) { panel.hidden = true; panel.innerHTML = ''; postHeight(); return true; }
  renderPanel(ASSISTANTS[idx]);
  panel.hidden = false;
  postHeight();
  return true;
}

const HITS = [];
if (!POSTER) {
  document.body.classList.add('live');
  promptEl = document.createElement('p');
  promptEl.id = 'prompt';
  promptEl.innerHTML = '<span><b>Click an assistant</b>: see who sees ads there, and what still earns a citation.</span>';
  /* WCAG 2.2.2: the assembly runs 8.45 s, so it gets a stop control; reduced motion never autoplays */
  skipBtn = document.createElement('button');
  skipBtn.id = 'skip'; skipBtn.type = 'button';
  skipBtn.addEventListener('click', () => {
    if (raf) { stopAnim(); render(T.settled); setSkip(false); }
    else playOnce();
  });
  promptEl.appendChild(skipBtn);
  setSkip(!!raf);
  const app = document.getElementById('app');
  app.insertBefore(promptEl, app.firstChild);
  buildPanel();

  ASSISTANTS.forEach((it, ii) => {
    const A = ii * 72;
    const p = el('path', {
      d: sectorPath(CX, CY, HUB, CROWN.o, A - 36, A + 36),
      fill: 'transparent', class: 'hit', role: 'button', tabindex: '0',
      'aria-pressed': 'false',
      'aria-label': `${it.label}: see who sees ads there, and what still earns a citation`,
    }, gHit);
    p.addEventListener('click', () => selectAssistant(selected === ii ? null : ii));
    p.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); selectAssistant(selected === ii ? null : ii); }
      if (e.key === 'Escape') selectAssistant(null);
    });
    p.addEventListener('focus', () => HILITE[ii].ring.setAttribute('opacity', 1));
    p.addEventListener('blur',  () => paintSelection());
    HITS.push(p);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && selected !== null) selectAssistant(null); });
  let rt = 0;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(postHeight, 120); });
  window.addEventListener('load', postHeight);
  postHeight();
}

/* ---------------------------------------------------------------- audit
   Type floor (>= 14px at 1080 wide), ink-box overlaps, and containment: every
   text run must sit inside the disc or panel it was drawn for, so no ring
   rule, spoke or separator can cross it. Crown labels must fit their plate.  */
function inkBox(t) {
  const b = t.getBoundingClientRect();
  const fs = parseFloat(getComputedStyle(t).fontSize);
  const p = svg.createSVGPoint(); p.x = 0; p.y = parseFloat(t.getAttribute('y')) || 0;
  const m = t.getCTM();
  const base = m ? p.matrixTransform(m).y : p.y;
  const s = t.textContent || '';
  const lower = /[a-z]/.test(s), desc = /[gjpqy,;()]/.test(s);
  const top = base - fs * (lower || /[()’“”]/.test(s) ? 0.76 : 0.73);
  const bot = base + fs * (desc ? 0.23 : 0.03);
  return { x0: b.left, x1: b.right, y0: top, y1: bot };
}
function audit() {
  const under = [], boxes = [], spill = [], crown = [];
  const scale = 1080 / W;
  for (const t of svg.querySelectorAll('text')) {
    if (t === ruler) continue;
    const s = (t.textContent || '').trim();
    if (!s) continue;
    const size = parseFloat(getComputedStyle(t).fontSize) * scale;
    if (size < 13.95) under.push({ text: s.slice(0, 60), size: Math.round(size * 100) / 100 });
    if (t.querySelector('textPath')) continue;
    const k = inkBox(t);
    boxes.push({ text: s.slice(0, 40), ...k });
    const hold = HOLD.get(t);
    if (!hold) { spill.push({ text: s.slice(0, 40), why: 'no container registered' }); continue; }
    if (hold.type === 'rect') {
      if (k.x0 < hold.x0 - 0.5 || k.x1 > hold.x1 + 0.5 || k.y0 < hold.y0 - 0.5 || k.y1 > hold.y1 + 0.5)
        spill.push({ text: s.slice(0, 40), why: `outside its box by ${Math.round(Math.max(hold.x0 - k.x0, k.x1 - hold.x1, hold.y0 - k.y0, k.y1 - hold.y1) * 10) / 10}px` });
    } else if (hold.type === 'out') {
      const nx = clamp(hold.cx, k.x0, k.x1), ny = clamp(hold.cy, k.y0, k.y1);
      const near = Math.hypot(nx - hold.cx, ny - hold.cy);
      if (near < hold.r) spill.push({ text: s.slice(0, 40), why: `reaches ${Math.round((hold.r - near) * 10) / 10}px into the wheel` });
      if (k.x0 < hold.x0 - 0.5 || k.x1 > hold.x1 + 0.5 || k.y0 < hold.y0 - 0.5 || k.y1 > hold.y1 + 0.5)
        spill.push({ text: s.slice(0, 40), why: 'outside the canvas margins' });
    } else if (hold.type === 'disc') {
      const far = Math.max(...[[k.x0, k.y0], [k.x1, k.y0], [k.x0, k.y1], [k.x1, k.y1]]
        .map(([x, y]) => Math.hypot(x - hold.cx, y - hold.cy)));
      if (far > hold.r + 0.5) spill.push({ text: s.slice(0, 40), why: `corner ${Math.round((far - hold.r) * 10) / 10}px outside its disc` });
    }
  }
  for (const c of CROWN_LABELS) {
    const len = c.t.getComputedTextLength(), room = c.p.getTotalLength();
    const fs = parseFloat(getComputedStyle(c.t).fontSize);
    if (len > room * 0.955) crown.push({ text: c.t.textContent, why: `arc ${Math.round(len)} of ${Math.round(room)}px` });
    if (fs * 0.74 > c.plateT - px(2)) crown.push({ text: c.t.textContent, why: `cap height ${Math.round(fs * 0.74)} vs plate ${Math.round(c.plateT)}px` });
  }
  const overlaps = [];
  for (let i = 0; i < boxes.length; i++) for (let j = i + 1; j < boxes.length; j++) {
    const a = boxes[i], b = boxes[j];
    const ox = Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0);
    const oy = Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0);
    if (ox > 0.5 && oy > 0.5) overlaps.push({ a: a.text, b: b.text, ox: Math.round(ox), oy: Math.round(oy) });
  }
  return { size: [W, H], minRequired: 14, under, overlaps, spill, crown, textCount: boxes.length + CROWN_LABELS.length,
    geometry: { R, HUB, BD, GAP, MEDR, MEDR_W, crown: CROWN.o - CROWN.i } };
}

window.VIZ = {
  ready: Promise.resolve(true), duration: DUR, settled: T.settled, size: [W, H], beat: BEAT,
  seek: s => { stopAnim(); render(+s); },
  seekMs: v => { stopAnim(); render(+v / 1000); },
  play: playOnce, stop: stopAnim,
  framePlan, audit, selectAssistant, selectIntent: selectAssistant,
  get selected() { return selected === null ? null : ASSISTANTS[selected].slug; },
  assistants: ASSISTANTS.map(i => i.slug),
  intents: ASSISTANTS.map(i => i.slug),
};
document.documentElement.dataset.ready = '1';
})();
</script>
