           p:'of tour and activity operators’ bookings came via OTAs, 2025.',
           x:'of tour operators’ bookings came via OTAs, 2025.', src:'Arival · 5,000+ operators · 2026' },
  via:   { band:'dist', icon:'globe', big:'22.9M', title:'Viator bookings',
           p:'experiences booked through one OTA in 2025.', x:'experiences booked through Viator, 2025.',
           src:'Tripadvisor 10-K · FY2025' },
  gbv:   { band:'dist', icon:'coin', big:'$4.7B', title:'Viator gross bookings',
           p:'gross booking value powered by Viator in 2025.', src:'Tripadvisor 10-K · FY2025' },
};
const ROWS_P = [['ai',['all','local','ask']], ['long',['conv','ctr','old']], ['schema',['req','faq','cite']], ['dist',['ota','via','gbv']]];
const ROWS_X = [['ai',['local','ask']], ['long',['conv','ctr']], ['schema',['req','cite']], ['dist',['ota','via']]];
const SRC_X = { ota:'Arival · 2026', req:'Google · 2026', conv:'Ghose & Yang · 2008', ctr:'Ghose & Yang · 2008', via:'Tripadvisor 10-K · 2025', ask:'Whitespark · 2025', local:'Whitespark · 2025', cite:'Ahrefs · 2026' };

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const svg = (body, vb = 30) => `<svg viewBox="0 0 ${vb} ${vb}" aria-hidden="true">${body}</svg>`;

let n = 0;
function cellHtml(id){
  const c = CELLS[id]; n += 1;
  const lines = MODE === 'p' ? c.p : (c.x || c.p);
  const src = MODE === 'l' ? (SRC_X[id] || c.src) : c.src;
  const text = `<div class="ctitle">${esc(c.title)}</div><div class="clines">${esc(lines)}</div>`;
  return `<div class="cell" style="background:${BANDS[c.band].css}">
      <div class="chead"><div class="num">${String(n).padStart(2,'0')}</div>${svg(ICON[c.icon])}</div>
      <div class="cbig${c.sm ? ' sm' : ''}">${esc(c.big)}</div>
      ${MODE === 's' ? `<div class="ctext">${text}</div>` : text}
      <div class="csrc">${esc(src)}</div>
    </div>`;
}

const WORD = { mixed:'mixed', no:'contradicted', yes:'holds' };
const legendChips = Object.values(BANDS).map(b => `<div class="chip"><i style="background:${b.css}"></i>${esc(b.legend)}<em>· ${WORD[b.verdict]}</em></div>`).join('')
  + `<div class="chip"><i style="background:var(--c-pilot)"></i>First-party pilot</div>`;

let gridHtml;
if (MODE === 'l') {
  gridHtml = ROWS_X.map(([band, ids]) => `<div class="col">
      <div class="colhead" style="background:${BANDS[band].css}"><span>${esc(BANDS[band].col)}</span>${svg(VERDICT[BANDS[band].verdict],34)}</div>
      ${ids.map(cellHtml).join('')}
    </div>`).join('');
} else {
  gridHtml = (MODE === 'p' ? ROWS_P : ROWS_X).map(([band, ids]) => `<div class="row">
      <div class="rail" style="background:${BANDS[band].css}">${svg(VERDICT[BANDS[band].verdict],34)}<span>${esc(BANDS[band].rail)}</span></div>
      ${ids.map(cellHtml).join('')}
    </div>`).join('');
}

const TITLE = {
  p: { eyebrow:'New site, crowded local market · field chart · Sept 2026',
       head:'of local keywords showed<br>a Google AI Overview',
       thesis:'A new site’s gap is coverage, not markup',
       sub:'seoClarity · 500M+ U.S. keywords · Sept 2025 (0.14% in March). Local questions: 92% (Whitespark).' },
  s: { eyebrow:'New site, crowded local market · Sept 2026',
       head:'of local keywords showed<br>a Google AI Overview',
       thesis:'A new site’s gap is coverage, not markup',
       sub:'seoClarity · 500M+ U.S. keywords · Sept 2025 (0.14% in March).' },
  l: { eyebrow:'New site, crowded local market · field chart · Sept 2026',
       head:'of local keywords showed a Google AI Overview',
       thesis:'A new site’s gap is coverage, not markup',
       sub:'' },
}[MODE];

const PILOT = {
  p:'Waikiki surf school, 2026: 973 competitor pages crawled. Search Console clicks 5 → 54, impressions 470 → 1,652 over two 28-day windows. One site, small base; the explorer launched after the window.',
  s:'Waikiki surf school, 2026: 973 competitor pages crawled. Clicks 5 → 54 over two 28-day windows. One site, small base.',
  l:'Waikiki surf school, 2026: 973 competitor pages crawled; clicks 5 → 54 over two 28-day windows.',
}[MODE];

const SOURCES = 'Sources and dates on each cell · full list with links: mj2.pro/blog/rank-new-site-saturated-market';

const titleHtml = MODE === 'l'
  ? `<div class="titlebar"><div class="eyebrow">${esc(TITLE.eyebrow)}</div>
       <div class="headrow"><div class="counter">0.01%</div>
         <div class="htext"><div class="headline">${TITLE.head}</div><div class="thesis">${esc(TITLE.thesis)}</div></div></div></div>`
  : `<div class="titlebar"><div class="eyebrow">${esc(TITLE.eyebrow)}</div>
       <div class="headrow"><div class="counter">0.01%</div><div class="headline">${TITLE.head}</div></div>
       <div class="thesis">${esc(TITLE.thesis)}</div>
       <div class="subline">${TITLE.sub}</div></div>`;

const markup = `
  ${titleHtml}
  ${MODE === 'l' ? '' : `<div class="legend"><div class="lab">Premise checked</div>${legendChips}</div>`}
  <div class="grid">${gridHtml}</div>
  <div class="foot">
    <div class="strip pilot"><b>First-party pilot</b><div>${esc(PILOT)}</div></div>
    ${MODE === 'p' ? `<div class="strip gap"><b>Not measured</b><div>No tours-and-activities touchpoint count exists; no independent check on Arival’s channel survey.</div></div>` : ''}
    ${MODE === 'l'
      ? `<div class="footrow"><div class="sources">${esc(SOURCES)}</div><div class="key">${svg(VERDICT.no,34)}<span>contradicted</span>${svg(VERDICT.mixed,34)}<span>mixed</span>${svg(VERDICT.yes,34)}<span>holds</span></div></div>`
      : `<div class="sources">${esc(SOURCES)}</div>`}
  </div>`;

/* Parse the constant markup and move the nodes in (no user input reaches it). */
const parsed = new DOMParser().parseFromString(`<div id="root">${markup}</div>`, 'text/html');
document.getElementById('poster').replaceChildren(...parsed.getElementById('root').childNodes);

const stage = document.getElementById('stage');
function layout(){
  stage.style.width = W + 'px'; stage.style.height = H + 'px';
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  stage.style.transform = `scale(${s})`;
}
layout();
window.addEventListener('resize', layout);

window.VIZ = {
  size: [W, H], mode: MODE, duration: 0,
  seek(){},
  ready: (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve())
    .then(() => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r))))
    .then(() => { layout(); document.documentElement.dataset.ready = '1'; return true; }),
};
</script>
</body>
</html>
