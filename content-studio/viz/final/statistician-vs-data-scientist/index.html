   Visual language: content-studio/viz/directions/05-journey-map (v2, approved

   Two paved roads leave one trailhead ("a career in data") and pass the same
   five stops — education gate, pay, employment & growth, tools, live postings —
   to a dark journey's end that states the practice difference. Growth engineer
   and AI engineer leave the same trailhead as dashed side paths that end at
   signposts: no BLS occupation code, so no stop on either road has data for
   them; only job-board counts do.

   URL params
     ?size=1080x1350 | 1080x1080 | 2160x2700 | 640x800 | portrait | square
                 fixed pixel size (exports). Omit it (or size=fluid) for the
                 live page: the map then fits whatever frame it is given.
     ?format=square   square layout in fluid mode
     ?poster=1   freeze at the settled frame; hides the prompt bar and drawer
     ?gif=1      static clock, the exporter drives it; hides the prompt bar
     ?static=1   no rAF; only window.VIZ.seek() moves the clock
     ?t=4.2      seek to a time in seconds
     ?parent=https://mj2.pro/blog/statistician-vs-data-scientist/
                 base URL for every stop's fallback link. Without it: when framed,
                 document.referrer (the embedding page); when opened on its own
                 (e.g. from the LinkedIn link), the post URL in STANDALONE_PARENT —
                 never a top-level referrer, which would be LinkedIn or Google.
                 Only http(s)/file URLs count.

   Click contract (same message type as the search-intent maps)
     A click, Enter or Space on a stop highlights it and posts
       { type: 'viz-intent', intent: '<section>', stop: '<stop>' }
     to window.parent; the stop is also a plain <a target="_top"> to
       <parent>#role-<section>
     for hosts that do not listen. <section> is always an anchor that exists in
     drafts/2026-09-14-statistician-vs-data-scientist.blog.md:
       no-bls-code | pay | growth | education | practice | methods
     (tools and postings have no section of their own; both map to "methods").

   Export hook
     window.VIZ = { ready, duration, seek(t), frame(), selectIntent(slug), stops }
     document.documentElement.dataset.ready === '1' once the first paint is done.

   Every figure is lifted from content-studio/research/2026-09-14/roles/data.json;
   the ledger path is noted beside each one. Two derived figures are the ledger's
   own shock-stat wording (shock-stats.md #1 "more than 3x", #2 "~$35K", #3

   ========================================================================= */

  if (m) return { w: +m[1], h: +m[2] };
  return Q.get('format') === 'square' ? { w: 1080, h: 1080 } : { w: 1080, h: 1350 };
})();

  ground: G(svg), terrain: G(svg), ghost: G(svg), road: G(svg),
  cards: G(svg), marks: G(svg), chrome: G(svg), fx: G(svg),
};
el('rect', { x: 0, y: 0, width: M.W, height: M.H, fill: C.cream }, L.ground);

/* posterised terrain: flat blobs, contour rings, hatch ticks — deterministic */
(function terrain() {
  let seed = 20260924;
  const rnd = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
  const top = M.titleH + 8, bot = keyCapY - 24;
  for (let i = 0; i < 24; i++) {
    const cx = 16 + rnd() * (M.W - 32), cy = top + rnd() * (bot - top), rr = 28 + rnd() * 64;
    el('ellipse', { cx: cx.toFixed(1), cy: cy.toFixed(1), rx: rr.toFixed(1), ry: (rr * (0.48 + rnd() * 0.42)).toFixed(1), fill: rnd() > 0.5 ? C.paper : C.paper2 }, L.terrain);
  }
  for (let i = 0; i < 13; i++) {
    const cx = 16 + rnd() * (M.W - 32), cy = top + rnd() * (bot - top), rr = 40 + rnd() * 92;
    el('circle', { cx: cx.toFixed(1), cy: cy.toFixed(1), r: rr.toFixed(1), fill: 'none', stroke: C.rule, 'stroke-width': 2, opacity: 0.55 }, L.terrain);
    el('circle', { cx: cx.toFixed(1), cy: cy.toFixed(1), r: (rr * 0.64).toFixed(1), fill: 'none', stroke: C.rule, 'stroke-width': 2, opacity: 0.45 }, L.terrain);
  }
  for (let i = 0; i < 80; i++) {
    const x = 16 + rnd() * (M.W - 32), y = top + rnd() * (bot - top);
    el('rect', { x: x.toFixed(1), y: y.toFixed(1), width: 8, height: 2.6, rx: 1.3, fill: C.rule, opacity: 0.6 }, L.terrain);
  }
})();

/* --------------------------------------------------------------- title bar */
(function titleBar() {
  const g = L.chrome;
  el('rect', { x: 0, y: 0, width: M.W, height: M.titleH, fill: C.bar }, g);
  for (let i = 0; i < 14; i++) el('rect', { x: M.W - 420 + i * 30, y: 0, width: 11, height: M.titleH - 9, fill: '#FFFFFF', opacity: 0.05 }, g);
  el('rect', { x: 0, y: M.titleH - 9, width: M.W, height: 9, fill: C.gold }, g);

  const padX = SQ ? 34 : 40, wMax = M.W - padX * 2;
  const eb = { size: F.eyebrow, weight: 800, family: BODY, spacing: 1.6 };
  line(g, COPY.eyebrow, padX, M.eyebrowY, { ...eb, size: fit(COPY.eyebrow, wMax, eb, 12), fill: C.eyebrow },
    [padX, M.eyebrowY - F.eyebrow * 0.8, wMax, F.eyebrow * 1.05]);

  const bs = { size: F.big, weight: 800, family: DISPLAY, spacing: -2 };
  const bigW = measure(COPY.big, bs);
  line(g, COPY.big, padX - 2, M.bigBase, { ...bs, fill: C.gold }, [padX - 3, M.bigBase - F.big * 0.78, bigW + 6, F.big * 1.0]);

  /* three lines to the right, their cap block spanning the numeral's cap height */
  const lx = padX + bigW + (SQ ? 18 : 24), lw = M.W - padX - lx;
  const hs = { size: F.bigLines, weight: 800, family: DISPLAY, spacing: 0.3 };
  const size = Math.min(...COPY.lines.map(s => fit(s, lw, hs, 18)));
  const capBig = F.big * 0.72, capL = size * 0.72;
  const step = (capBig - capL) / 2;
  COPY.lines.forEach((s, i) => {
    const b = M.bigBase - capBig + capL + i * step;
    line(g, s, lx, b, { ...hs, size, fill: C.cream }, [lx - 1, b - size * 0.8, lw + 2, size * 1.03]);
  });

  const ss = { size: F.sub, weight: 600, family: BODY };
  const sub = SQ ? COPY.subSq : COPY.sub;
  line(g, sub, padX, M.subY, { ...ss, size: fit(sub, wMax, ss, 12), fill: C.cream }, [padX, M.subY - F.sub * 0.8, wMax, F.sub * 1.05]);
  g.querySelectorAll('text').forEach(t => t.setAttribute('data-zone', 'title'));   // the exporter's contrast gate keys on this
})();

/* ------------------------------------------------- the four-way trailhead */
const MED = { x: M.W / 2, y: Y.trailTop + M.medR + (SQ ? 2 : 4), r: M.medR };
const PILL = { cx: M.W / 2, cy: MED.y + M.medR + 6 + M.pillH / 2, h: M.pillH };
PILL.bot = PILL.cy + M.pillH / 2;
(function trailhead() {
  const g = L.marks;
  const ps = { size: F.pill, weight: 800, family: DISPLAY, spacing: 1.3 };
  const tw = measure(COPY.trailhead, ps);
  const w = tw + (SQ ? 30 : 38);
  el('rect', { x: PILL.cx - w / 2, y: PILL.cy - PILL.h / 2, width: w, height: PILL.h, rx: PILL.h / 2, fill: C.ink }, g);
  line(g, COPY.trailhead, PILL.cx, PILL.cy + F.pill * 0.36, { ...ps, fill: C.cream, anchor: 'middle' },
    [PILL.cx - w / 2 + 4, PILL.cy - PILL.h / 2, w - 8, PILL.h]);
  PILL.w = w;
  mandala(g, MED.x, MED.y, MED.r);
})();

/* --------------------------------------------------- click / jump targets
   A stop posts to the embedding parent AND is a plain top-level link. */
function safeBase(u) {
  if (!u) return '';
  try {
    const p = new URL(u, location.href);
    if (!/^(https?|file):$/.test(p.protocol)) return '';
    p.hash = '';
    return p.href;
  } catch (e) { return ''; }
}
const STANDALONE_PARENT = 'https://mj2.pro/blog/statistician-vs-data-scientist/';
const FRAMED = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
function parentUrl() {
  const p = safeBase(Q.get('parent'));
  if (p) return p;
  if (!FRAMED) return STANDALONE_PARENT;   // top-level: the referrer is whoever linked here, not a host page
  try { return safeBase(document.referrer); } catch (e) { return ''; }
}
const hrefFor = section => parentUrl() + '#role-' + section;
const STOP_NODES = [];        // { key, section, a, ring, label }
function stopLink(parent, key, section, label) {
  const a = el('a', { href: hrefFor(section), target: '_top', tabindex: INTERACTIVE ? 0 : -1, 'aria-label': `${label}: read the section` }, parent);
  a.setAttribute('data-stop', key);
  a.setAttribute('data-section', section);
  return a;
}

/* ------------------------------------------------------ side-path signposts */
const SIGNS = {};
SIDE.forEach(sp => {
  const w = M.sideW, h = sp.h;
  const x = sp.side === 'L' ? (SQ ? 20 : 22) : M.W - (SQ ? 20 : 22) - w;
  const y = Y.trailTop + (trailH - h) / 2;
  const a = stopLink(L.cards, sp.key, sp.section, sp.label);
  const g = G(a);
  el('rect', { x: x + 4, y: y + 5, width: w, height: h, rx: 16, fill: C.ink, opacity: 0.08 }, g);
  el('rect', { x, y, width: w, height: h, rx: 16, fill: C.flagTint }, g);
  const cid = 'clip-' + sp.key;
  const cp = el('clipPath', { id: cid }, g);
  el('rect', { x, y, width: w, height: h, rx: 16 }, cp);
  const hatch = G(g, { 'clip-path': `url(#${cid})`, opacity: 0.08 });   // 8%, down from 16%, so text over it clears 4.5:1
  for (let i = -h; i < w; i += 14) el('rect', { x: x + i, y: y - 4, width: 3, height: h * 1.8, fill: C.flag, transform: `rotate(35 ${x + i} ${y})` }, hatch);
  el('rect', { x, y, width: w, height: h, rx: 16, fill: 'none', stroke: C.flag, 'stroke-width': 3, 'stroke-dasharray': '10 7' }, g);

  const pad = M.pad;
  const ts = { size: F.sideTitle, weight: 800, family: DISPLAY, spacing: 0.8 };
  const tb = y + (SQ ? 19 : 24);
  icon(g, 'sign', x + pad + (SQ ? 8 : 10), tb - F.sideTitle * 0.34, SQ ? 9 : 11, C.ink);
  const tx = x + pad + (SQ ? 22 : 27);
  const chipTxt = 'NO BLS CODE';
  const cs = { size: F.chip, weight: 800, family: BODY, spacing: 1.2 };
  const chipW = measure(chipTxt, cs) + (SQ ? 14 : 18), chipH = SQ ? 19 : 22;
  const chipX = x + w - pad - chipW;
  const titleW = chipX - 8 - tx;
  line(g, sp.title, tx, tb, { ...ts, size: fit(sp.title, titleW, ts, 14), fill: C.ink }, [tx - 1, tb - F.sideTitle * 0.8, titleW + 2, F.sideTitle * 1.03]);
  el('rect', { x: chipX, y: tb - F.sideTitle * 0.36 - chipH / 2, width: chipW, height: chipH, rx: chipH / 2, fill: C.flagDeep }, g);
  line(g, chipTxt, chipX + chipW / 2, tb - F.sideTitle * 0.36 + F.chip * 0.36, { ...cs, fill: '#FFFFFF', anchor: 'middle' },
    [chipX + 2, tb - F.sideTitle * 0.36 - chipH / 2, chipW - 4, chipH]);

  const body = G(g, { 'data-body': sp.key });
  const r = stack(body, sp.rows, x + pad, y + sideTitleH + (SQ ? 6 : 8), w - pad * 2, { ...SIDE_OPT, figFill: C.flagDeep });
  const ring = el('rect', { x: x - 4, y: y - 4, width: w + 8, height: h + 8, rx: 19, fill: 'none', stroke: C.ink, 'stroke-width': 5, opacity: 0, 'pointer-events': 'none' }, g);
  SIGNS[sp.key] = { x, y, w, h, body, rollers: r.nodes.rollers, side: sp.side };
  STOP_NODES.push({ key: sp.key, section: sp.section, a, ring, label: sp.label });
});

/* -------------------------------------------------------------- the stops */
const BANDS = {};
STOPS.forEach(s => {
  const x0 = M.bandX0, x1 = M.bandX1, w = x1 - x0, y = s.y, h = s.h, col = TC[s.key];
  const a = stopLink(L.cards, s.key, s.section, s.label);
  const g = G(a);
  el('rect', { x: x0 + 5, y: y + 6, width: w, height: h, rx: 20, fill: C.ink, opacity: 0.10 }, g);
  el('rect', { x: x0, y, width: w, height: h, rx: 20, fill: col.tint, stroke: col.deep, 'stroke-width': 3 }, g);
  const cid = 'clip-' + s.key;
  const cp = el('clipPath', { id: cid }, g);
  el('rect', { x: x0, y, width: w, height: h, rx: 20 }, cp);
  const rings = G(g, { 'clip-path': `url(#${cid})`, opacity: 0.13 });
  for (let i = 0; i < 5; i++) el('circle', { cx: M.mid, cy: y + h + 30, r: 60 + i * 38, fill: 'none', stroke: col.deep, 'stroke-width': 3 }, rings);

  const hh = M.headH;
  el('path', { d: `M${x0} ${y + hh} V${y + 20} A20 20 0 0 1 ${x0 + 20} ${y} H${x1 - 20} A20 20 0 0 1 ${x1} ${y + 20} V${y + hh} Z`, fill: col.deep }, g);

  /* header: role tags at both ends, number disc + name + icon centred */
  const tg = { size: F.tag, weight: 800, family: BODY, spacing: 1.3 };
  const tagY = y + hh / 2 + F.tag * 0.36;
  const lt = s.n === 1 ? `${ROLE.stat.name} · ${ROLE.stat.soc}` : ROLE.stat.name;
  const rt = s.n === 1 ? `${ROLE.ds.name} · ${ROLE.ds.soc}` : ROLE.ds.name;
  const ltw = measure(lt, tg), rtw = measure(rt, tg);
  line(g, lt, x0 + M.pad, tagY, { ...tg, fill: '#FFFFFF' }, [x0 + M.pad - 1, y + 2, ltw + 3, hh - 4]);
  line(g, rt, x1 - M.pad, tagY, { ...tg, fill: '#FFFFFF', anchor: 'end' }, [x1 - M.pad - rtw - 2, y + 2, rtw + 3, hh - 4]);
  const ns = { size: F.head, weight: 800, family: DISPLAY, spacing: 0.8 };
  const nw = measure(s.title, ns);
  const dr = SQ ? 11 : 13.5, iw = SQ ? 22 : 26;
  const groupW = dr * 2 + 10 + nw + 10 + iw;
  const gx = M.mid - groupW / 2;
  const disc = G(L.marks, { 'data-disc': s.n });
  el('circle', { cx: gx + dr, cy: y + hh / 2, r: dr, fill: C.cream, stroke: col.deep, 'stroke-width': 3 }, disc);
  const nt = el('text', { x: gx + dr, y: y + hh / 2 + F.disc * 0.36, 'text-anchor': 'middle', 'font-family': DISPLAY, 'font-size': F.disc, 'font-weight': 800, fill: col.deep }, disc);
  nt.textContent = s.n;
  const nx = gx + dr * 2 + 10;
  line(g, s.title, nx, y + hh / 2 + F.head * 0.35, { ...ns, fill: '#FFFFFF' }, [nx - 1, y + 2, nw + 3, hh - 4]);
  icon(g, s.icon, nx + nw + 10 + iw / 2, y + hh / 2, SQ ? 9.5 : 11.5, '#FFFFFF', col.deep);

  /* body: two halves split by a dashed divider, then an optional strip */
  const body = G(g, { 'data-body': s.key });
  const top = y + hh + M.bodyPad;
  const lx = x0 + M.pad, rx = M.mid + (SQ ? 12 : 16);
  const L1 = stack(body, s.left, lx, top, bandInnerW, { figFill: col.deep, countFill: col.ink, countW: s.countW });
  const R1 = stack(body, s.right, rx, top, bandInnerW, { figFill: col.deep, countFill: col.ink, countW: s.countW });
  const divBot = top + s.bodyH + 2;
  el('line', { x1: M.mid, y1: y + hh + 6, x2: M.mid, y2: divBot, stroke: col.deep, 'stroke-width': 2, 'stroke-dasharray': '4 6', opacity: 0.5 }, g);
  if (s.strip) {
    const txt = SQ && s.strip.sq ? s.strip.sq : s.strip.text;
    const st = { size: F.strip, weight: 600, family: BODY };
    const sw = w - M.pad * 2;
    const sb = top + s.bodyH + M.stripGap + F.strip * 0.78;
    el('rect', { x: x0 + M.pad, y: sb - F.strip * 0.78 - M.stripGap / 2 - 1, width: sw, height: 1.5, fill: col.deep, opacity: 0.35 }, body);
    line(body, txt, x0 + M.pad, sb, { ...st, size: fit(txt, sw, st, 12), fill: C.ink }, [x0 + M.pad - 1, sb - F.strip * 0.8, sw + 2, F.strip * 1.05]);
  }
  /* keep the decorative rings out from under text: the rings are masked with a
     hole round every line, and the holes fade in with the text they protect */
  const mkId = 'ringmask-' + s.key;
  const mk = el('mask', { id: mkId, maskUnits: 'userSpaceOnUse', x: x0, y, width: w, height: h }, g);
  el('rect', { x: x0, y, width: w, height: h, fill: '#fff' }, mk);
  const cut = G(mk, {});
  body.querySelectorAll('text').forEach(t => {
    const b = t.getBBox();
    el('rect', { x: b.x - 6, y: b.y - 4, width: b.width + 12, height: b.height + 8, rx: 5, fill: '#000' }, cut);
  });
  rings.setAttribute('mask', `url(#${mkId})`);
  const ring = el('rect', { x: x0 - 4, y: y - 4, width: w + 8, height: h + 8, rx: 23, fill: 'none', stroke: C.flag, 'stroke-width': 6, opacity: 0, 'pointer-events': 'none' }, g);
  BANDS[s.key] = { n: s.n, x0, x1, y, h, cy: y + h / 2, col, body, cut, disc, rollers: [...L1.nodes.rollers, ...R1.nodes.rollers], flip: L1.nodes.flip || R1.nodes.flip };
  STOP_NODES.push({ key: s.key, section: s.section, a, ring, label: s.label });
});

/* ---------------------------------------------------------- journey's end */
const ENDC = {};
(function journeysEnd() {
  const x = M.endX0, w = M.endX1 - M.endX0, y = Y.endTop, h = END_H;
  const a = stopLink(L.cards, END.key, END.section, 'Journey’s end, the practice difference');
  const g = G(a);
  el('rect', { x: x + 5, y: y + 6, width: w, height: h, rx: 20, fill: C.ink, opacity: 0.2 }, g);
  el('rect', { x, y, width: w, height: h, rx: 20, fill: C.ink, stroke: C.gold, 'stroke-width': 4 }, g);
  const cp = el('clipPath', { id: 'clip-end' }, g);
  el('rect', { x, y, width: w, height: h, rx: 20 }, cp);
  const burst = G(g, { 'clip-path': 'url(#clip-end)' });
  const bx0 = x + w / 2, by0 = y + h * 0.55;
  for (let i = 0; i < 28; i++) {
    const an = (i / 28) * Math.PI * 2, a1 = an - 0.045, a2 = an + 0.045, R = 520;
    el('path', { d: `M${bx0} ${by0} L${(bx0 + Math.cos(a1) * R).toFixed(1)} ${(by0 + Math.sin(a1) * R).toFixed(1)} L${(bx0 + Math.cos(a2) * R).toFixed(1)} ${(by0 + Math.sin(a2) * R).toFixed(1)} Z`, fill: C.gold, opacity: 0.09 }, burst);
  }
  const pad = M.endPad;
  const es = { size: F.endEye, weight: 800, family: BODY, spacing: 2 };
  const ey = y + (SQ ? 19 : 24);
  const srcS = { size: F.endSrc, weight: 700, family: BODY, spacing: 0.9 };
  const srcW = measure(END.src, srcS);
  icon(g, 'flagpin', x + pad + 8, ey - F.endEye * 0.36, SQ ? 8.5 : 10, C.gold);
  const ex = x + pad + (SQ ? 20 : 24), ew = w - pad * 2 - srcW - 24 - (SQ ? 20 : 24);
  line(g, END.eyebrow, ex, ey, { ...es, size: fit(END.eyebrow, ew, es, 12), fill: C.gold }, [ex - 1, ey - F.endEye * 0.8, ew + 2, F.endEye * 1.05]);
  line(g, END.src, x + w - pad, ey, { ...srcS, fill: C.gold, anchor: 'end' }, [x + w - pad - srcW - 2, ey - F.endSrc * 0.8, srcW + 3, F.endSrc * 1.05]);
  const mid = x + w / 2;
  el('line', { x1: mid, y1: y + endEyeH + 2, x2: mid, y2: y + h - 12, stroke: C.gold, 'stroke-width': 2, 'stroke-dasharray': '4 6', opacity: 0.55 }, g);
  const body = G(g, { 'data-body': 'end' });
  const heads = [];
  ['left', 'right'].forEach(side => {
    const hx = side === 'left' ? x + pad : mid + (SQ ? 12 : 16);
    const hw = endHalfW;
    const hs = { size: F.endHead, weight: 800, family: DISPLAY, spacing: 0 };
    const hb = y + endEyeH + F.endHead * 0.78;
    const hsz = fit(END[side].head, hw, hs, 18);
    heads.push(line(body, END[side].head, hx, hb, { ...hs, size: hsz, fill: C.gold }, [hx - 1, hb - F.endHead * 0.8, hw + 2, F.endHead * 1.02]));
    endLines(side).forEach((t, k) => {
      const b = hb + F.endHead * 0.22 + (SQ ? 6 : 8) + F.endTxt * 0.78 + k * F.endTxt * 1.3;
      line(body, t, hx, b, { ...endTextStyle, fill: C.endText }, [hx - 1, b - F.endTxt * 0.8, hw + 2, F.endTxt * 1.05]);
    });
  });
  const ring = el('rect', { x: x - 4, y: y - 4, width: w + 8, height: h + 8, rx: 23, fill: 'none', stroke: C.flag, 'stroke-width': 6, opacity: 0, 'pointer-events': 'none' }, g);
  Object.assign(ENDC, { x, y, w, h, body });
  STOP_NODES.push({ key: END.key, section: END.section, a, ring, label: 'Journey’s end, the practice difference' });
})();

/* ------------------------------------------------------------------- roads
   Two roads leave the pill's foot together, fork along one gutter, run the
   outer channels past the five stops and hook into journey's end from either
   side. The right road is the left road mirrored, so both reach every stop at
   the same moment. Cards draw after the roads (layer order), so the roads
   read as passing behind the stops. */
const ROUTE_L = [
  [M.W / 2, PILL.bot + 3],
  [M.W / 2, Y.fork],
  [M.chanL, Y.fork],
  [M.chanL, Y.endCy],
  [M.endX0 + 1, Y.endCy],
];
const flatNear = p => (p.y < Y.fork + 30 ? 3.5 : 9);           // keep the fork gutter tidy
const PTS_L = meanderPts(ROUTE_L, { amp: 9, wavelength: 165, ampAt: flatNear });
const PTS_R = PTS_L.map(([x, y]) => [M.W - x, y]);
const ROAD_D = [toD(PTS_L), toD(PTS_R)];

ROAD_D.forEach(d => el('path', { d, fill: 'none', stroke: C.ghost, 'stroke-width': 13, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'stroke-dasharray': '2 13' }, L.ghost));

const defs = el('defs', {}, svg);
const roadMask = el('mask', { id: 'road-reveal', maskUnits: 'userSpaceOnUse', x: 0, y: 0, width: M.W, height: M.H }, defs);
const roadBases = ROAD_D.map((d, i) => el('path', { d, fill: 'none', stroke: C.road, 'stroke-width': 14, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', mask: 'url(#road-reveal)', 'data-road': i ? 'right' : 'left' }, L.road));
const ROAD_LEN = roadBases[0].getTotalLength();
const roadReveals = ROAD_D.map(d => el('path', { d, fill: 'none', stroke: '#fff', 'stroke-width': 26, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'stroke-dasharray': `0 ${ROAD_LEN + 20}` }, roadMask));
ROAD_D.forEach(d => el('path', { d, fill: 'none', stroke: C.cream, 'stroke-width': 2.8, 'stroke-dasharray': '10 11', mask: 'url(#road-reveal)' }, L.road));
const chevrons = G(L.road, { mask: 'url(#road-reveal)' });
roadBases.forEach(rb => {
  const step = 118, w = 7.5, hgt = 9;
  for (let d = 40; d < ROAD_LEN - 24; d += step) {
    const p = rb.getPointAtLength(d), q = rb.getPointAtLength(Math.min(ROAD_LEN, d + 6));
    const an = Math.atan2(q.y - p.y, q.x - p.x) * 180 / Math.PI;
    el('path', { d: `M${-hgt} ${-w} L${hgt * 0.7} 0 L${-hgt} ${w} L${-hgt * 0.35} 0 Z`, fill: C.gold, transform: `translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${an.toFixed(1)})` }, chevrons);
  }
});

/* side paths: dashed footpaths from the medallion to each signpost */
const sideD = SIDE.map(sp => {
  const sg = SIGNS[sp.key];
  const y = MED.y;
  const x0 = sp.side === 'L' ? MED.x - MED.r - 2 : MED.x + MED.r + 2;
  const x1 = sp.side === 'L' ? sg.x + sg.w + 2 : sg.x - 2;
  const mx = (x0 + x1) / 2, bend = SQ ? 5 : 7;
  return `M${x0} ${y} C${(x0 + mx) / 2} ${y - bend} ${(mx + x1) / 2} ${y + bend} ${x1} ${y}`;
});
sideD.forEach(d => el('path', { d, fill: 'none', stroke: C.ghost, 'stroke-width': 6, 'stroke-linecap': 'round', 'stroke-dasharray': '1 11' }, L.ghost));
const sideMask = el('mask', { id: 'side-reveal', maskUnits: 'userSpaceOnUse', x: 0, y: 0, width: M.W, height: M.H }, defs);
const sidePaths = sideD.map((d, i) => el('path', { d, fill: 'none', stroke: C.flag, 'stroke-width': 7, 'stroke-linecap': 'round', 'stroke-dasharray': '1 12', mask: 'url(#side-reveal)', 'data-road': i ? 'side-right' : 'side-left' }, L.road));
const SIDE_LEN = sidePaths[0].getTotalLength();
const sideReveals = sideD.map(d => el('path', { d, fill: 'none', stroke: '#fff', 'stroke-width': 18, 'stroke-linecap': 'round', 'stroke-dasharray': `0 ${SIDE_LEN + 20}` }, sideMask));

/* travellers */
const travel = G(L.fx);
const travellers = [0, 1].map(() => ({
  ring: el('circle', { r: 15, fill: C.gold, opacity: 0.5 }, travel),
  dot: el('circle', { r: 9.5, fill: C.flag, stroke: C.cream, 'stroke-width': 3 }, travel),
}));
const sideTrav = [0, 1].map(() => el('circle', { r: 6.5, fill: C.flagDeep, stroke: C.cream, 'stroke-width': 2.5 }, travel));

/* milestone pips where each road passes each stop */
function lengthAt(path, px, py) {
  let best = 0, bestD = Infinity;
  for (let i = 0; i <= 1400; i++) {
    const l = (i / 1400) * ROAD_LEN, p = path.getPointAtLength(l);
    const d = (p.x - px) ** 2 + (p.y - py) ** 2;
    if (d < bestD) { bestD = d; best = l; }
  }
  return best;
}
const MILE = STOPS.map(s => {
  const b = BANDS[s.key];
  const at = lengthAt(roadBases[0], M.chanL, b.cy);
  return { n: s.n, key: s.key, L: at, col: TC[s.key], pts: roadBases.map(rb => rb.getPointAtLength(at)) };
});
MILE.forEach(m => {
  m.pips = m.pts.map((p, i) => {
    const g = G(L.marks, { 'data-mile': `${m.n}${i ? 'R' : 'L'}` });
    el('circle', { cx: p.x, cy: p.y, r: 13, fill: C.cream, stroke: C.roadDark, 'stroke-width': 4, 'data-pip': 1 }, g);
    el('circle', { cx: p.x, cy: p.y, r: 6.5, fill: m.col.deep }, g);
    return g;
  });
});

/* ------------------------------------------------------------------ map key */
(function mapKey() {
  const g = L.chrome;
  const x0 = SQ ? 26 : 30, totalW = M.W - x0 * 2, gut = SQ ? 16 : 21;
  const colW = (totalW - gut * (M.keyCols - 1)) / M.keyCols;
  const cap = { size: F.keyCap, weight: 800, family: BODY, spacing: 2.2 };
  line(g, 'MAP KEY — HOW TO READ THIS MAP', x0, keyCapY, { ...cap, fill: C.muted }, [x0, keyCapY - F.keyCap * 0.8, totalW, F.keyCap * 1.05]);
  el('rect', { x: x0, y: keyRuleY, width: totalW, height: 2, fill: C.rule }, g);
  KEY.forEach((it, i) => {
    const c = i % M.keyCols, r = Math.floor(i / M.keyCols);
    const x = x0 + c * (colW + gut), y = keyTop + r * M.keyRowH;
    const icx = x + 14, icy = y + (M.keyLines === 1 ? F.keyTxt * 0.45 : M.keyRowH * 0.42);
    const iconColor = it.icon === 'book' ? TC.education.deep : it.icon === 'clip' ? TC.growth.deep : it.icon === 'glass' ? TC.postings.deep : C.ink;
    icon(g, it.icon, icx, icy, SQ ? 10 : 12, iconColor, C.cream);
    const tx = x + (SQ ? 30 : 34), tw = colW - (SQ ? 30 : 34);
    const ls = { size: F.keyTxt, weight: 800, family: BODY, spacing: 0.8 };
    const vs = { size: F.keyTxt, weight: 500, family: BODY };
    if (M.keyLines === 1) {
      const b = y + F.keyTxt * 0.78;
      const lw = measure(it.label, ls);
      line(g, it.label, tx, b, { ...ls, fill: C.ink }, [tx - 1, b - F.keyTxt * 0.8, lw + 3, F.keyTxt * 1.05]);
      const vx = tx + lw + 7, vw = x + colW - vx;
      const val = SQ ? it.sq : it.val;
      line(g, val, vx, b, { ...vs, size: fit(val, vw, vs, 12), fill: C.muted }, [vx - 1, b - F.keyTxt * 0.8, vw + 2, F.keyTxt * 1.05]);
    } else {
      const b1 = y + F.keyTxt * 0.9, b2 = b1 + F.keyTxt * 1.3;
      line(g, it.label, tx, b1, { ...ls, size: fit(it.label, tw, ls, 12), fill: C.ink }, [tx - 1, b1 - F.keyTxt * 0.8, tw + 2, F.keyTxt * 1.05]);
      line(g, it.val, tx, b2, { ...vs, size: fit(it.val, tw, vs, 12), fill: C.muted }, [tx - 1, b2 - F.keyTxt * 0.8, tw + 2, F.keyTxt * 1.05]);
    }
  });
})();

/* ------------------------------------------------------------- source line */
(function sourceLine() {
  const s = { size: F.src, weight: 500, family: BODY };
  const x0 = SQ ? 26 : 30, w = M.W - x0 * 2;
  const txt = measure(SOURCE_LINE, s) <= w ? SOURCE_LINE : SOURCE_LINE_SHORT;
  line(L.chrome, txt, x0, M.srcY, { ...s, size: fit(txt, w, s, 12), fill: C.muted }, [x0, M.srcY - F.src * 0.8, w, F.src * 1.05]);
})();

/* =========================================================== the animation
   Pacing (Mitch, 2026-09-22): draw about 2x slower than a natural sweep and
   hold a 0.7 s beat as the trail enters each stop. Order: the two dashed side
   paths run out to their signposts first (the title's claim, shown), a beat,
   then both roads draw together, pausing at each of the five stops, and
   journey's end resolves last. The schedule is built from the pips' real
   positions along the finished road, so it survives any change of geometry.
   No single leg runs longer than T.maxLeg: the fork leg is ~45% of each road
   and would otherwise hold back the first figure for three seconds. */
const PAUSE = 0.7;
const T = { start: 0.15, sideDraw: 0.8, roadSpan: 7.2, maxLeg: 2.5, endReveal: 0.9, tail: 0.35 };
const easeInOut = u => (u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2);
const easeOut = u => 1 - Math.pow(1 - u, 3);
const clamp01 = v => Math.max(0, Math.min(1, v));

T.sideEnd = T.start + T.sideDraw;
T.roadStart = T.sideEnd + PAUSE;
const SEGS = [];
(function buildSchedule() {
  let t = T.roadStart, frac = 0;
  for (const m of MILE.slice().sort((a, b) => a.L - b.L)) {
    const f = m.L / ROAD_LEN, dur = Math.min(T.maxLeg, (f - frac) * T.roadSpan);   // the long fork leg is capped so stop 1 lands sooner
    SEGS.push({ t0: t, t1: t + dur, f0: frac, f1: f, hold: false });
    t += dur; m.t = t;
    SEGS.push({ t0: t, t1: t + PAUSE, f0: f, f1: f, hold: true });
    t += PAUSE; frac = f;
  }
  const dur = (1 - frac) * T.roadSpan;
  SEGS.push({ t0: t, t1: t + dur, f0: frac, f1: 1, hold: false });
  T.roadEnd = t + dur;
})();
const DURATION = T.roadEnd + T.endReveal + T.tail;

function roadFrac(t) {
  if (t <= T.roadStart) return 0;
  if (t >= T.roadEnd) return 1;
  for (const s of SEGS) {
    if (t > s.t1) continue;
    if (s.hold) return s.f1;
    const u = s.t1 > s.t0 ? (t - s.t0) / (s.t1 - s.t0) : 1;
    return s.f0 + (s.f1 - s.f0) * easeInOut(clamp01(u));
  }
  return 1;
}
const sideFrac = t => easeInOut(clamp01((t - T.start) / T.sideDraw));

/* What appears when. A figure only exists once its trail has arrived, so an
   un-rolled counter can never read as a measured zero. */
const REVEALS = [];
SIDE.forEach(sp => REVEALS.push({ body: SIGNS[sp.key].body, t0: T.sideEnd, rollers: SIGNS[sp.key].rollers }));
MILE.forEach(m => REVEALS.push({ body: BANDS[m.key].body, cut: BANDS[m.key].cut, t0: m.t, rollers: BANDS[m.key].rollers, flip: BANDS[m.key].flip, disc: BANDS[m.key].disc, band: BANDS[m.key], m }));

function render(t) {
  t = Math.max(0, Math.min(DURATION, t));
  /* side paths */
  const sf = sideFrac(t) * SIDE_LEN;
  sideReveals.forEach(p => p.setAttribute('stroke-dasharray', `${sf.toFixed(1)} ${(SIDE_LEN + 20).toFixed(1)}`));
  sidePaths.forEach((sp, i) => {
    const on = t > T.start && t < T.sideEnd;
    const p = sp.getPointAtLength(Math.max(0.01, sf));
    sideTrav[i].setAttribute('cx', p.x.toFixed(1)); sideTrav[i].setAttribute('cy', p.y.toFixed(1));
    sideTrav[i].setAttribute('opacity', on ? 1 : 0);
  });
  /* roads */
  const shown = roadFrac(t) * ROAD_LEN;
  roadReveals.forEach(p => p.setAttribute('stroke-dasharray', `${shown.toFixed(1)} ${(ROAD_LEN + 20).toFixed(1)}`));
  const moving = t > T.roadStart && shown < ROAD_LEN;
  roadBases.forEach((rb, i) => {
    const p = rb.getPointAtLength(Math.max(0.01, shown));
    const tr = travellers[i];
    for (const n of [tr.ring, tr.dot]) { n.setAttribute('cx', p.x.toFixed(1)); n.setAttribute('cy', p.y.toFixed(1)); }
    tr.ring.setAttribute('r', (14 + 4.5 * Math.sin(t * 9)).toFixed(1));
    tr.ring.setAttribute('opacity', moving ? 0.5 : 0);
    tr.dot.setAttribute('opacity', moving ? 1 : 0);
  });
  /* stops */
  for (const r of REVEALS) {
    const since = t - r.t0, on = since >= 0;
    const vis = on ? easeOut(clamp01(since / 0.35)).toFixed(3) : 0;
    r.body.setAttribute('opacity', vis);
    if (r.cut) r.cut.setAttribute('opacity', vis);
    for (const ro of r.rollers) {
      const k = easeOut(clamp01(since / 0.5));
      ro.node.textContent = FMTS[ro.fmt](ro.to * (on ? k : 0));
    }
    if (r.flip) {
      const k = easeOut(clamp01((since - 0.45) / 0.35));
      const x = +r.flip.getAttribute('x'), w0 = r.flip.__w || (r.flip.__w = +r.flip.getAttribute('width'));
      r.flip.setAttribute('width', (w0 * k).toFixed(1));
      r.flip.setAttribute('x', x);
    }
    if (r.m) {
      const k = on ? Math.min(1, since / 0.28) : 0;
      const s = on ? 1 + 0.6 * (1 - easeOut(k)) : 0.001;
      r.m.pips.forEach((pip, i) => {
        const p = r.m.pts[i];
        pip.setAttribute('transform', `translate(${p.x} ${p.y}) scale(${s.toFixed(3)}) translate(${-p.x} ${-p.y})`);
        pip.setAttribute('opacity', on ? 1 : 0);
      });
      const b = r.band, c = r.disc.querySelector('circle');
      const cx = +c.getAttribute('cx'), cy = +c.getAttribute('cy');
      const ds = on ? 1 + 0.35 * (1 - easeOut(Math.min(1, since / 0.4))) : 1;
      r.disc.setAttribute('transform', `translate(${cx} ${cy}) scale(${ds.toFixed(3)}) translate(${-cx} ${-cy})`);
    }
  }
  /* journey's end */
  const ek = easeOut(clamp01((t - T.roadEnd) / T.endReveal));
  ENDC.body.setAttribute('opacity', t < T.roadEnd ? 0 : ek.toFixed(3));
  ENDC.body.setAttribute('transform', `translate(0 ${((1 - ek) * 10).toFixed(2)})`);
}

/* ------------------------------------------------------------ interaction */
const prompt = document.getElementById('prompt');
const PROMPT_DEFAULT = prompt.textContent;
let selected = null;
function paint() {
  for (const s of STOP_NODES) s.ring.setAttribute('opacity', s.key === selected ? 1 : s.hover ? 0.55 : 0);
}
function selectIntent(slug) {
  const hit = STOP_NODES.filter(s => s.key === slug || s.section === slug);
  if (!hit.length) return false;
  const s = hit[0];
  selected = s.key; paint();
  try {
    if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'viz-intent', intent: s.section, stop: s.key }, '*');
  } catch (e) { /* a blocked parent read never stops the native link fallback */ }
  return true;
}
STOP_NODES.forEach(s => {
  s.a.addEventListener('click', () => selectIntent(s.key));
  s.a.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); s.a.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true })); }
  });
  const on = () => { s.hover = true; paint(); prompt.textContent = `Read the section: ${s.label} →`; };
  const off = () => { s.hover = false; paint(); prompt.textContent = PROMPT_DEFAULT; };
  s.a.addEventListener('mouseenter', on); s.a.addEventListener('mouseleave', off);
  s.a.addEventListener('focus', on); s.a.addEventListener('blur', off);
});

/* sources drawer */
(function drawer() {
  const list = document.getElementById('drawer-list');
  SOURCES.forEach(s => {
    const li = document.createElement('li');
    const b = document.createElement('b'); b.textContent = s.name; li.appendChild(b);
    const when = document.createElement('span'); when.className = 'when'; when.textContent = ` — ${s.when}. `; li.appendChild(when);
    li.appendChild(document.createTextNode(s.use + ' '));
    s.links.forEach(([label, url], i) => {
      const a = document.createElement('a'); a.href = url; a.textContent = label; a.target = '_blank'; a.rel = 'noopener noreferrer';
      li.appendChild(a);
      if (i < s.links.length - 1) li.appendChild(document.createTextNode(' · '));
    });
    list.appendChild(li);
  });
  document.getElementById('drawer-note').textContent = SOURCE_NOTE;
  const btn = document.getElementById('src-btn'), dr = document.getElementById('drawer');
  const close = dr.querySelector('.x'), head = document.getElementById('drawer-h');
  const set = open => {
    dr.hidden = !open; btn.setAttribute('aria-expanded', String(open));
    if (open) head.focus(); else btn.focus();
  };
  btn.addEventListener('click', () => set(dr.hidden));
  close.addEventListener('click', () => set(false));
  dr.addEventListener('keydown', e => { if (e.key === 'Escape') set(false); });
})();

/* text alternative for screen readers */
document.getElementById('summary').textContent =
  'Two of four data job titles have no BLS occupation code. Statistician (SOC 15-2041) and data scientist (SOC 15-2051) are paved roads through five stops. ' +
  'Education: 62% of statisticians hold a master’s as highest credential; data scientists split 48% bachelor’s and 44% master’s (O*NET). ' +
  'Pay: median $105,650 vs $120,230 (BLS OOH, May 2025 wages); inside computer systems design the order flips, $167,180 vs $132,380. Self-reported data-scientist pay: $82,910 global, $160,000 US-only (Stack Overflow 2025), not averaged. ' +
  'Employment and growth: +11% vs +35% jobs 2025–35 (BLS OOH); 31,300 vs 275,600 employed (BLS OOH); 29,030 vs 262,440 in the OEWS survey. ' +
  'Tools: SPSS, SAS, Minitab, MATLAB vs TensorFlow, Spark, Kubernetes (O*NET); all Stack Overflow 2025 respondents: Python 57.9%, SQL 58.6%, R 4.9%. ' +
  'Live postings on 2026-09-14: statistician Indeed 1,000 (rounded), Built In 2, no Wellfound role page; data scientist Indeed no count shown, Built In 32, Wellfound 161 remote. ' +
  'Side paths with no BLS code: growth engineer Indeed 50 (rounded), Built In 3, no Wellfound role page; AI engineer Wellfound 1,985 remote vs 161 for data scientist, Built In 103, Indeed 3,000 (rounded). ' +
  'Journey’s end: statisticians prove why (inference); data scientists predict what next (prediction), per Yardstick and Indeed Career Advice.';

/* ------------------------------------------------------------- clock / API
   Live page: one slowed draw, then it holds (no loop). Reduced motion skips
   straight to the settled frame. */
const REDUCED_MOTION = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
let clock = 0, raf = null, t0 = null;
function loop(ts) {
  if (t0 === null) t0 = ts;
  clock = (ts - t0) / 1000;
  if (clock >= DURATION) { clock = DURATION; render(DURATION); raf = null; return; }
  render(clock);
  raf = requestAnimationFrame(loop);
}
const initialT = POSTER ? DURATION
  : Q.has('t') ? (parseFloat(Q.get('t')) || 0)
  : REDUCED_MOTION ? DURATION
  : 0;
render(initialT);
clock = initialT;
if (!STATIC && !Q.has('t') && !REDUCED_MOTION) raf = requestAnimationFrame(loop);

window.VIZ = {
  ready: Promise.resolve(true),
  duration: DURATION,
  format: FMT,
  size: SIZE,
  schedule: { sideEnd: T.sideEnd, roadStart: T.roadStart, stops: MILE.map(m => ({ key: m.key, t: +m.t.toFixed(3) })), roadEnd: T.roadEnd },
  seek(t) { if (raf) { cancelAnimationFrame(raf); raf = null; } clock = t; render(t); return t; },
  frame() { return clock; },
  selectIntent,
  stops: STOP_NODES.map(s => ({ key: s.key, section: s.section })),
};
document.documentElement.dataset.ready = '1';
</script>
</body>
