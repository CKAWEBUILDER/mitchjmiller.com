<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AEM Content Fragment Architecture</title>
  <desc id="desc">Architecture diagram for reusable AEM content fragments across service lines, regions, and channels.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <rect x="64" y="64" width="1472" height="772" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="116" y="138" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800" fill="#0f172a">AEM Content Fragment Architecture</text>
  <text x="118" y="182" font-family="Inter, Arial, sans-serif" font-size="22" fill="#475569">Reusable metadata and content models for multi-brand healthcare sites</text>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="120" y="320" width="350" height="138" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
    <rect x="120" y="320" width="9" height="138" rx="4" fill="#2563eb"/>
    <text x="154" y="372" font-size="27" font-weight="800" fill="#0f172a">Content model</text>
    <text x="154" y="409" font-size="18" fill="#334155">Service line, region, brand, provider, location</text>

    <rect x="660" y="210" width="380" height="118" rx="16" fill="#ecfeff" stroke="#a5f3fc"/>
    <rect x="660" y="210" width="9" height="118" rx="4" fill="#06b6d4"/>
    <text x="694" y="258" font-size="25" font-weight="800" fill="#0f172a">Fragments</text>
    <text x="694" y="294" font-size="18" fill="#334155">Titles, summaries, FAQs, schema fields</text>

    <rect x="660" y="455" width="380" height="118" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
    <rect x="660" y="455" width="9" height="118" rx="4" fill="#f97316"/>
    <text x="694" y="503" font-size="25" font-weight="800" fill="#0f172a">Variations</text>
    <text x="694" y="539" font-size="18" fill="#334155">California, Texas, Arizona, local market edits</text>

    <rect x="1190" y="255" width="290" height="105" rx="16" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="1222" y="303" font-size="24" font-weight="800" fill="#0f172a">Pages</text>
    <text x="1222" y="336" font-size="18" fill="#334155">Service-line surfaces</text>

    <rect x="1190" y="475" width="290" height="105" rx="16" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="1222" y="523" font-size="24" font-weight="800" fill="#0f172a">Structured data</text>
    <text x="1222" y="556" font-size="18" fill="#334155">Entity and FAQ markup</text>
  </g>

  <line x1="500" y1="380" x2="626" y2="281" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="500" y1="398" x2="626" y2="501" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="1072" y1="289" x2="1158" y2="305" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="1072" y1="519" x2="1158" y2="529" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="165" y="684" width="290" height="74" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="195" y="728" font-size="20" font-weight="700" fill="#0f172a">Migration leverage</text>

    <rect x="500" y="684" width="290" height="74" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="530" y="728" font-size="20" font-weight="700" fill="#0f172a">Reusable governance</text>

    <rect x="835" y="684" width="290" height="74" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="865" y="728" font-size="20" font-weight="700" fill="#0f172a">Regional flexibility</text>

    <rect x="1170" y="684" width="290" height="74" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="1200" y="728" font-size="20" font-weight="700" fill="#0f172a">Search consistency</text>
  </g>
</svg>
