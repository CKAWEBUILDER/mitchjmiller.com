const easeOutBack = t => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const easeInOut = t => (t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const win = (t, a, b) => clamp((t - a) / (b - a), 0, 1);

const hex2rgb = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
const rgb2hex = c => '#' + c.map(v => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('');
const tint  = (hue, a, over = PAPER) => { const A = hex2rgb(hue), B = hex2rgb(over); return rgb2hex([0, 1, 2].map(i => lerp(B[i], A[i], a))); };
const shade = (hue, a) => rgb2hex(hex2rgb(hue).map(v => v * (1 - a)));

/* angle: degrees clockwise from 12 o'clock */
const pt = (cx, cy, r, deg) => { const rad = (deg - 90) * Math.PI / 180; return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)]; };
const f = n => Math.round(n * 100) / 100;

function sectorPath(cx, cy, r0, r1, a0, a1) {
  if (a1 - a0 <= 0.0001 || r1 - r0 <= 0.01) return 'M0 0';
  const big = (a1 - a0) > 180 ? 1 : 0;
  const [x0, y0] = pt(cx, cy, r1, a0), [x1, y1] = pt(cx, cy, r1, a1);
  const [x2, y2] = pt(cx, cy, r0, a1), [x3, y3] = pt(cx, cy, r0, a0);
  return `M${f(x0)} ${f(y0)}A${f(r1)} ${f(r1)} 0 ${big} 1 ${f(x1)} ${f(y1)}` +
         `L${f(x2)} ${f(y2)}A${f(r0)} ${f(r0)} 0 ${big} 0 ${f(x3)} ${f(y3)}Z`;
}
function arcPath(cx, cy, r, a0, a1, reversed) {
  const A = reversed ? a1 : a0, B = reversed ? a0 : a1;
  const [x0, y0] = pt(cx, cy, r, A), [x1, y1] = pt(cx, cy, r, B);
  const big = Math.abs(B - A) > 180 ? 1 : 0;
  return `M${f(x0)} ${f(y0)}A${f(r)} ${f(r)} 0 ${big} ${reversed ? 0 : 1} ${f(x1)} ${f(y1)}`;
}
/* clockwise from 12 o'clock by `deg`, safe all the way to a closed circle */
function sweepPath(cx, cy, r, deg) {
  if (deg < 0.4) return 'M0 0';
  if (deg < 359.9) return arcPath(cx, cy, r, 0, deg, false);
  const [x0, y0] = pt(cx, cy, r, 0), [x1, y1] = pt(cx, cy, r, 180);
  return `M${f(x0)} ${f(y0)}A${f(r)} ${f(r)} 0 1 1 ${f(x1)} ${f(y1)}A${f(r)} ${f(r)} 0 1 1 ${f(x0)} ${f(y0)}`;
}

/* ---------------------------------------------------------------- mode + size */
const Q = new URLSearchParams(location.search);
const parseSize = s => { const m = String(s || '').trim().match(/^(\d{2,5})\s*[x×]\s*(\d{2,5})$/); return m ? [+m[1], +m[2]] : null; };
const [W, H] = parseSize(Q.get('size')) || [1080, 1350];
const S  = W / 1080;
const px = n => n * S;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const tParam = Q.get('t');
const POSTER = Q.has('poster') || Q.has('static') || tParam !== null;
document.body.className = POSTER ? 'poster' : 'live';

/* every piece of type on the artboard is >= this */
const MIN_PX = px(14);

const stage = document.getElementById('stage');
const svg = document.getElementById('viz');
svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
svg.setAttribute('width', W); svg.setAttribute('height', H);
if (POSTER) { stage.style.width = W + 'px'; stage.style.height = H + 'px'; }
svg.setAttribute('role', POSTER ? 'img' : 'group');
svg.setAttribute('aria-label',
  'Data mandala of ten growth, SEO and AI-search job titles. Hub: Growth Operations Engineer returns 0 exact-phrase US postings on SimplyHired and 10,000+ on LinkedIn’s guest search, 14 September 2026. Rings from the crown inward: postings floor versus placeholder ceiling, the spread of published median pay, and the dated trend signal.');

/* ---------------------------------------------------------------- layout */
const TALL  = H / W >= 1.15;         // 4:5 poster vs square
const RAIL  = TALL;                  // the reading rail only fits the 4:5 crops
const M      = Math.round(px(30));
const BAR_H  = Math.round(px(TALL ? 178 : 160));
const KEY_H  = Math.round(px(56));
const ROW = px(19.5), RHEAD = px(26), RLEG = px(24);
const RAIL_H = RAIL ? Math.round(px(10) + RHEAD + N * ROW + RLEG + px(2)) : 0;
const FOOT_H = Math.round(px(RAIL ? 30 : 56));

const CX = W / 2;
const areaTop = BAR_H + KEY_H, areaBot = H - FOOT_H - RAIL_H;
const R  = Math.floor(Math.min((areaBot - areaTop) / 2 - px(5), (W - 2 * M) / 2));
const CY = Math.round(areaTop + (areaBot - areaTop) / 2);

const rr = k => R * k;
const HUB = rr(0.240);
/* rings, outside in: [0] = ring 1 postings, [1] = ring 2 pay, [2] = ring 3 signal */
const BANDS = [
  { i: rr(0.686), o: rr(0.887) },
  { i: rr(0.468), o: rr(0.669) },
  { i: rr(0.250), o: rr(0.451) },
];
const CROWN = { i: rr(0.897), o: R };
const GUT  = 0.9;                                  // degrees of gutter each side of a sector
const MEDR = BANDS.map(B => (B.o - B.i) / 2 - px(3));
const MEDR_NM = MEDR[2] + px(3.5);                   // the honest blanks are a little larger on purpose

/* ring 1 bars: log10(n + 1) over 1..12,000 postings. ring 2 bars: linear $40K..$480K */
const LOGMAX = Math.log10(12001);
const rLog = (n, B) => B.i + (B.o - B.i) * Math.log10(n + 1) / LOGMAX;
const PAY_MIN = 40000, PAY_MAX = 480000;
const rPay = (v, B) => B.i + (B.o - B.i) * clamp((v - PAY_MIN) / (PAY_MAX - PAY_MIN), 0, 1);

/* ---------------------------------------------------------------- scaffold */
const defs = el('defs', {}, svg);
const grad = el('radialGradient', { id: 'bloom', cx: '50%', cy: '50%', r: '50%' }, defs);
el('stop', { offset: '0%',  'stop-color': PAPER_DEEP }, grad);
el('stop', { offset: '58%', 'stop-color': PAPER }, grad);
el('stop', { offset: '100%','stop-color': PAPER }, grad);

el('rect', { x: 0, y: 0, width: W, height: H, fill: PAPER }, svg);
el('circle', { cx: CX, cy: CY, r: R * 1.16, fill: 'url(#bloom)' }, svg);

const gStatic = el('g', {}, svg);   // phyllotaxis grain + tick rings (armature)
const gBands  = el('g', {}, svg);
const gBars   = el('g', {}, svg);
const gRings  = el('g', {}, svg);
const gSpokes = el('g', {}, svg);
const gMeds   = el('g', {}, svg);
const gCrown  = el('g', {}, svg);
const gHub    = el('g', {}, svg);
const gHilite = el('g', {}, svg);   // live-mode selection veil + outline
const gChrome = el('g', {}, svg);
const gHit    = el('g', {}, svg);   // live-mode sector buttons (transparent, on top)

/* stripe patterns (userSpaceOnUse, so hatching runs continuously across sectors) */
let patN = 0;
function stripes(bg, fg, w, gap, angle) {
  const id = 'pat' + (patN++), s = px(w + gap);
  const p = el('pattern', { id, patternUnits: 'userSpaceOnUse', width: f(s), height: f(s), patternTransform: `rotate(${angle})` }, defs);
  if (bg) el('rect', { width: f(s), height: f(s), fill: bg }, p);
  el('rect', { width: f(px(w)), height: f(s), fill: fg }, p);
  return `url(#${id})`;
}

/* ---------------------------------------------------------------- text utils */
function txt(parent, s, a) { const t = el('text', a, parent); t.textContent = s; return t; }
/* shrink-to-fit that refuses to go below the artboard floor */
function fit(t, maxW, floor) {
  const lo = Math.max(floor === undefined ? MIN_PX : floor, 1);
  let size = parseFloat(t.getAttribute('font-size')), guard = 80;
  while (guard-- > 0 && t.getComputedTextLength() > maxW && size > lo) {
    size = Math.max(lo, size * 0.97); t.setAttribute('font-size', f(size));
  }
  return size;
}
function icon(parent, name, x, y, size, color, sw) {
  const g = el('g', { transform: `translate(${f(x - size / 2)} ${f(y - size / 2)}) scale(${f(size / 24)})` }, parent);
  for (const d of ICON[name]) {
    el('path', { d, fill: ICON_FILLED[name] ? color : 'none', stroke: color,
      'stroke-width': (sw || 2.15), 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
  }
  return g;
}

/* ============================================================== ORNAMENT (static armature) */
function tickRing(parent, r, count, len, w, color, op) {
  const g = el('g', { opacity: op }, parent);
  for (let i = 0; i < count; i++) {
    const a = (360 / count) * i;
    const [x0, y0] = pt(CX, CY, r - len / 2, a), [x1, y1] = pt(CX, CY, r + len / 2, a);
    el('line', { x1: f(x0), y1: f(y0), x2: f(x1), y2: f(y1), stroke: color, 'stroke-width': f(w), 'stroke-linecap': 'round' }, g);
  }
}
/* ticks live in the band gaps only — never where type sits */
tickRing(gStatic, (BANDS[0].i + BANDS[1].o) / 2, N * 9, (BANDS[0].i - BANDS[1].o) * 0.62, px(1.4), INK, 0.30);
tickRing(gStatic, (BANDS[1].i + BANDS[2].o) / 2, N * 6, (BANDS[1].i - BANDS[2].o) * 0.62, px(1.4), INK, 0.30);

(function grain() {
  const n = 900, golden = Math.PI * (3 - Math.sqrt(5));
  const g = el('g', { opacity: 0.30 }, gStatic);
  for (let i = 0; i < n; i++) {
    const rad = Math.sqrt(i / n) * CROWN.i;
    if (rad < HUB * 1.06) continue;
    const a = (i * golden * 180 / Math.PI) % 360;
    const [x, y] = pt(CX, CY, rad, a);
    const idx = Math.floor(((a + HALF) % 360) / SEC) % N;
    el('circle', { cx: f(x), cy: f(y), r: f(px(1.0) + (i % 3) * px(0.3)), fill: shade(TITLES[idx].hue, 0.16) }, g);
  }
})();

/* ============================================================== CELLS */
const art = [];
const RING_TINT = [0.15, 0.30, 0.46];
const sigBlank = t => t.signal.type === 'none' || t.signal.type === 'pulled';
const PATS = [];

/* width of a string at a size, measured on the artboard and thrown away */
function measure(s, size, weight, cls, ls) {
  const t = el('text', { x: -9999, y: -9999, 'font-size': f(size), 'font-weight': weight, class: cls || null, 'letter-spacing': ls ? f(ls) : null }, svg);
  t.textContent = s; const w = t.getComputedTextLength(); t.remove(); return w;
}
const inkDesc = s => (/[gjpqy,;()\[\]{}Q$]/.test(s) ? 0.22 : 0.03);
/* a line of width w whose ink spans yTop..yBot fits the disc with `pad` to spare */
const fitsDisc = (r, w, yTop, yBot, pad) => {
  const yy = Math.max(Math.abs(yTop), Math.abs(yBot)) + pad;
  return yy < r && 2 * Math.sqrt(r * r - yy * yy) >= w + 2 * pad;
};
/* a medallion face: a big line over a small line. Searches for the largest big-line
   size, and the vertical offset closest to centre, at which both lines clear the rim. */
function face(g, big, small, r, { rule = false, soft = false, id } = {}) {
  const ss = MIN_PX, pad = px(3), ls = -px(0.6);
  const wS = measure(small, ss, 700, 'num'), dS = inkDesc(small);
  const gap = ss * (rule ? 0.62 : 0.36);
  let best = null;
  for (let sb = r * 0.66; sb >= ss && !best; sb -= px(0.5)) {
    const wB = measure(big, sb, 800, 'num', ls), hb = sb * 0.75, hs = ss * 0.75;
    for (let k = 0; k <= 28; k++) {
      const dy = (k % 2 ? 1 : -1) * Math.ceil(k / 2) * px(0.5);        // 0, -0.5, +0.5, -1, ...
      const yb = -(hb + gap + hs) / 2 + dy + hb, ys = yb + gap + hs;
      if (fitsDisc(r, wB, yb - hb, yb + sb * inkDesc(big), pad) && fitsDisc(r, wS, ys - hs, ys + ss * dS, pad)) { best = { sb, yb, ys }; break; }
    }
  }
  if (!best) best = { sb: ss, yb: -px(2), ys: px(13) };               // audit will flag it
  txt(g, big, { x: 0, y: f(best.yb), 'text-anchor': 'middle', class: 'num', 'font-size': f(best.sb), 'font-weight': 800,
    'letter-spacing': f(ls), fill: soft ? '#6E6457' : INK, 'data-cover': id });
  if (rule) el('line', { x1: f(-r * 0.40), y1: f(best.yb + gap / 2), x2: f(r * 0.40), y2: f(best.yb + gap / 2), stroke: INK,
    'stroke-width': f(px(1.3)), 'stroke-dasharray': `${f(px(3))} ${f(px(2.4))}`, 'stroke-opacity': 0.55 }, g);
  txt(g, small, { x: 0, y: f(best.ys), 'text-anchor': 'middle', class: 'num', 'font-size': f(ss), 'font-weight': 700,
    fill: INK_SOFT, 'data-cover': id });
}
/* the honest blanks: spelled out in full, never abbreviated. The long word sits
   just below centre, where the disc is widest. */
function blankFace(g, words, r, id) {
  const size = MIN_PX, h = size * 0.75, ls2 = -px(0.35);
  const y2 = px(6.4), y1 = y2 - h - px(4.6);
  txt(g, words[0], { x: 0, y: f(y1), 'text-anchor': 'middle', 'font-size': f(size), 'font-weight': 700,
    fill: '#6E6457', 'letter-spacing': f(px(0.4)), 'data-cover': id });
  txt(g, words[1], { x: 0, y: f(y2), 'text-anchor': 'middle', 'font-size': f(size), 'font-weight': 650,
    fill: '#6E6457', 'letter-spacing': f(ls2), 'data-cover': id });
}

TITLES.forEach((t, ii) => {
  const A = ii * SEC, a0 = A - HALF + GUT, a1 = A + HALF - GUT, hue = t.hue;
  const pat = {
    thin:  stripes(tint(hue, 0.10), tint(hue, 0.40), 2.2, 3.6, 45),
    bar:   stripes(tint(hue, 0.55), hue, 2.6, 2.4, 45),
    claim: stripes(null, shade(hue, 0.18), 1.5, 3.3, -45),
    cat:   stripes(tint(hue, 0.18), tint(hue, 0.50), 2.0, 3.2, -45),
    crown: stripes(tint(hue, 0.42), hue, 3.2, 2.8, 45),
  };
  PATS.push(pat);

  BANDS.forEach((B, ri) => {
    const blank = ri === 2 && sigBlank(t);
    const fillBand = blank ? tint(NM, 0.22)
      : t.thin ? pat.thin
      : (ri === 2 && t.signal.type === 'category') ? pat.cat
      : tint(shade(hue, 0.08), RING_TINT[ri]);
    const band = el('path', {
      d: sectorPath(CX, CY, B.i, B.o, a0, a1), fill: fillBand,
      stroke: shade(hue, t.thin ? 0.38 : 0.30), 'stroke-width': f(px(t.thin ? 1.3 : 0.9)),
      'stroke-opacity': t.thin ? 0.75 : 0.32, 'stroke-dasharray': t.thin ? `${f(px(4))} ${f(px(3))}` : null,
    }, gBands);

    /* petal ornament — two lobes flanking the medallion, twenty per ring */
    const pg = el('g', { opacity: 0.55 }, gBands);
    if (ri < 2) for (const side of [-1, 1]) {
      const c = A + side * SEC * 0.31, w = SEC * 0.12;
      const [tx, ty] = pt(CX, CY, B.o - (B.o - B.i) * 0.08, c);
      const [bx, by] = pt(CX, CY, B.i + (B.o - B.i) * 0.10, c);
      const [lx, ly] = pt(CX, CY, (B.i + B.o) / 2, c - w);
      const [rx, ry] = pt(CX, CY, (B.i + B.o) / 2, c + w);
      el('path', { d: `M${f(bx)} ${f(by)}Q${f(lx)} ${f(ly)} ${f(tx)} ${f(ty)}Q${f(rx)} ${f(ry)} ${f(bx)} ${f(by)}Z`,
        fill: 'none', stroke: shade(hue, 0.36), 'stroke-width': f(px(1.15)), 'stroke-opacity': 0.55 }, pg);
    }

    /* ring 1: solid blade = exact-phrase floor; hatched zone + dashed arc = LinkedIn's placeholder.
       ring 2: range bar from the lowest to the highest published median, ink caps at both ends. */
    const bars = {};
    if (ri === 0) {
      if (!t.mentions && t.postings.floor > 0) {
        bars.bar = el('path', { d: 'M0 0', fill: hue, stroke: shade(hue, 0.34), 'stroke-width': f(px(1.1)) }, gBars);
        bars.cap = el('path', { d: 'M0 0', fill: 'none', stroke: INK, 'stroke-width': f(px(2.6)), 'stroke-opacity': 0.9 }, gBars);
      }
      bars.claim = el('path', { d: 'M0 0', fill: pat.claim, stroke: 'none' }, gBars);
      bars.ceil = el('path', { d: 'M0 0', fill: 'none', stroke: INK, 'stroke-width': f(px(1.8)),
        'stroke-dasharray': `${f(px(5))} ${f(px(3.6))}`, 'stroke-opacity': 0.85 }, gBars);
      bars.r0 = B.i; bars.rf = t.mentions ? B.i : rLog(t.postings.floor, B); bars.rc = rLog(t.postings.ceiling, B);
    } else if (ri === 1) {
      bars.bar = el('path', { d: 'M0 0', fill: t.thin ? pat.bar : hue, stroke: shade(hue, 0.34), 'stroke-width': f(px(1.1)) }, gBars);
      bars.cap = el('path', { d: 'M0 0', fill: 'none', stroke: INK, 'stroke-width': f(px(2.4)), 'stroke-opacity': 0.9 }, gBars);
      bars.r0 = rPay(t.pay.lo.v, B); bars.r1 = rPay(t.pay.hi.v, B);
    }

    /* medallion: a paper disc, so its type is always horizontal and never crossed */
    const [mx, my] = pt(CX, CY, (B.i + B.o) / 2, A);
    const g = el('g', { transform: `translate(${f(mx)} ${f(my)})` }, gMeds);
    const gs = el('g', {}, g);
    const dashedGrey = blank || (ri === 0 && t.mentions);
    const MR = blank ? MEDR_NM : MEDR[ri];
    const id = `disc-${ri}-${ii}`;
    el('circle', { r: f(MR + px(3.6)), fill: shade(dashedGrey ? NM : hue, 0.05), opacity: 0.26 }, gs);
    el('circle', { id, r: f(MR), fill: PAPER, stroke: dashedGrey ? NM : shade(hue, 0.14), 'stroke-width': f(px(3.2)),
      'stroke-dasharray': (dashedGrey || t.thin) ? `${f(px(5))} ${f(px(4))}` : null }, gs);
    if (blank) blankFace(gs, t.signal.type === 'pulled' ? ['CLAIM', 'PULLED'] : ['NOT', 'MEASURED'], MR, id);
    else if (ri === 0) face(gs, t.postings.face[0], t.mentions ? 'mentions' : t.postings.face[1].replace(/,000\+$/, 'K+'), MR, { rule: !t.mentions, soft: t.mentions, id });
    else if (ri === 1) face(gs, t.pay.face[0], t.pay.face[1], MR, { id });
    else face(gs, t.signal.face, t.signal.sub, MR, { id });

    art.push({ ri, ii, band, pg, bars, B, med: g, scale: gs, a0, a1 });
  });

  /* crown: saturated rim (hatched for thin data) + an inset inscription plate nothing crosses */
  const crownWedge = el('path', { d: sectorPath(CX, CY, CROWN.i, CROWN.o, a0, a1), fill: t.thin ? pat.crown : hue,
    stroke: shade(hue, 0.34), 'stroke-width': f(px(1.2)) }, gCrown);
  const pin = CROWN.i + px(4), pout = CROWN.o - px(4.5);
  const plate = el('path', { d: sectorPath(CX, CY, pin, pout, a0 + 1.1, a1 - 1.1), fill: tint(hue, 0.20),
    stroke: shade(hue, 0.40), 'stroke-width': f(px(t.thin ? 1.6 : 1.3)), 'stroke-opacity': 0.8,
    'stroke-dasharray': t.thin ? `${f(px(4))} ${f(px(3))}` : null }, gCrown);
  art.push({ crownOnly: true, ii, band: crownWedge, plate, labs: [], a0, a1, pin, pout });

  /* spoke divider + boss */
  const sa = A + HALF;
  const [sx0, sy0] = pt(CX, CY, HUB + px(2), sa), [sx1, sy1] = pt(CX, CY, CROWN.o, sa);
  el('line', { x1: f(sx0), y1: f(sy0), x2: f(sx1), y2: f(sy1), stroke: INK, 'stroke-width': f(px(2.0)), 'stroke-opacity': 0.85 }, gSpokes);
  const [dx, dy] = pt(CX, CY, CROWN.i, sa);
  el('circle', { cx: f(dx), cy: f(dy), r: f(px(4.6)), fill: PAPER, stroke: INK, 'stroke-width': f(px(1.8)) }, gSpokes);
});

/* crown names: one or two curved lines per plate. Two passes so every single-line
   name shares one size and every two-line name shares another. */
(function crownNames() {
  const specs = [];
  TITLES.forEach((t, ii) => {
    const c = art.find(x => x.crownOnly && x.ii === ii);
    const mid = (c.pin + c.pout) / 2, lead = px(16.2);
    const ta0 = c.a0 + 1.7, ta1 = c.a1 - 1.7;
    const midA = ((ta0 + ta1) / 2 + 360) % 360, rev = midA > 90 && midA < 270;
    t.crown.forEach((s, k) => {
      const n = t.crown.length, off = n === 1 ? 0 : (k === 0 ? lead / 2 : -lead / 2);
      const rl = rev ? mid - off : mid + off;            // top half: first line outside; bottom half: first line inside
      const rad = s2 => (rev ? rl + s2 * 0.36 : rl - s2 * 0.36);   // centre the glyphs on the line, not the baseline
      const id = `crown-${ii}-${k}`;
      const p = el('path', { id, d: arcPath(CX, CY, rad(px(17)), ta0, ta1, rev), fill: 'none' }, defs);
      const tx = el('text', { 'font-size': f(px(17)), 'font-weight': 800, fill: INK, 'letter-spacing': f(px(0.3)),
        'text-anchor': 'middle', 'data-arc': id }, gCrown);
      const tp = el('textPath', { href: '#' + id, startOffset: '50%' }, tx);
      tp.textContent = s;
      c.labs.push(tx);
      specs.push({ n, tx, p, rad, ta0, ta1, rev });
    });
  });
  const fitsAt = (sp, size) => {
    sp.tx.setAttribute('font-size', f(size));
    sp.p.setAttribute('d', arcPath(CX, CY, sp.rad(size), sp.ta0, sp.ta1, sp.rev));
    return sp.tx.getComputedTextLength() <= sp.p.getTotalLength() * 0.94;

/* ============================================================== TIMELINE

   Stages run from the crown inward: crown, ring 1, ring 2, ring 3, hub. */
const BEAT = 0.70, STAG = 0.05;

  crown: [0.00, 1.30],
  ring1: [2.00, 3.10],
  ring2: [3.80, 4.90],
  ring3: [5.60, 6.70],
  hub:   [7.40, 8.45],

  wipeEnd: 10.55,

  return up * (1 - easeInOut(win(t, T.holdEnd, T.wipeEnd)));

    const k = revealOf(t, c.crownOnly ? T.crown : RINGWIN[c.ri], c.ii);
    const a1 = c.a0 + (c.a1 - c.a0) * k;
    if (c.crownOnly) {
      c.band.setAttribute('d', sectorPath(CX, CY, CROWN.i, CROWN.o, c.a0, a1));
      c.plate.setAttribute('opacity', f(easeOutExpo(clamp((k - 0.40) / 0.60, 0, 1))));

    c.band.setAttribute('d', sectorPath(CX, CY, c.B.i, c.B.o, c.a0, a1));

      b.ceil.setAttribute('d', cg <= 0.002 ? 'M0 0' : arcPath(CX, CY, rc, c.a0, c.a1, false));

/* frame plan for the exporter: moving frames at `fps`, one long frame per beat */
function framePlan(fps, opts) {
  const wipe = !opts || opts.wipe !== false;
  const dt = 1 / fps, ms = Math.round(dt * 1000), out = [];
  const seg = (a, b) => { for (let t = a; t < b - 1e-6; t += dt) out.push({ t: +t.toFixed(4), delay: ms }); };
  const beat = t => out.push({ t: +t.toFixed(4), delay: Math.round(BEAT * 1000) });
  seg(T.crown[0], T.crown[1]); beat(T.crown[1]);
  seg(T.ring1[0], T.ring1[1]); beat(T.ring1[1]);
  seg(T.ring2[0], T.ring2[1]); beat(T.ring2[1]);
  seg(T.ring3[0], T.ring3[1]); beat(T.ring3[1]);

  } catch (e) {}
  try {
    const raw = Q.get('parent');
    if (raw) { const u = new URL(raw, location.href); if (u.origin === location.origin) return u.origin + u.pathname + u.search; }
  } catch (e) {}
  return new URL('/blog/growth-title-market/', location.href).href;
}
function toParent(msg) {

}

function paintSelection() {
  HILITE.forEach((hl, i) => {

}
function selectTitle(id) {
  let idx = null;
  if (id !== null && id !== undefined && id !== false) {
    idx = typeof id === 'number' ? id : TITLES.findIndex(x => x.slug === String(id).toLowerCase());
    if (idx < 0 || idx >= N) return false;

  selected = idx;
  paintSelection();
  if (!panel) return true;
  if (idx === null) { panel.hidden = true; panel.replaceChildren(); return true; }
  renderPanel(TITLES[idx]);

  return true;
}

  app.append(h('details', { id: 'sources' },

const HITS = [];
if (!POSTER) {
  const app = document.getElementById('app');

  panel.hidden = true;
  app.append(panel);
  buildDrawer(app);

  TITLES.forEach((t, ii) => {
    const A = ii * SEC;
    const p = el('path', { d: sectorPath(CX, CY, HUB, CROWN.o, A - HALF, A + HALF), fill: 'transparent', class: 'hit',
      role: 'button', tabindex: '0', 'aria-pressed': 'false',

    p.addEventListener('click', () => selectTitle(selected === ii ? null : ii));
    p.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); selectTitle(selected === ii ? null : ii); }
      if (e.key === 'Escape') selectTitle(null);

    p.addEventListener('focus', () => HILITE[ii].ring.setAttribute('opacity', 1));
    p.addEventListener('blur', () => paintSelection());
    HITS.push(p);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && selected !== null) selectTitle(null); });
  if (Q.get('title')) selectTitle(Q.get('title'));

  /* tell the parent how tall the content is (not the frame), so the post can size the iframe to fit */
  const postHeight = () => toParent({ type: 'viz-height', height: Math.ceil(app.getBoundingClientRect().bottom + window.scrollY) });

/* ---------------------------------------------------------------- audit
   Glyph-ink boxes (cap height + descenders), in artboard pixels. Reports:
   under     — any text rendering below 14px normalised to 1080 wide
   overlaps  — two text inks touching
   crossings — a visible stroke (line, circle, rect edge, path) through a text,
               ignoring strokes painted underneath the opaque disc the text sits on
   arcs      — a curved crown name longer than its path (glyphs would be dropped)
   outside   — text leaving the canvas                                        */
function effOpacity(e) {
  let o = 1;
  for (let n = e; n && n !== svg.parentNode; n = n.parentNode) {
    if (n.getAttribute) {
      const a = n.getAttribute('opacity'); if (a !== null) o *= parseFloat(a);
      if (n.getAttribute('visibility') === 'hidden') return 0;
    }
  }
  return o;
}
function rootBox(e, box) {
  const m = e.getCTM();
  const P = (x, y) => [m.a * x + m.c * y + m.e, m.b * x + m.d * y + m.f];
  const c = [P(box.x, box.y), P(box.x + box.w, box.y), P(box.x, box.y + box.h), P(box.x + box.w, box.y + box.h)];
  const xs = c.map(p => p[0]), ys = c.map(p => p[1]);
  return { x: Math.min(...xs), y: Math.min(...ys), w: Math.max(...xs) - Math.min(...xs), h: Math.max(...ys) - Math.min(...ys) };
}
function inkBox(t) {
  const bb = t.getBBox(), size = parseFloat(t.getAttribute('font-size')), y = parseFloat(t.getAttribute('y'));
  const s = t.textContent || '';
  const desc = /[gjpqy,;()\[\]{}Q$]/.test(s) ? 0.22 : 0.03;
  return rootBox(t, { x: bb.x, y: y - 0.75 * size, w: bb.width, h: (0.75 + desc) * size });
}
function segHitsBox(x0, y0, x1, y1, b) {
  let t0 = 0, t1 = 1; const dx = x1 - x0, dy = y1 - y0;
  const clip = (p, q) => { if (p === 0) return q >= 0; const r = q / p; if (p < 0) { if (r > t1) return false; if (r > t0) t0 = r; } else { if (r < t0) return false; if (r < t1) t1 = r; } return true; };
  return clip(-dx, x0 - b.x) && clip(dx, b.x + b.w - x0) && clip(-dy, y0 - b.y) && clip(dy, b.y + b.h - y0) && t0 <= t1;
}
function audit() {
  const scale = 1080 / W, under = [], boxes = [], arcs = [], outside = [];
  for (const t of svg.querySelectorAll('text')) {
    if (effOpacity(t) < 0.05) continue;
    const s = (t.textContent || '').trim();
    if (!s) continue;
    const m = t.getCTM(), k = Math.sqrt(m.a * m.a + m.b * m.b);
    const size = parseFloat(getComputedStyle(t).fontSize) * k * scale;
    if (size < 13.95) under.push({ text: s.slice(0, 60), size: Math.round(size * 100) / 100 });
    if (t.querySelector('textPath')) {
      const p = document.getElementById(t.getAttribute('data-arc'));
      const len = t.getComputedTextLength(), pl = p.getTotalLength();
      arcs.push({ text: s, fill: Math.round(len / pl * 1000) / 1000, over: len > pl * 0.985 });
      continue;
    }
    const b = inkBox(t);
    boxes.push({ t, text: s.slice(0, 40), ...b, cover: t.getAttribute('data-cover') });
    if (b.x < -0.5 || b.y < -0.5 || b.x + b.w > W + 0.5 || b.y + b.h > H + 0.5) outside.push(s.slice(0, 40));
  }
  const overlaps = [];
  for (let i = 0; i < boxes.length; i++) for (let j = i + 1; j < boxes.length; j++) {
    const a = boxes[i], b = boxes[j];
    const ox = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x), oy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
    if (ox > 0.5 && oy > 0.5) overlaps.push({ a: a.text, b: b.text, ox: Math.round(ox), oy: Math.round(oy) });
  }
  /* visible strokes (and the edges of solid chrome blocks) */
  const prims = [];
  for (const e of svg.querySelectorAll('line, circle, rect, path')) {
    if (e.closest('defs')) continue;
    const cs = getComputedStyle(e);
    const stroked = cs.stroke && cs.stroke !== 'none' && parseFloat(cs.strokeWidth) > 0 && parseFloat(cs.strokeOpacity) * effOpacity(e) > 0.1;
    const edged = e.getAttribute('data-edge') === '1' && effOpacity(e) > 0.1;
    if (!stroked && !edged) continue;
    if (e.tagName === 'path' && (e.getAttribute('d') || 'M0 0') === 'M0 0') continue;
    if (e.classList.contains('hit')) continue;
    prims.push({ e, sw: stroked ? parseFloat(cs.strokeWidth) : 0 });
  }
  const crossings = [];
  const boxHit = (b, p) => {
    const e = p.e, pad = p.sw / 2, bb = { x: b.x - pad, y: b.y - pad, w: b.w + 2 * pad, h: b.h + 2 * pad };
    const g0 = e.getBBox(), r = rootBox(e, { x: g0.x, y: g0.y, w: g0.width, h: g0.height });
    if (r.x > bb.x + bb.w || r.x + r.w < bb.x || r.y > bb.y + bb.h || r.y + r.h < bb.y) return false;
    const m = e.getCTM(), P = (x, y) => [m.a * x + m.c * y + m.e, m.b * x + m.d * y + m.f];
    const tag = e.tagName;
    if (tag === 'line') {
      const [x0, y0] = P(+e.getAttribute('x1'), +e.getAttribute('y1')), [x1, y1] = P(+e.getAttribute('x2'), +e.getAttribute('y2'));
      return segHitsBox(x0, y0, x1, y1, bb);
    }
    if (tag === 'circle') {
      const [cx, cy] = P(+e.getAttribute('cx') || 0, +e.getAttribute('cy') || 0), rad = (+e.getAttribute('r')) * Math.sqrt(m.a * m.a + m.b * m.b);
      const nx = clamp(cx, bb.x, bb.x + bb.w), ny = clamp(cy, bb.y, bb.y + bb.h), dmin = Math.hypot(nx - cx, ny - cy);
      const dmax = Math.max(...[[bb.x, bb.y], [bb.x + bb.w, bb.y], [bb.x, bb.y + bb.h], [bb.x + bb.w, bb.y + bb.h]].map(([x, y]) => Math.hypot(x - cx, y - cy)));
      return dmin < rad && rad < dmax;
    }
    if (tag === 'rect') {
      const x = +e.getAttribute('x') || 0, y = +e.getAttribute('y') || 0, w = +e.getAttribute('width'), hh = +e.getAttribute('height');
      const c = [P(x, y), P(x + w, y), P(x + w, y + hh), P(x, y + hh)];
      return [0, 1, 2, 3].some(i => segHitsBox(c[i][0], c[i][1], c[(i + 1) % 4][0], c[(i + 1) % 4][1], bb));
    }
    const L = e.getTotalLength(), step = Math.max(0.75, L / 1500);
    for (let s = 0; s <= L; s += step) {
      const q = e.getPointAtLength(s), [x, y] = P(q.x, q.y);
      if (x >= bb.x && x <= bb.x + bb.w && y >= bb.y && y <= bb.y + bb.h) return true;
    }
    return false;
  };
  for (const b of boxes) {
    const coverEl = b.cover ? document.getElementById(b.cover) : null;
    for (const p of prims) {
      if (coverEl && p.e !== coverEl && (p.e.compareDocumentPosition(coverEl) & Node.DOCUMENT_POSITION_FOLLOWING)) continue;
      const bb = { x: b.x + 0.4, y: b.y + 0.4, w: b.w - 0.8, h: b.h - 0.8 };
      if (boxHit(bb, p)) crossings.push({ text: b.text, by: p.e.tagName + (p.e.id ? '#' + p.e.id : '') });
    }
  }
  const arcOverflow = arcs.filter(a => a.over);
  return { size: [W, H], minRequired: 14, under, overlaps, crossings, arcOverflow, outside, textCount: boxes.length, arcCount: arcs.length,
    arcFill: arcs.map(a => `${a.text} ${a.fill}`) };
}

window.VIZ = {
  ready: Promise.resolve(true), duration: DUR, settled: T.settled, size: [W, H], beat: BEAT,
  seek: s => { stopAnim(); render(+s); },
  seekMs: v => { stopAnim(); render(+v / 1000); },
  play: playOnce, stop: stopAnim,
  framePlan, audit, selectTitle,
  get selected() { return selected === null ? null : TITLES[selected].slug; },
  titles: TITLES.map(t => t.slug),
};
document.documentElement.dataset.ready = '1';
})();
