/* ============================================================================
   THE JOURNEY MAP — a searcher's path across five intent territories.
   Self-contained: no network requests, macOS system fonts only.

   URL params
     ?size=1080x1350 | 1080x1080 | 2160x2700 | 640x800 | portrait | square   (default portrait)
     ?poster=1   freeze at the settled frame (also hides the "click a territory" prompt)
     ?gif=1      static clock, exporter drives it (also hides the prompt)
     ?static=1   no rAF; only window.VIZ.seek() moves the clock
     ?t=2.4      seek to a time in seconds
     ?parent=<post url>   same-origin base URL for each territory's fallback
                 link (published copy: else the post on this origin)

   Export hook
     window.VIZ = { ready, duration, seek(t), frame(), selectIntent(slug) }
     selectIntent highlights a territory and posts {type:'viz-intent', intent:slug}
     to window.parent when embedded in an iframe. slug is one of: informational,
     commercial, transactional, navigational, local.
     document.documentElement.dataset.ready === '1' once the first paint is done.

   Reduced motion
     prefers-reduced-motion: reduce skips straight to the settled frame; the
     live page otherwise plays one slowed draw on load, then holds (no loop).

   Every figure is lifted verbatim from
     the search-intent research ledger (data.json)
   with the stat index noted in a comment. Nothing is derived or invented.
   ========================================================================= */

const SQ = FMT === 'square';

/* ------------------------------------------------------------------ layout */
const M = SQ ? {

/* ------------------------------------------------------------- svg helpers */
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('viz');
svg.setAttribute('viewBox', `0 0 ${M.W} ${M.H}`);
svg.setAttribute('width', SIZE.w);
svg.setAttribute('height', SIZE.h);
svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
const stage = document.getElementById('stage');
if (INTERACTIVE) {
  /* Published copy: the live page scales to its frame (the post column is narrower than 1080 px);
     poster and GIF exports keep the fixed canvas below. Text is fitted in SVG user units, so
     scaling does not change the layout. */
  stage.style.maxWidth = SIZE.w + 'px';
  stage.style.margin = '0 auto';
  svg.style.width = '100%';
  svg.style.height = 'auto';
  svg.style.aspectRatio = `${SIZE.w} / ${SIZE.h}`;
} else {
  stage.style.width = SIZE.w + 'px';
  stage.style.height = SIZE.h + 'px';
}

function el(tag, attrs = {}, parent = null) {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) if (v !== null && v !== undefined) n.setAttribute(k, v);
  if (parent) parent.appendChild(n);
  return n;
}
const G = (parent, attrs = {}) => el('g', attrs, parent);

const hidden = el('g', { visibility: 'hidden' }, svg);
const probe = el('text', {}, hidden);
function measure(str, s) {
  probe.setAttribute('font-family', s.family || BODY);
  probe.setAttribute('font-size', s.size);
  probe.setAttribute('font-weight', s.weight || 400);
  probe.setAttribute('letter-spacing', s.spacing || 0);
  probe.textContent = str;
  return probe.getComputedTextLength();
}
function wrap(str, maxW, s) {
  const words = String(str).split(/\s+/);
  const out = []; let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (cur && measure(t, s) > maxW) { out.push(cur); cur = w; } else cur = t;
  }
  if (cur) out.push(cur);
  return out;
}
/* Two-line text with an orphaned last word re-wraps at a narrower measure so
   the two lines come out roughly even. */
function wrapBalanced(str, maxW, s) {
  const lines = wrap(str, maxW, s);
  if (lines.length !== 2 || measure(lines[1], s) >= maxW * 0.32) return lines;
  for (const f of [0.74, 0.68, 0.62, 0.56]) {
    const alt = wrap(str, maxW * f, s);
    if (alt.length === 2 && measure(alt[1], s) >= maxW * 0.36) return alt;
  }
  return lines;
}
function fit(str, maxW, s, min = 10) {
  let n = s.size;
  while (n > min && measure(str, { ...s, size: n }) > maxW) n -= 0.5;
  return n;
}
/* One text line. `box` = the rect it may occupy; the exporter asserts the
   rendered bbox stays inside it and that no two boxes' glyphs collide. */
function line(parent, str, x, y, s, box) {
  const t = el('text', {
    x, y,
    'font-family': s.family || BODY,
    'font-size': s.size,
    'font-weight': s.weight || 400,
    'letter-spacing': s.spacing || 0,
    fill: s.fill || C.ink,
    'text-anchor': s.anchor || 'start',
  }, parent);
  t.textContent = str;
  if (box) t.setAttribute('data-box', box.map(v => Math.round(v)).join(','));
  return t;
}

/* ------------------------------------------------------------------- icons */
function icon(parent, kind, cx, cy, r, color) {
  const g = G(parent, {});
  const s = r / 12;
  const P = d => el('path', { d, fill: color }, g);
  const R = (x, y, w, h, rx) => el('rect', { x, y, width: w, height: h, rx, fill: color }, g);
  switch (kind) {
    case 'book':
      R(cx - 11 * s, cy - 8 * s, 9.6 * s, 15 * s, 1.4 * s);
      R(cx + 1.4 * s, cy - 8 * s, 9.6 * s, 15 * s, 1.4 * s);
      R(cx - 0.9 * s, cy - 9.6 * s, 1.8 * s, 18 * s, 0.9 * s);
      break;
    case 'arrow':
      P(`M${cx + 10 * s} ${cy - 10 * s} L${cx - 10 * s} ${cy + 10 * s} L${cx - 1 * s} ${cy + 1 * s} Z`);
      P(`M${cx + 10 * s} ${cy - 10 * s} L${cx + 2 * s} ${cy + 9 * s} L${cx - 9 * s} ${cy - 2 * s} Z`);
      break;
    case 'versus':
      el('circle', { cx: cx - 6 * s, cy: cy - 4 * s, r: 5 * s, fill: color }, g);
      el('circle', { cx: cx + 6 * s, cy: cy + 2 * s, r: 5 * s, fill: color }, g);
      R(cx - 11 * s, cy + 8 * s, 22 * s, 2.8 * s, 1.4 * s);
      break;
    case 'cart':
      R(cx - 10 * s, cy - 7 * s, 20 * s, 10 * s, 1.8 * s);
      R(cx - 13 * s, cy - 10.6 * s, 6.5 * s, 2.8 * s, 1.4 * s);
      el('circle', { cx: cx - 5 * s, cy: cy + 8 * s, r: 2.8 * s, fill: color }, g);
      el('circle', { cx: cx + 5 * s, cy: cy + 8 * s, r: 2.8 * s, fill: color }, g);
      break;
    case 'pin':
      P(`M${cx} ${cy + 11 * s} C${cx - 9 * s} ${cy + 1 * s} ${cx - 9 * s} ${cy - 10 * s} ${cx} ${cy - 10 * s} C${cx + 9 * s} ${cy - 10 * s} ${cx + 9 * s} ${cy + 1 * s} ${cx} ${cy + 11 * s} Z`);
      el('circle', { cx, cy: cy - 3 * s, r: 3.2 * s, fill: C.cream }, g);
      break;
    case 'flagpin':
      R(cx - 1.4 * s, cy - 11 * s, 2.8 * s, 22 * s, 1.2 * s);
      P(`M${cx + 1.4 * s} ${cy - 11 * s} L${cx + 12 * s} ${cy - 6.2 * s} L${cx + 1.4 * s} ${cy - 1.4 * s} Z`);
      break;
    case 'glass':
      el('circle', { cx: cx - 1.6 * s, cy: cy - 1.6 * s, r: 7.2 * s, fill: 'none', stroke: color, 'stroke-width': 3 * s }, g);
      el('rect', {
        x: cx + 2.6 * s, y: cy + 2.6 * s, width: 3 * s, height: 10 * s, rx: 1.5 * s, fill: color,
        transform: `rotate(-45 ${cx + 4.1 * s} ${cy + 4.1 * s})`,
      }, g);
      break;
    case 'sparkle':
      P(`M${cx} ${cy - 12 * s} Q${cx + 2.2 * s} ${cy - 2.2 * s} ${cx + 12 * s} ${cy} Q${cx + 2.2 * s} ${cy + 2.2 * s} ${cx} ${cy + 12 * s} Q${cx - 2.2 * s} ${cy + 2.2 * s} ${cx - 12 * s} ${cy} Q${cx - 2.2 * s} ${cy - 2.2 * s} ${cx} ${cy - 12 * s} Z`);
      break;
    case 'tag':
      P(`M${cx - 11 * s} ${cy - 7.5 * s} H${cx + 3 * s} L${cx + 11 * s} ${cy} L${cx + 3 * s} ${cy + 7.5 * s} H${cx - 11 * s} Z`);
      break;
    case 'links':
      [22, 17, 12].forEach((w, i) => R(cx - 11 * s, cy - 9 * s + i * 7.4 * s, w * s, 4.2 * s, 2.1 * s));
      break;
    case 'paa':
      for (let i = 0; i < 3; i++) {
        el('rect', {
          x: cx - 11 * s, y: cy - 10 * s + i * 7.4 * s, width: 22 * s, height: 5 * s, rx: 2.5 * s,
          fill: color, opacity: (1 - i * 0.24).toFixed(2),
        }, g);
      }
      break;
    case 'terra':
      el('circle', { cx, cy, r: 9.6 * s, fill: 'none', stroke: color, 'stroke-width': 2.8 * s, 'stroke-dasharray': `${4 * s} ${3.6 * s}` }, g);
      R(cx - 5.4 * s, cy - 1.6 * s, 10.8 * s, 3.2 * s, 1.6 * s);
      break;
  }
  return g;
}

/* ----------------------------------------------------- mandala compass rose */
function mandala(parent, cx, cy, r) {
  const g = G(parent, {});
  el('circle', { cx, cy, r, fill: C.ink }, g);
  el('circle', { cx, cy, r: r * 0.94, fill: C.flag }, g);
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2 - Math.PI / 2;
    const a1 = a - Math.PI / 30, a2 = a + Math.PI / 30;
    const R1 = r * 0.9, r0 = r * 0.4;
    const pt = (ang, rad) => `${(cx + Math.cos(ang) * rad).toFixed(1)} ${(cy + Math.sin(ang) * rad).toFixed(1)}`;
    el('path', {
      d: `M${pt(a1, r0)} L${pt(a, R1)} L${pt(a2, r0)} Z`,
      fill: i % 2 ? C.gold : C.cream,
      opacity: i % 2 ? 1 : 0.9,
    }, g);
  }
  el('circle', { cx, cy, r: r * 0.44, fill: TC.informational.deep }, g);
  el('circle', { cx, cy, r: r * 0.3, fill: C.gold }, g);
  el('circle', { cx, cy, r: r * 0.15, fill: C.ink }, g);
  return g;
}

/* ---------------------------------------------------------- road geometry */
function roundedPolyline(pts, radius) {
  let d = '';
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    if (i === 0) { d += `M${p[0]} ${p[1]}`; continue; }
    if (i === pts.length - 1) { d += ` L${p[0]} ${p[1]}`; continue; }
    const prev = pts[i - 1], next = pts[i + 1];
    const v1 = [p[0] - prev[0], p[1] - prev[1]], v2 = [next[0] - p[0], next[1] - p[1]];
    const l1 = Math.hypot(v1[0], v1[1]), l2 = Math.hypot(v2[0], v2[1]);
    const r = Math.min(radius, l1 / 2, l2 / 2);
    const a = [p[0] - (v1[0] / l1) * r, p[1] - (v1[1] / l1) * r];
    const b = [p[0] + (v2[0] / l2) * r, p[1] + (v2[1] / l2) * r];
    d += ` L${a[0].toFixed(1)} ${a[1].toFixed(1)} Q${p[0]} ${p[1]} ${b[0].toFixed(1)} ${b[1].toFixed(1)}`;
  }
  return d;
}

/* ============================================================ build the map */
const L = {
  ground: G(svg), terrain: G(svg), ghost: G(svg), road: G(svg),
  cards: G(svg), marks: G(svg), chrome: G(svg), fx: G(svg),

el('rect', { x: 0, y: 0, width: M.W, height: M.H, fill: C.cream }, L.ground);

/* posterised terrain: flat blobs, contour rings, hatch ticks — deterministic */
(function terrain() {
  let seed = 20260915;
  const rnd = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
  const top = M.title + 8, bot = M.legend.capY - 24;
  for (let i = 0; i < 24; i++) {
    const cx = 16 + rnd() * (M.W - 32), cy = top + rnd() * (bot - top), rr = 28 + rnd() * 64;
    el('ellipse', {
      cx: cx.toFixed(1), cy: cy.toFixed(1), rx: rr.toFixed(1), ry: (rr * (0.48 + rnd() * 0.42)).toFixed(1),
      fill: rnd() > 0.5 ? C.paper : C.paper2,
    }, L.terrain);
  }
  for (let i = 0; i < 13; i++) {

/* ------------------------------------------------------- click / jump target

   plain top-level link — whichever the host actually handles. */
function parentUrl() {
  /* Published copy (mj2.pro): the fallback link targets the embedding post itself when it is
     same-origin (a same-document jump, query string kept), then a same-origin ?parent=, else the
     post on this origin. Cross-origin values are ignored so the link cannot be pointed off-site. */
  try {
    const p = window.parent;
    if (p && p !== window && p.location.origin === location.origin) return p.location.origin + p.location.pathname + p.location.search;
  } catch (e) {}
  try {
    const raw = Q.get('parent');
    if (raw) { const u = new URL(raw, location.href); if (u.origin === location.origin) return u.origin + u.pathname + u.search; }
  } catch (e) {}
  return new URL('/blog/search-results-by-intent/', location.href).href;
}

/* ------------------------------------------------------------------- roads
   A straight serpentine: every row reads left-to-right in both the grid and
   the route (1→2, 3→4, 5→end), matching plain reading order. A short dogleg
   jog — down, across, down — carries the trail back to the left margin
   between rows instead of doubling the row itself back on itself. Cards draw
   after the road (see L above), so the sliver of each jog that passes behind
   a card's top edge is simply hidden under it. */
const JOG = 20;
const ROUTE = [
  [M.chanL, M.startY + M.startH / 2],
  [M.chanL, M.gut[0]],
  [M.chanR, M.gut[0]],
  [M.chanR, M.gut[0] + JOG],
  [M.chanL, M.gut[0] + JOG],
  [M.chanL, M.gut[1]],
  [M.chanR, M.gut[1]],
  [M.chanR, M.gut[1] + JOG],
  [M.chanL, M.gut[1] + JOG],
  [M.chanL, M.bottomY],
  [M.colR + M.colW / 2, M.bottomY],
  [M.colR + M.colW / 2, M.rows[2] + M.rowH + 6],
];
const ROUTE_BASE = roundedPolyline(ROUTE, 26);

/* Give the trail a gentle meander so it reads as a road, not a border.
   The wobble tapers to nothing at the corners and the two ends. */
const ROUTE_D = (function meander(d, amp = 9, wavelength = 165) {
  const tmp = el('path', { d }, hidden);
  const total = tmp.getTotalLength();
  const nearest = (px, py) => {
    let best = 0, bd = Infinity;
    for (let i = 0; i <= 600; i++) {
      const l = (i / 600) * total, q = tmp.getPointAtLength(l);
      const dd = (q.x - px) ** 2 + (q.y - py) ** 2;
      if (dd < bd) { bd = dd; best = l; }
    }
    return best;
  };
  const corners = ROUTE.slice(1, -1).map(pt => nearest(pt[0], pt[1]));
  const N = Math.max(240, Math.round(total / 4));
  const out = [];
  for (let i = 0; i <= N; i++) {
    const sL = (i / N) * total;
    const p = tmp.getPointAtLength(sL);
    const p0 = tmp.getPointAtLength(Math.max(0, sL - 2));
    const p1 = tmp.getPointAtLength(Math.min(total, sL + 2));
    const tx = p1.x - p0.x, ty = p1.y - p0.y, tl = Math.hypot(tx, ty) || 1;
    let a = amp * Math.min(1, sL / 70) * Math.min(1, (total - sL) / 70);
    for (const c of corners) { const dd = Math.abs(sL - c); if (dd < 48) a *= dd / 48; }
    const off = a * Math.sin((sL / wavelength) * Math.PI * 2);
    out.push([(p.x - (ty / tl) * off).toFixed(1), (p.y + (tx / tl) * off).toFixed(1)]);
  }
  tmp.remove();
  return 'M' + out.map(q => `${q[0]} ${q[1]}`).join(' L');
})(ROUTE_BASE);

})();

/* =========================================================== the animation
   The trail draws roughly 2x slower than a plain sweep and holds for a beat
   as it crosses into each territory: a piecewise schedule of eased MOVE
   segments and flat HOLD segments, built from the milestones' real positions
   along the finished road (MILE, already in ascending-L / ascending-number
   order by construction) so it stays correct regardless of route geometry. */
const PAUSE = 0.7;                                       // held at each territory's entry
const T = { start: 0.12, drawSpan: (3.35 - 0.12) * 2, destRoll: 0.62, tail: 0.28 };  // drawSpan: ~2x the v1 draw time
const easeInOut = u => (u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2);
const easeOut = u => 1 - Math.pow(1 - u, 3);
const clamp01 = v => Math.max(0, Math.min(1, v));

const MILE_ORDER = MILE.slice().sort((a, b) => a.L - b.L);
const SEGS = [];
(function buildSchedule() {
  let t = T.start, frac = 0;
  for (const m of MILE_ORDER) {
    const f = m.L / ROAD_LEN;
    const dur = (f - frac) * T.drawSpan;
    SEGS.push({ t0: t, t1: t + dur, f0: frac, f1: f, hold: false });
    t += dur;
    m.t = t;                        // the trail visibly reaches this territory here
    SEGS.push({ t0: t, t1: t + PAUSE, f0: f, f1: f, hold: true });
    t += PAUSE;
    frac = f;
  }
  const dur = (1 - frac) * T.drawSpan;
  SEGS.push({ t0: t, t1: t + dur, f0: frac, f1: 1, hold: false });
  T.roadEnd = t + dur;
})();
const DURATION = T.roadEnd + T.destRoll + T.tail;

function roadFrac(t) {
  if (t <= T.start) return 0;
  if (t >= T.roadEnd) return 1;
  for (const s of SEGS) {
    if (t > s.t1) continue;
    if (s.hold) return s.f1;
    const u = s.t1 > s.t0 ? (t - s.t0) / (s.t1 - s.t0) : 1;
    return s.f0 + (s.f1 - s.f0) * easeInOut(clamp01(u));
  }
  return 1;
}

rollers.forEach(r => {
  const m = MILE.find(x => x.key === r.key);
  r.t0 = m ? m.t : 0;
  r.t1 = r.t0 + 0.40;
});
const mileNodes = MILE.map(m => ({
  m,
  pip: L.marks.querySelector(`[data-mile="${m.n}"]`),
  disc: L.marks.querySelector(`[data-disc="${m.n}"]`),
}));

function render(t) {
  t = Math.max(0, Math.min(DURATION, t));
  const shown = roadFrac(t) * ROAD_LEN;
  revealPath.setAttribute('stroke-dasharray', `${shown.toFixed(1)} ${(ROAD_LEN + 20).toFixed(1)}`);

  const p = roadBase.getPointAtLength(Math.max(0.01, shown));
  travel.setAttribute('opacity', (t < 0.05 || shown >= ROAD_LEN) ? 0 : 1);
  travelDot.setAttribute('cx', p.x.toFixed(1)); travelDot.setAttribute('cy', p.y.toFixed(1));
  travelRing.setAttribute('cx', p.x.toFixed(1)); travelRing.setAttribute('cy', p.y.toFixed(1));
  travelRing.setAttribute('r', (14 + 4.5 * Math.sin(t * 9)).toFixed(1));

  for (const { m, pip, disc } of mileNodes) {
    const since = t - m.t, on = since >= 0;
    const k = on ? Math.min(1, since / 0.28) : 0;
    const s = on ? 1 + 0.6 * (1 - easeOut(k)) : 0.001;
    pip.setAttribute('transform', `translate(${m.x} ${m.y}) scale(${s.toFixed(3)}) translate(${-m.x} ${-m.y})`);
    pip.setAttribute('opacity', on ? 1 : 0);
    const b = cardBoxes[m.n];
    const cx = b.x + 32, cy = b.y + M.card.headH / 2;
    const ds = on ? 1 + 0.3 * (1 - easeOut(Math.min(1, since / 0.36))) : 1;
    disc.setAttribute('transform', `translate(${cx} ${cy}) scale(${ds.toFixed(3)}) translate(${-cx} ${-cy})`);
  }

  /* A figure only exists once the trail has reached its territory — an
     un-rolled counter must never read as a measured zero. */
  for (const r of rollers) {
    const k = clamp01((t - r.t0) / (r.t1 - r.t0));
    r.node.setAttribute('opacity', t < r.t0 ? 0 : 1);
    r.node.textContent = (r.to * easeOut(k)).toFixed(r.dec) + '%';
  }
  const dk = clamp01((t - T.roadEnd) / T.destRoll);
  destRoller.node.setAttribute('opacity', t < T.roadEnd ? 0 : 1);
  destRoller.node.textContent = (destRoller.to * easeOut(dk)).toFixed(destRoller.dec) + '%';
}

/* ------------------------------------------------------------- clock / API
   Live page: one slowed draw, then it holds on the settled frame — it does
   not auto-loop. Reduced-motion skips straight to the settled frame. */
const REDUCED_MOTION = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
/* WCAG 2.2.2 (site standards, 2026-09-24): the intro runs longer than five seconds, so a visible
   button stops it on the settled frame. It exists only while the intro plays. */
function skipButton(onSkip) {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = 'Skip animation';
  b.style.cssText = 'position:fixed;top:10px;right:10px;z-index:20;min-height:44px;padding:10px 16px;border:1px solid #0f2440;border-radius:8px;background:#ffffff;color:#0f2440;font:600 14px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer';
  b.addEventListener('click', () => { onSkip(); b.remove(); });
  document.body.append(b);
  return b;
}
let clock = 0, raf = null, t0 = null, skip = null;
const dropSkip = () => { if (skip) { skip.remove(); skip = null; } };
function loop(ts) {
  if (t0 === null) t0 = ts;
  clock = (ts - t0) / 1000;
  if (clock >= DURATION) { clock = DURATION; render(DURATION); raf = null; dropSkip(); return; }
  render(clock);
  raf = requestAnimationFrame(loop);
}

const initialT = Q.has('poster') ? DURATION
  : Q.has('t') ? (parseFloat(Q.get('t')) || 0)
  : REDUCED_MOTION ? DURATION
  : 0;
render(initialT);
clock = initialT;
if (!STATIC && !Q.has('t') && !REDUCED_MOTION) {
  raf = requestAnimationFrame(loop);
  skip = skipButton(() => { if (raf) { cancelAnimationFrame(raf); raf = null; } clock = DURATION; render(DURATION); skip = null; });
}

window.VIZ = {
  ready: Promise.resolve(true),
  duration: DURATION,
  format: FMT,
  size: SIZE,
  seek(t) { if (raf) { cancelAnimationFrame(raf); raf = null; } dropSkip(); render(t); return t; },
  frame() { return clock; },
  selectIntent,
};
document.documentElement.dataset.ready = '1';
</script>
</body>
