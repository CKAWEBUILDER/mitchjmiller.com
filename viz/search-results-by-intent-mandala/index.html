<script>
(function () {
/* ============================================================================
   THE DATA MANDALA v2 — search intent x the AI SERP
   Self-contained: no network, no webfonts, no build step.

   POSTER MODE  ?size=1080x1350 | 1080x1080 | 2160x2700 | 640x800   ?t=<s>  ?static=1
   LIVE MODE    (no ?t / ?static / ?poster)  — assembles once, sectors are buttons
                ?parent=<blog url>   used for the "read the section" fallback link

   window.VIZ.seek(s) / .seekMs(ms) / .duration / .settled / .ready
   window.VIZ.selectIntent(slug) / .framePlan(fps,{wipe}) / .audit()
   ========================================================================== */

/* ---------------------------------------------------------------- palette */
const PAPER      = '#FFF6E9';
const PAPER_DEEP = '#FDEBD3';
const INK        = '#14100B';
const INK_SOFT   = '#5B5147';
const HOT        = '#FFE600';
const NM         = '#9A8F81';   // "not measured"

/* ---------------------------------------------------------------- content */
const INTENTS = [
  {
    slug: 'informational', name: 'INFORMATIONAL', hue: '#00C2FF', icon: 'ask',
    ex: '“how to tie a tie”',
    lede: 'Google answers it above the links.',

            src: 'Seer Interactive · 5.47M queries · Apr 2026' }],

  },
  {

    lede: 'Comparisons get summarised before you click.',
    dom: [{ what: 'AI Overview on “X vs Y” queries', rate: '95.4%', tail: '267 of 280 comparison queries',
            src: 'Seer Interactive · 267 of 280 comparison queries · Apr 2026' }],
    queries: ['AEO agency vs in-house team',

  },

    lede: 'The AI stays out — the ads do not.',
    dom: [{ what: 'AI Overview', rate: '5%', tail: 'the lowest trigger rate in the study',
            src: 'Seer Interactive · 5.47M queries · Apr 2026' },
          { what: 'Paid click share, US headphones', rate: '36%', tail: 'up from 16% a year earlier',
            src: 'Search Engine Land / Similarweb, analysis by Aleyda Solis · Jan 2026' }],
    queries: ['hire an AEO consultant',
              'SEO consulting retainer pricing',
              'book a growth systems audit'],
  },
  {
    slug: 'navigational', name: 'NAVIGATIONAL', hue: '#C6FF00', icon: 'goto',
    ex: '“chase bank login”',
    lede: 'Still a link — but the AI is moving in.',
    dom: [{ what: 'AI Overview', rate: '0% → 10.33%', tail: '0 of 10,000 keywords in Dec 2024; 10.33% of AI Overview queries by Oct 2025',
            src: 'Authoritas 10K kw Jan 2025 · Semrush 10M kw Feb 2026' }],

    dom: [{ what: 'Local Pack', rate: '93%', tail: 'of local-intent searches still show one',
            src: 'Whitespark · 540 queries, 3 US metros · May 2025' }],

              'surf school near me honolulu',
              'beginner surf lesson oahu'],
  },
];

/* rings, inner -> outer; cells indexed [ring][intent] */
const RINGS = [
  { mark: '1', glyph: 'spark', title: 'DOES AN AI ANSWER APPEAR?', sub: 'trigger rate · 0–36% · mixed panels', tint: 0.13, bar: true, max: 36 },
  { mark: '2', glyph: 'click', title: 'WHO TAKES THE CLICK?',      sub: 'click share · organic CTR',           tint: 0.36 },
  { mark: '3', glyph: 'delta', title: 'WHAT MOVED IN A YEAR',      sub: 'Oct 2024 → Apr 2026',                tint: 0.52 },
];

/* val = medallion face.  cap = rail caption (wide).  capShort = rail caption (tight). */
const CELLS = [
  [ /* (1)  AI Overview trigger rate */
    { v: 36, val: '36%', cap: '85.9% on “what / how / why”',        capShort: '85.9% on “what/how/why”' },
    { v: 8,  val: '8%',  cap: 'but 95.4% on “X vs Y” queries',      capShort: '95.4% on “X vs Y”' },
    { v: 5,  val: '5%',  cap: 'lowest rate in the Seer study',      capShort: 'lowest rate measured' },
    { v: 0,  val: '0%',  cap: '0 of 10,000 keywords, Dec 2024',     capShort: '0 of 10,000 kw, Dec 2024' },
    { v: 15, val: '15%', cap: 'vs 92% informational, same study',   capShort: 'vs 92% informational' },
  ],
  [ /* (2)  who takes the click */
    { val: '0.94%', cap: 'organic CTR when the AI cites someone else', capShort: 'AI cites someone else' },
    { val: '36%',   cap: 'paid click share, US headphones — was 16%', capShort: 'paid share — was 16%' },
    { val: '2.15%', cap: 'organic CTR under an AI Overview — down 48%', capShort: 'under an AI Overview' },
    { val: 'not measured', nm: true, cap: 'no intent-segmented CTR study in this ledger', capShort: 'no intent-segmented study' },
    { val: '93%',   cap: 'of local-intent searches still show a Local Pack', capShort: 'still show a Local Pack' },
  ],
  [ /* (3)  what moved */
    { val: '−34pt', cap: 'share of AI Overview queries: 91.3% → 57.1%', capShort: 'AIO mix: 91.3 → 57.1%' },
    { val: '+71%',  cap: 'more commercial SERPs carry one, 6 months', capShort: 'commercial SERPs, 6 mo' },
    { val: '−5%',   cap: 'AI Overview share fell over the same 6 months', capShort: 'fell, same 6-month window' },
    { val: '12×',   cap: 'share of AI Overview queries: 0.84% → 10.33%', capShort: 'AIO mix: 0.84 → 10.33%' },
    { val: 'not measured', nm: true, cap: 'one 2025 snapshot only — no trend series published', capShort: 'one snapshot, no trend' },
  ],
];

const SOURCES_A = 'Sources — Seer Interactive 5.47M queries Apr 2026 · Semrush 10M kw Feb 2026 + 600K kw Jul 2026';
const SOURCES_B = 'SparkToro × Similarweb Jan–Apr 2026 · Ahrefs 300K kw Feb 2026 · Whitespark 540 queries May 2025';
const SOURCES_C = 'Authoritas 10K kw Jan 2025 · NOT MEASURED = this ledger has no figure for that cell';
const HEAD_SRC  = 'SparkToro × Similarweb · Jan–Apr 2026 · US';

/* ---------------------------------------------------------------- icons (24x24) */
const ICON = {
  ask:   ['M8.3 9.0a3.7 3.7 0 1 1 3.7 3.8v2.0','M12 18.3h.01'],
  scale: ['M12 4.2v15.0','M6.2 7.4h11.6','M8.2 19.2h7.6','M6.2 7.4 3.2 13.4h6z','M17.8 7.4l-3 6h6z'],
  bag:   ['M6.6 8.2h10.8l1.0 11.2H5.6z','M9.1 8.2a2.9 2.9 0 0 1 5.8 0'],
  goto:  ['M3.6 12h11.2','M11.2 7.6 15.8 12l-4.6 4.4','M19.4 4.2v15.6'],
  pin:   ['M12 20.8s6.0-6.0 6.0-10.0A6.0 6.0 0 0 0 6 10.8c0 4.0 6 10.0 6 10.0z','M12 10.5h.01'],
  spark: ['M12 3.0 14.0 9.0 20.0 11.0 14.0 13.0 12 19.0 10.0 13.0 4.0 11.0 10.0 9.0z'],
  click: ['M6.0 4.2 18.4 11.4l-5.3 1.2-1.6 5.3z'],
  delta: ['M12 5.0 17.6 14.2H6.4z','M7.2 18.4h9.6'],
};
const ICON_FILLED = { spark: true, click: true };

/* ---------------------------------------------------------------- helpers */
const NS = 'http://www.w3.org/2000/svg';
const el = (n, a = {}, parent) => {
  const e = document.createElementNS(NS, n);
  for (const k in a) if (a[k] !== undefined && a[k] !== null) e.setAttribute(k, a[k]);
  if (parent) parent.appendChild(e);
  return e;
};
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutExpo = t => (t >= 1 ? 1 : 1 - Math.pow(2, -9 * t));
const easeOutBack = t => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const easeInOut = t => (t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const win = (t, a, b) => clamp((t - a) / (b - a), 0, 1);

const hex2rgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rgb2hex = c => '#' + c.map(v => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('');
const tint  = (hue, a, over = PAPER) => {
  const A = hex2rgb(hue), B = hex2rgb(over);
  return rgb2hex([0, 1, 2].map(i => lerp(B[i], A[i], a)));
};
const shade = (hue, a) => rgb2hex(hex2rgb(hue).map(v => v * (1 - a)));

/* angle: degrees clockwise from 12 o'clock */
const pt = (cx, cy, r, deg) => {
  const rad = (deg - 90) * Math.PI / 180;
  return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
};
const f = n => Math.round(n * 100) / 100;

function sectorPath(cx, cy, r0, r1, a0, a1) {
  if (a1 - a0 <= 0.0001) return 'M0 0';
  const big = (a1 - a0) > 180 ? 1 : 0;
  const [x0, y0] = pt(cx, cy, r1, a0), [x1, y1] = pt(cx, cy, r1, a1);
  const [x2, y2] = pt(cx, cy, r0, a1), [x3, y3] = pt(cx, cy, r0, a0);
  return `M${f(x0)} ${f(y0)}A${f(r1)} ${f(r1)} 0 ${big} 1 ${f(x1)} ${f(y1)}` +
         `L${f(x2)} ${f(y2)}A${f(r0)} ${f(r0)} 0 ${big} 0 ${f(x3)} ${f(y3)}Z`;
}
function arcPath(cx, cy, r, a0, a1, reversed) {
  const A = reversed ? a1 : a0, B = reversed ? a0 : a1;
  const [x0, y0] = pt(cx, cy, r, A), [x1, y1] = pt(cx, cy, r, B);
  const big = Math.abs(B - A) > 180 ? 1 : 0;
  return `M${f(x0)} ${f(y0)}A${f(r)} ${f(r)} 0 ${big} ${reversed ? 0 : 1} ${f(x1)} ${f(y1)}`;
}

/* ---------------------------------------------------------------- mode + size */
const Q = new URLSearchParams(location.search);
const parseSize = s => { const m = /^(\d{2,5})\s*[x×]\s*(\d{2,5})$/.exec((s || '').trim()); return m ? [+m[1], +m[2]] : null; };
const [W, H] = parseSize(Q.get('size')) || [1080, 1350];
const S  = W / 1080;
const px = n => n * S;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const tParam = Q.get('t');
const POSTER = Q.has('poster') || Q.has('static') || tParam !== null;
document.body.className = POSTER ? 'poster' : 'live';

/* every piece of type on the artboard is >= this */
const MIN_PX = px(14);

const stage = document.getElementById('stage');
const svg = document.getElementById('viz');
svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
svg.setAttribute('width', W); svg.setAttribute('height', H);
if (POSTER) { stage.style.width = W + 'px'; stage.style.height = H + 'px'; }
svg.setAttribute('role', 'group'); // a group, not an img: the sectors inside are buttons (axe nested-interactive)
svg.setAttribute('aria-label',
  'Data mandala: five search intents as sectors, three measured rings - AI Overview trigger rate, who takes the click, and what moved in a year.');

/* ---------------------------------------------------------------- layout */
const TALL  = H / W >= 1.15;         // 4:5 poster vs square
const RAIL  = TALL;                  // the reading rail only fits the 4:5 crops
const DENSE = W >= 860;              // room for two-line rail captions
const M      = Math.round(px(30));
const BAR_H  = Math.round(px(TALL ? 190 : 168));
const KEY_H  = Math.round(px(54));
const RAIL_ROW = Math.round(px(DENSE ? 52 : 38));
const RAIL_HEAD = Math.round(px(52));
const RAIL_H = RAIL ? Math.round(px(12)) + RAIL_HEAD + 3 * RAIL_ROW + Math.round(px(8)) : 0;
const FOOT_H = Math.round(px(RAIL ? 74 : 114));

const CX = W / 2;
const areaTop = BAR_H + KEY_H, areaBot = H - FOOT_H - RAIL_H;
const R  = Math.floor(Math.min((areaBot - areaTop) / 2, (W - 2 * M) / 2));
const CY = Math.round(areaTop + (areaBot - areaTop) / 2);

const rr = k => R * k;
const HUB = rr(0.255), BD = rr(0.1877), GAP = rr(0.019);
const BANDS = [];
let cursor = HUB + rr(0.013);
for (let i = 0; i < 3; i++) { BANDS.push({ i: cursor, o: cursor + BD }); cursor += BD + GAP; }
const CROWN = { i: cursor, o: R };
const GUT  = 1.15;                      // degrees of gutter each side of a sector
const MEDR = BD / 2 - px(5);            // medallion radius
const MEDR_NM = MEDR + GAP * 0.45;      // the two honest blanks break the ring on purpose

/* ---------------------------------------------------------------- scaffold */
const defs = el('defs', {}, svg);
const grad = el('radialGradient', { id: 'bloom', cx: '50%', cy: '50%', r: '50%' }, defs);
el('stop', { offset: '0%',  'stop-color': PAPER_DEEP }, grad);
el('stop', { offset: '58%', 'stop-color': PAPER }, grad);
el('stop', { offset: '100%','stop-color': PAPER }, grad);

el('rect', { x: 0, y: 0, width: W, height: H, fill: PAPER }, svg);
el('circle', { cx: CX, cy: CY, r: R * 1.16, fill: 'url(#bloom)' }, svg);

const gStatic = el('g', {}, svg);   // phyllotaxis grain + tick rings (armature)
const gBands  = el('g', {}, svg);
const gBars   = el('g', {}, svg);
const gRings  = el('g', {}, svg);
const gSpokes = el('g', {}, svg);
const gMeds   = el('g', {}, svg);
const gCrown  = el('g', {}, svg);
const gHub    = el('g', {}, svg);
const gHilite = el('g', {}, svg);   // live-mode selection veil + outline
const gChrome = el('g', {}, svg);
const gHit    = el('g', {}, svg);   // live-mode sector buttons (transparent, on top)

/* ---------------------------------------------------------------- text utils */
const ruler = el('text', { visibility: 'hidden', x: -9999, y: -9999 }, svg);
function measure(s, size, weight, cls) {
  ruler.setAttribute('font-size', f(size));
  ruler.setAttribute('font-weight', weight || 400);
  ruler.setAttribute('class', cls || '');
  ruler.setAttribute('letter-spacing', 0);
  ruler.textContent = s;
  return ruler.getComputedTextLength();
}
function txt(parent, s, a) { const t = el('text', a, parent); t.textContent = s; return t; }

/* shrink-to-fit that refuses to go below the artboard floor */
function fit(t, maxW, floor) {
  const lo = Math.max(floor === undefined ? MIN_PX : floor, 1);
  let size = parseFloat(t.getAttribute('font-size')), guard = 80;
  while (guard-- > 0 && t.getComputedTextLength() > maxW && size > lo) {
    size = Math.max(lo, size * 0.96); t.setAttribute('font-size', f(size));
  }
  return size;
}
/* greedy word wrap at a given size; returns array of lines */
function wrapAt(s, maxW, size, weight, cls) {
  const words = s.split(' '), lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (line && measure(test, size, weight, cls) > maxW) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}
/* wrap into at most maxLines, shrinking to the floor before giving up */
function wrapFit(s, maxW, size, weight, maxLines, cls) {
  let fs = size, guard = 40, lines = wrapAt(s, maxW, fs, weight, cls);
  while (guard-- > 0 && lines.length > maxLines && fs > MIN_PX) {
    fs = Math.max(MIN_PX, fs * 0.96);
    lines = wrapAt(s, maxW, fs, weight, cls);
  }
  return { size: fs, lines };
}
function drawLines(parent, lines, { x, y, size, lineH, weight, fill, anchor, cls, spacing }) {
  const g = [];
  lines.forEach((ln, i) => g.push(txt(parent, ln, {
    x: f(x), y: f(y + i * lineH), 'font-size': f(size), 'font-weight': weight, fill,
    'text-anchor': anchor || 'start', class: cls || null, 'letter-spacing': spacing ? f(spacing) : null,
  })));
  return g;
}
/* curved inscription — used only on the crown plate, where the radius is largest */
function arcLabel(parent, s, { r, a0, a1, size, fill, weight = 800, spacing = 0, id }) {
  const mid = ((a0 + a1) / 2 + 360) % 360;
  const rev = mid > 90 && mid < 270;                  // bottom half: reverse so text stays upright
  /* glyphs hang outward on a clockwise arc and inward on a reversed one, so the
     baseline moves half a cap-height the other way and the word stays centred
     on its plate instead of riding over the ring line. */
  const rad = s2 => (rev ? r + s2 * 0.36 : r - s2 * 0.36);
  const p = el('path', { id, d: arcPath(CX, CY, rad(size), a0, a1, rev), fill: 'none' }, defs);
  const t = el('text', {
    'font-size': f(size), 'font-weight': weight, fill, 'letter-spacing': f(spacing), 'text-anchor': 'middle',
  }, parent);
  const tp = el('textPath', { href: '#' + id, startOffset: '50%' }, t);
  tp.textContent = s;
  let s2 = size, guard = 60;

/* ============================================================== TIMELINE
   One "rendering" = slowed assembly with a 0.70s beat between stages, then a
   1.50s settled hold, then (for the looping GIF) a 0.60s reverse wipe.        */
const BEAT = 0.70, STAG = 0.10;
const T = {
  crown: [0.00, 1.30],
  ring3: [2.00, 3.10],
  ring2: [3.80, 4.90],
  ring1: [5.60, 6.70],
  hub:   [7.40, 8.45],
  roll:  [5.60, 8.45],
  settled: 8.45,
  holdEnd: 9.95,
  wipeEnd: 10.55,
};
const DUR = T.wipeEnd;
const RINGWIN = [T.ring1, T.ring2, T.ring3];
const fmt2 = v => v.toFixed(2).padStart(5, ' ');

/* each sector is staggered inside its stage window; the last one lands on the beat */
function revealOf(t, w, idx) {
  const span = (w[1] - w[0]) - 4 * STAG;
  const a = w[0] + idx * STAG;
  const up = easeInOut(win(t, a, a + span));
  if (t <= T.holdEnd) return up;
  return up * (1 - easeInOut(win(t, T.holdEnd, T.wipeEnd)));
}

function render(t) {
  t = clamp(t, 0, DUR);

  for (const c of art) {
    const k = revealOf(t, c.crownOnly ? T.crown : RINGWIN[c.ri], c.ii);
    const a1 = c.a0 + (c.a1 - c.a0) * k;

    if (c.crownOnly) {
      c.band.setAttribute('d', sectorPath(CX, CY, CROWN.i, CROWN.o, c.a0, a1));
      const pk = easeOutExpo(clamp((k - 0.40) / 0.60, 0, 1));
      c.plate.setAttribute('opacity', f(pk));
      c.lab.setAttribute('opacity', f(easeOutExpo(clamp((k - 0.58) / 0.42, 0, 1))));
      continue;
    }
    c.band.setAttribute('d', sectorPath(CX, CY, c.B.i, c.B.o, c.a0, a1));
    c.pg.setAttribute('opacity', f(0.55 * easeOutExpo(clamp((k - 0.35) / 0.65, 0, 1))));

    if (c.bar) {
      const grow = easeOutExpo(clamp((k - 0.15) / 0.85, 0, 1)) * (+c.bar.dataset.frac);
      c.bar.setAttribute('d', grow <= 0.002 ? 'M0 0' : sectorPath(CX, CY, c.B.i, c.B.i + BD * grow, c.a0, c.a1));
      c.cap.setAttribute('d', grow <= 0.002 ? 'M0 0' : arcPath(CX, CY, c.B.i + BD * grow, c.a0, c.a1, false));
    }
    const mk = clamp((k - 0.52) / 0.48, 0, 1);
    c.med.setAttribute('opacity', mk > 0 ? 1 : 0);
    c.scale.setAttribute('transform', `scale(${f(mk <= 0 ? 0.001 : lerp(0.66, 1, easeOutBack(mk)))})`);
  }

  const hk = revealOf(t, T.hub, 0);
  const deg = 360 * 0.58 * easeOutExpo(hk);
  const d = deg < 0.4 ? 'M0 0' : arcPath(CX, CY, hub.gr, 0, deg, false);
  hub.sweep.setAttribute('d', d); hub.sweep2.setAttribute('d', d);
  hub.big.textContent = '−' + String(Math.round(58 * easeOutExpo(hk))) + '%';
  gHub.setAttribute('opacity', f(0.12 + 0.88 * Math.min(1, hk * 3)));

  let rk = easeOutExpo(win(t, T.roll[0], T.roll[1]));
  if (t > T.holdEnd) rk = 1 - easeInOut(win(t, T.holdEnd, T.wipeEnd));
  headNum.textContent = fmt2(68.01 * rk) + '%';
}

/* frame plan for the exporter: moving frames at `fps`, one long frame per beat */
function framePlan(fps, opts) {
  const wipe = !opts || opts.wipe !== false;
  const dt = 1 / fps, ms = Math.round(dt * 1000), out = [];
  const seg = (a, b) => { for (let t = a; t < b - 1e-6; t += dt) out.push({ t: +t.toFixed(4), delay: ms }); };
  const beat = t => out.push({ t: +t.toFixed(4), delay: Math.round(BEAT * 1000) });
  seg(T.crown[0], T.crown[1]); beat(T.crown[1]);
  seg(T.ring3[0], T.ring3[1]); beat(T.ring3[1]);
  seg(T.ring2[0], T.ring2[1]); beat(T.ring2[1]);
  seg(T.ring1[0], T.ring1[1]); beat(T.ring1[1]);
  seg(T.hub[0], T.hub[1]);
  out.push({ t: T.settled, delay: 1500 });
  if (wipe) for (let t = T.holdEnd + dt; t <= T.wipeEnd + 1e-6; t += dt) out.push({ t: +t.toFixed(4), delay: ms });
  return out;
}

/* ---------------------------------------------------------------- driver */
/* WCAG 2.2.2 (site standards, 2026-09-24): the intro runs longer than five seconds, so a visible
   button stops it on the settled frame. It exists only while the intro plays. */
function skipButton(onSkip) {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = 'Skip animation';
  b.style.cssText = 'position:fixed;top:10px;right:10px;z-index:20;min-height:44px;padding:10px 16px;border:1px solid #0f2440;border-radius:8px;background:#ffffff;color:#0f2440;font:600 14px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer';
  b.addEventListener('click', () => { onSkip(); b.remove(); });
  document.body.append(b);
  return b;
}
let raf = 0, skip = null;
const stopAnim = () => { if (raf) cancelAnimationFrame(raf); raf = 0; if (skip) { skip.remove(); skip = null; } };
function playOnce() {
  stopAnim();
  const t0 = performance.now();
  const step = now => {
    const t = (now - t0) / 1000;
    if (t >= T.settled) { render(T.settled); raf = 0; if (skip) { skip.remove(); skip = null; } return; }
    render(t); raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
  skip = skipButton(() => { stopAnim(); render(T.settled); });
}
render(tParam !== null ? parseFloat(tParam) : (POSTER || REDUCED ? T.settled : 0));
if (!POSTER && !REDUCED) playOnce();

/* ============================================================== LIVE MODE */
const SERP_DIR = '/images/blog/serp-examples/';
let selected = null;
let panel = null, promptEl = null;

function parentBase() {
  /* Published copy (mj2.pro): the fallback link targets the embedding post itself when it is
     same-origin (a same-document jump, query string kept), then a same-origin ?parent=, else the
     post on this origin. Cross-origin values are ignored so the link cannot be pointed off-site. */
  try {
    const p = window.parent;
    if (p && p !== window && p.location.origin === location.origin) return p.location.origin + p.location.pathname + p.location.search;
  } catch (e) {}
  try {
    const raw = Q.get('parent');
    if (raw) { const u = new URL(raw, location.href); if (u.origin === location.origin) return u.origin + u.pathname + u.search; }
  } catch (e) {}
  return new URL('/blog/search-results-by-intent/', location.href).href;
}

/* a drawn, clearly-labelled stand-in — never a fake screenshot */
function mockSerp(it) {
  const w = 640, h = 380, pad = 18;
  const blk = (x, y, ww, hh, fill, stroke, rx) =>
    `<rect x="${x}" y="${y}" width="${ww}" height="${hh}" rx="${rx === undefined ? 4 : rx}" fill="${fill}"${stroke ? ` stroke="${stroke}" stroke-width="1.4"` : ''}/>`;
  const line = (x, y, ww, op) => `<rect x="${x}" y="${y}" width="${ww}" height="7" rx="3.5" fill="#14100B" opacity="${op || 0.30}"/>`;
  const tag = (x, y, s, fill) =>
    `<text x="${x}" y="${y}" font-size="13" font-weight="800" fill="${fill || '#14100B'}" font-family="ui-sans-serif,system-ui,sans-serif" letter-spacing="0.6">${s}</text>`;
  const note = (x, y, s) =>
    `<text x="${x}" y="${y}" font-size="12.5" font-weight="600" fill="#5B5147" font-family="ui-sans-serif,system-ui,sans-serif">${s}</text>`;

  let body = '';
  const top = 74;
  if (it.slug === 'informational' || it.slug === 'commercial') {
    const label = it.slug === 'commercial' ? 'AI OVERVIEW — “X vs Y”' : 'AI OVERVIEW';
    body += blk(pad, top, w - 2 * pad, 150, tint(it.hue, 0.13), shade(it.hue, 0.35), 8);
    body += tag(pad + 14, top + 26, label, shade(it.hue, 0.55));
    body += line(pad + 14, top + 42, w - 2 * pad - 120) + line(pad + 14, top + 60, w - 2 * pad - 60)
         +  line(pad + 14, top + 78, w - 2 * pad - 180);
    body += note(pad + 14, top + 108, 'cited sources');
    for (let i = 0; i < 3; i++) body += blk(pad + 14 + i * 96, top + 118, 86, 20, '#FFFFFF', shade(it.hue, 0.3), 5);
    body += tag(pad, top + 190, 'ORGANIC RESULTS');
    body += line(pad, top + 208, 300, 0.5) + line(pad, top + 224, 460, 0.22);
    body += line(pad, top + 252, 260, 0.5) + line(pad, top + 268, 420, 0.22);
  } else if (it.slug === 'transactional') {
    body += blk(pad, top, w - 2 * pad, 86, tint(it.hue, 0.10), shade(it.hue, 0.35), 8);
    body += tag(pad + 14, top + 24, 'SPONSORED — TEXT ADS + SHOPPING', shade(it.hue, 0.55));
    for (let i = 0; i < 4; i++) body += blk(pad + 14 + i * 142, top + 34, 130, 38, '#FFFFFF', shade(it.hue, 0.3), 5);
    body += tag(pad, top + 128, 'ORGANIC RESULTS');
    body += line(pad, top + 146, 320, 0.5) + line(pad, top + 162, 470, 0.22);
    body += line(pad, top + 190, 250, 0.5) + line(pad, top + 206, 430, 0.22);
    body += line(pad, top + 234, 290, 0.5) + line(pad, top + 250, 400, 0.22);
  } else if (it.slug === 'navigational') {
    body += tag(pad, top + 16, 'ONE DOMINANT RESULT + SITELINKS');
    body += line(pad, top + 34, 300, 0.55) + line(pad, top + 50, 420, 0.22);
    for (let i = 0; i < 4; i++) body += blk(pad, top + 66 + Math.floor(i / 2) * 30, 190, 22, '#FFFFFF', '#C9BCA6', 4)
      .replace('x="' + pad + '"', 'x="' + (pad + (i % 2) * 200) + '"');
    body += blk(w - pad - 190, top, 190, 210, tint(it.hue, 0.12), shade(it.hue, 0.35), 8);
    body += tag(w - pad - 176, top + 26, 'KNOWLEDGE PANEL', shade(it.hue, 0.6));
    body += line(w - pad - 176, top + 44, 140, 0.3) + line(w - pad - 176, top + 62, 110, 0.3);
    body += tag(pad, top + 190, 'ORGANIC RESULTS');
    body += line(pad, top + 208, 270, 0.5) + line(pad, top + 224, 380, 0.22);
  } else {
    body += blk(pad, top, 230, 170, tint(it.hue, 0.16), shade(it.hue, 0.35), 8);
    body += tag(pad + 14, top + 24, 'MAP', shade(it.hue, 0.6));
    body += `<circle cx="${pad + 90}" cy="${top + 96}" r="9" fill="${shade(it.hue, 0.25)}"/>`;
    body += `<circle cx="${pad + 150}" cy="${top + 70}" r="9" fill="${shade(it.hue, 0.25)}"/>`;
    body += `<circle cx="${pad + 130}" cy="${top + 128}" r="9" fill="${shade(it.hue, 0.25)}"/>`;
    body += tag(pad + 250, top + 18, 'LOCAL PACK — 3 LISTINGS', shade(it.hue, 0.6));
    for (let i = 0; i < 3; i++) {
      body += blk(pad + 250, top + 30 + i * 48, w - pad - 250 - pad, 40, '#FFFFFF', shade(it.hue, 0.3), 6);
      body += line(pad + 264, top + 48 + i * 48, 150, 0.45);
    }
    body += tag(pad, top + 208, 'ORGANIC RESULTS');
    body += line(pad, top + 226, 280, 0.5) + line(pad, top + 242, 400, 0.22);
  }

  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Representative rendering of a ${it.name.toLowerCase()} results page, drawn from the ledger.">
    <rect width="${w}" height="${h}" fill="#FFFDF7"/>
    <rect x="${pad}" y="20" width="${w - 2 * pad}" height="34" rx="17" fill="#FFFFFF" stroke="#C9BCA6" stroke-width="1.4"/>
    <text x="${pad + 18}" y="42" font-size="14" font-weight="600" fill="#5B5147" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">${it.queries[0]}</text>
    ${body}
    <rect x="0" y="${h - 26}" width="${w}" height="26" fill="#14100B"/>
    <text x="${pad}" y="${h - 8}" font-size="12.5" font-weight="800" fill="#FFE600" letter-spacing="0.8" font-family="ui-sans-serif,system-ui,sans-serif">REPRESENTATIVE RENDERING — DRAWN FROM THE LEDGER, NOT A SCREENSHOT</text>
  </svg>`;
}

function buildPanel() {
  panel = document.createElement('div');
  panel.id = 'panel';
  panel.hidden = true;
  panel.setAttribute('role', 'region');
  panel.setAttribute('aria-live', 'polite');
  panel.setAttribute('aria-label', 'What this search usually returns');
  document.getElementById('app').appendChild(panel);
}

function renderPanel(it) {
  const slug = it.slug;
  const base = parentBase();
  const href = (base ? base : '') + '#intent-' + slug;
  const stats = it.dom.map(d => `<p class="stat"><b>${d.what} — ${d.rate}</b><br>${d.tail}<span class="src">${d.src}</span></p>`).join('');
  const qs = it.queries.map(q => `<li>${q}</li>`).join('');
  panel.innerHTML = `
    <div class="phead">
      <span class="swatch" style="background:${it.hue}"></span>
      <h3>${it.name}</h3>
      <button class="close" type="button" aria-label="Close this panel">Close ×</button>
    </div>
    <div class="pbody">
      <div>
        <h4>What this search usually returns</h4>
        <p class="stat" style="font-weight:650">${it.lede}</p>
        ${stats}
        <h4 style="margin-top:14px">Queries like this on this site</h4>
        <ul>${qs}</ul>
        <p style="margin:14px 0 0"><a class="jump" href="${href}" target="_top" data-intent="${slug}">Read the ${it.name.toLowerCase()} section ↓</a></p>
      </div>
      <figure>
        <div class="shot"></div>
        <figcaption class="cap"></figcaption>
      </figure>
    </div>`;
  panel.querySelector('.close').addEventListener('click', () => selectIntent(null));
  panel.querySelector('.jump').addEventListener('click', () => {
    try { if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'viz-intent', intent: slug }, '*'); } catch (e) {}
  });

  /* real capture if the research folder has one; a labelled drawing if not */
  const holder = panel.querySelector('.shot'), cap = panel.querySelector('.cap');
  const img = new Image();
  img.alt = `Representative rendering of a desktop results page for a ${it.name.toLowerCase()} query, drawn from the ledger (not a screenshot). Real capture pending.`;
  img.onload = () => {
    holder.innerHTML = ''; holder.appendChild(img);
    cap.textContent = 'Representative rendering, drawn from the ledger — not a screenshot. Real capture pending.';
  };
  img.onerror = () => {
    holder.innerHTML = mockSerp(it);
    cap.textContent = 'Representative rendering, drawn from the ledger — not a screenshot.';
  };
  holder.innerHTML = mockSerp(it);
  cap.textContent = 'Representative rendering, drawn from the ledger — not a screenshot.';
  img.src = SERP_DIR + slug + '-desktop.png';
}

function paintSelection() {
  HILITE.forEach((hl, i) => {
    const on = selected !== null;
    hl.veil.setAttribute('opacity', on && i !== selected ? 0.62 : 0);
    hl.ring.setAttribute('opacity', on && i === selected ? 1 : 0);
  });
  HITS.forEach((p, i) => p.setAttribute('aria-pressed', selected === i ? 'true' : 'false'));
}

function selectIntent(id) {
  let idx = null;
  if (id !== null && id !== undefined && id !== false) {
    idx = typeof id === 'number' ? id : INTENTS.findIndex(x => x.slug === String(id).toLowerCase());
    if (idx < 0) return false;
  }
  selected = idx;
  paintSelection();
  if (!panel) return true;
  if (idx === null) { panel.hidden = true; panel.innerHTML = ''; return true; }
  renderPanel(INTENTS[idx]);
  panel.hidden = false;
  return true;
}

const HITS = [];
if (!POSTER) {
  document.body.classList.add('live');
  promptEl = document.createElement('p');
  promptEl.id = 'prompt';
  promptEl.innerHTML = '<b>Click a sector</b>: see what that search usually returns, then jump to its section.';
  const app = document.getElementById('app');
  app.insertBefore(promptEl, app.firstChild);
  buildPanel();

  INTENTS.forEach((it, ii) => {
    const A = ii * 72;
    const p = el('path', {
      d: sectorPath(CX, CY, HUB, CROWN.o, A - 36, A + 36),
      fill: 'transparent', class: 'hit', role: 'button', tabindex: '0',
      'aria-pressed': 'false',
      'aria-label': `${it.name} — see what that search usually returns`,
    }, gHit);
    p.addEventListener('click', () => selectIntent(selected === ii ? null : ii));
    p.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); selectIntent(selected === ii ? null : ii); }
      if (e.key === 'Escape') selectIntent(null);
    });
    p.addEventListener('focus', () => HILITE[ii].ring.setAttribute('opacity', 1));
    p.addEventListener('blur',  () => paintSelection());
    HITS.push(p);
  });
}

/* ---------------------------------------------------------------- audit */
function audit() {
  const under = [], boxes = [];
  const scale = 1080 / W;
  for (const t of svg.querySelectorAll('text')) {
    if (t === ruler) continue;
    const size = parseFloat(getComputedStyle(t).fontSize) * scale;
    const s = (t.textContent || '').trim();
    if (!s) continue;
    if (size < 13.95) under.push({ text: s.slice(0, 60), size: Math.round(size * 100) / 100 });
    if (t.querySelector('textPath')) continue;      // crown inscriptions sit alone on their plate
    const b = t.getBoundingClientRect();
    boxes.push({ text: s.slice(0, 40), x: b.left, y: b.top, w: b.width, h: b.height });
  }
  const overlaps = [];
  for (let i = 0; i < boxes.length; i++) for (let j = i + 1; j < boxes.length; j++) {
    const a = boxes[i], b = boxes[j];
    const ox = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
    const oy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
    if (ox > 1.5 && oy > 1.5) overlaps.push({ a: a.text, b: b.text, ox: Math.round(ox), oy: Math.round(oy) });
  }
  return { size: [W, H], minRequired: 14, under, overlaps, textCount: boxes.length };
}

window.VIZ = {
  ready: Promise.resolve(true), duration: DUR, settled: T.settled, size: [W, H], beat: BEAT,
  seek: s => { stopAnim(); render(+s); },
  seekMs: v => { stopAnim(); render(+v / 1000); },
  play: playOnce, stop: stopAnim,
  framePlan, audit, selectIntent,
  get selected() { return selected === null ? null : INTENTS[selected].slug; },
  intents: INTENTS.map(i => i.slug),
};
document.documentElement.dataset.ready = '1';
})();
</script>
